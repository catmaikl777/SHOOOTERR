# ============================================================
#  Fly.io — бэкенд PIXEL ORCA
#  Как применить:
#    1) fly launch --no-deploy --copy-config   (или скопировать этот файл вручную)
#    2) fly volumes create kosatka_data --size 1
#    3) fly deploy
#    4) fly secrets set PUBLIC_URL=https://<app>.fly.dev
#
#  ВАЖНО: масштабировать только до 1 машины. Лобби, рейды и аккаунты
#  живут в памяти процесса, две реплики = два разных мира.
# ============================================================
app = "kosatka"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  DATA_FILE = "/data/db.json"
  STATIC_DIR = "/app"
  PVP_MS = "30000"
  RAID_MS = "60000"
  TICK = "250"
  SEASON_MS = "2592000000"

[[mounts]]
  source = "kosatka_data"
  destination = "/data"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"        # не "suspend": suspend рвёт WebSocket
  auto_start_machines = true
  min_machines_running = 1           # чтобы после простоя не ждал холодного старта

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
