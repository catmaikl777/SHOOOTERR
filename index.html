    this.time.delayedCall(1500, ()=>{
      if (!this.isHost) return
      const angle = Math.random() * Math.PI * 2
      let x, y, tries = 0
      do {
        x = CFG.W/2 + Math.cos(angle) * (200 + Math.random()*300)
        y = CFG.H/2 + Math.sin(angle) * (200 + Math.random()*300)
        tries++
      } while (this.isInsideWall(x, y, 40) && tries < 40)
      if (tries < 40){
        this.pickups.push({ id:'pk_'+(++this.pickupSeq), type:'sprayer', x, y })
        const sp = this._spatial(x, y, 0.6)
        this.sfx.pickupSpawn(sp.pan, sp.vol)
      }
    })
  }

  /* =========== DASH =========== */
  _bindDashButton(){
    const fire = (e) => {
      if (e){ e.preventDefault(); e.stopPropagation() }
      this.tryDash()
    }
    this.dashBtn.addEventListener('pointerdown', fire)
    this.dashBtn.addEventListener('contextmenu', e => e.preventDefault())
  }

  tryDash(){
    const now = performance.now()
    if (this.local.dead) return
    if (now < this.dash.cdUntil) return

    let dx = this.moveVec.x, dy = this.moveVec.y
    if (Math.hypot(dx, dy) < 0.2){
      dx = this.aimVec.x; dy = this.aimVec.y
    }
    const len = Math.hypot(dx, dy) || 1
    this.dash.dirX = dx/len
    this.dash.dirY = dy/len
    this.dash.until = now + CFG.DASH_DURATION
    this.dash.cdUntil = now + CFG.DASH_CD
    this.dashSeq++

    this.sfx.dash(0, 1)
    this.cameras.main.shake(90, 0.0035)
    this._spawnDashTrail()
  }

  _spawnDashTrail(){
    const me = this.views[this.myPeerId]
    if (!me) return
    const g = this.add.graphics().setDepth(8)
    g.fillStyle(0xff2266, 0.6)
    g.fillCircle(me.sprite.x - this.dash.dirX * 6,
                 me.sprite.y - this.dash.dirY * 6, CFG.PLAYER_R * 0.85)
    this.tweens.add({
      targets: g, alpha: 0, scale: 1.6, duration: 260,
      onComplete: () => g.destroy(),
    })
  }

  updateDashButton(){
    if (!this.dashBtn) return
    const now = performance.now()
    const onCd = now < this.dash.cdUntil
    const dead = this.local.dead
    const locked = onCd || dead
    this.dashBtn.classList.toggle('cooling', locked)
    if (onCd){
      this.dashBtn.textContent = Math.ceil((this.dash.cdUntil - now)/1000) + 's'
    } else {
      this.dashBtn.textContent = '⚡'
    }
  }

  /* =========== WEAPON SWAP =========== */
  _bindWeaponButton(){
    const swap = (e) => {
      if (e){ e.preventDefault(); e.stopPropagation() }
      this.toggleWeapon()
    }
    this.weaponBtn.addEventListener('pointerdown', swap)
    this.weaponBtn.addEventListener('contextmenu', e => e.preventDefault())
    this.updateWeaponButton()
  }

  toggleWeapon(){
    if (this.local.dead) return
    this.weapon = this.weapon === 'rifle' ? 'grenade' : 'rifle'
    this._lastLocalShot = 0
    this.sfx.weaponSwap(0, 1)
    this.updateWeaponButton()
  }

  updateWeaponButton(){
    if (!this.weaponBtn) return
    if (this.weapon === 'rifle'){
      this.weaponBtn.textContent = '🔫'
      this.weaponBtn.classList.remove('grenade')
    } else {
      this.weaponBtn.textContent = '💣'
      this.weaponBtn.classList.add('grenade')
    }
  }

  /* =========== KILLFEED =========== */
  addKillFeed(killerName, victimName, isMine, weaponEmoji){
    if (!this.killfeedEl) return
    const el = document.createElement('div')
    el.className = 'kf' + (isMine ? ' mine' : '')
    el.innerHTML =
      `<span class="who">${escapeHtml(killerName)}</span>` +
      `<span class="wp">${weaponEmoji}</span>` +
      `<span class="vic">${escapeHtml(victimName)}</span>`
    this.killfeedEl.appendChild(el)
    while (this.killfeedEl.children.length > 5){
      this.killfeedEl.removeChild(this.killfeedEl.firstChild)
    }
    setTimeout(() => {
      if (!el.parentNode) return
      el.style.transition = 'opacity .4s, transform .4s'
      el.style.opacity = '0'
      el.style.transform = 'translateX(-24px)'
      setTimeout(() => el.remove(), 450)
    }, 5000)
  }

  flashVignette(){
    if (!this.vignetteEl) return
    this.vignetteEl.style.transition = 'opacity .08s'
    this.vignetteEl.style.opacity = '1'
    setTimeout(() => {
      this.vignetteEl.style.transition = 'opacity .6s'
      this.vignetteEl.style.opacity = '0'
    }, 110)
  }

  /* =========== МУЗЫКА =========== */
  _setupMusic(){
    try {
      if (!this.cache.audio.exists('bgm')){
        DBG.warn('BGM', 'music.mp3 не найден')
        return
      }
      this.bgm = this.sound.add('bgm', { loop: true, volume: CFG.BGM_VOLUME })
      const tryPlay = () => {
        if (!this.sfx.enabled) return
        if (this.bgm && !this.bgm.isPlaying){
          try { this.bgm.play() } catch(e){}
        }
      }
      const isLocked = this.sound && this.sound.locked
      if (isLocked) this.sound.once('unlocked', tryPlay)
      else tryPlay()
    } catch(e){}
  }

  toggleSound(){
    this.sfx.setEnabled(!this.sfx.enabled)
    this.soundBtn.textContent = this.sfx.enabled ? '🔊' : '🔇'
    if (this.bgm){
      try {
        if (this.sfx.enabled){
          if (!this.bgm.isPlaying) this.bgm.play()
          if (typeof this.bgm.setVolume === 'function') this.bgm.setVolume(CFG.BGM_VOLUME)
        } else {
          this.bgm.pause()
        }
      } catch(e){}
    }
  }

  updateCameraZoom(){
    const w = this.scale.width, h = this.scale.height
    const shortSide = Math.min(w, h)
    const worldView = shortSide < 600 ? 450 : 700
    const zoom = clamp(shortSide / worldView, 0.9, 2.5)
    this.cameras.main.setZoom(zoom)
  }

  setupJoysticks(){
    this.moveVec = { x:0, y:0 }
    this.aimVec = { x:1, y:0 }
    this.firing = false

    const joyL = nipplejs.create({
      zone: document.getElementById('joyL'), mode:'static',
      position:{left:'50%',top:'50%'}, color:'#1133ff', size:110, threshold:0.1,
    })
    joyL.on('move', (e,d)=>{
      const f = Math.min(d.force,1)
      this.moveVec.x = Math.cos(d.angle.radian)*f
      this.moveVec.y = -Math.sin(d.angle.radian)*f
    })
    joyL.on('end', ()=>{ this.moveVec.x=0; this.moveVec.y=0 })

    const joyR = nipplejs.create({
      zone: document.getElementById('joyR'), mode:'static',
      position:{left:'50%',top:'50%'}, color:'#ff2266', size:110, threshold:0.1,
    })
    joyR.on('start', ()=>{ this.firing = true })
    joyR.on('move', (e,d)=>{
      const f = Math.min(d.force,1)
      const ax = Math.cos(d.angle.radian), ay = -Math.sin(d.angle.radian)
      if (f > 0.15){
        this.aimVec.x = ax; this.aimVec.y = ay
        this.aimForce = f
      }
      this.firing = f > 0.25
    })
    /* 🆕 БРОСОК ПО ОТПУСКАНИЮ */
    joyR.on('end', ()=>{
      const wasFiring = this.firing
      this.firing = false
      if (wasFiring && this.weapon === 'grenade' && !this.local.dead){
        this._doGrenadeThrow()
      }
    })
  }

  /* 🆕 выполнить бросок гранаты (на отпускании стика) */
  _doGrenadeThrow(){
    const now = performance.now()
    if (now - this.lastLocalThrow < CFG.GRENADE_CD) return
    this.lastLocalThrow = now
    this.throwSeq++

    /* для хоста не предсказываем локально — он сам авторитетно бросит через simulateHost */
    if (this.isHost) return

    const len = Math.hypot(this.aimVec.x, this.aimVec.y) || 1
    const ax = this.aimVec.x / len
    const ay = this.aimVec.y / len
    const force = clamp(this.aimForce || 1, CFG.GRENADE_MIN_FORCE, 1)
    this.sfx.grenadeThrow(0, 1)
    this.spawnLocalGrenade(ax, ay, force)
  }

  _spatial(srcX, srcY, mul=1){
    const dx = srcX - this.local.x
    const dy = srcY - this.local.y
    const dist = Math.hypot(dx, dy)
    const pan = clamp(dx / 500, -1, 1)
    const vol = clamp(1 - dist / CFG.SFX_MAX_DIST, 0.1, 1) * mul
    return { pan, vol }
  }

  _computeFireBehavior(bonuses, now){
    const rapid = bonuses[0] > now
    const homing = bonuses[1] > now
    const ricochet = bonuses[2] > now
    const sprayer = bonuses[4] > now

    if (sprayer){
      return {
        fireCd: CFG.BONUS_SPRAYER_FIRE_CD,
        opts: { homing: false, ricochet: 0, sprayer: true },
        kind: 'sprayer',
      }
    }

    let fireCd = CFG.FIRE_CD
    if (rapid) fireCd = CFG.FIRE_CD * CFG.BONUS_FIRE_MUL
    if (homing) fireCd = Math.max(fireCd, CFG.BONUS_HOMING_FIRE_CD)

    const opts = {
      homing: homing,
      ricochet: ricochet ? CFG.BONUS_RICOCHET_MAX : 0,
      sprayer: false,
    }
    let kind = 'normal'
    if (homing && ricochet) kind = 'homingRicochet'
    else if (homing) kind = 'homing'
    else if (ricochet) kind = 'ricochet'

    return { fireCd, opts, kind }
  }

  /* ============================================================
     NETWORK
     ============================================================ */
  setupNetwork(){
    this.handlers = {
      in:   (d, id) => this.onNetInput(d, id),
      st:   (d, id) => this.onNetState(d, id),
      bl:   (d, id) => this.onNetBullet(d, id),
      hit:  (d, id) => this.onNetHit(d, id),
      gex:  (d, id) => this.onNetExplosion(d, id),
      tok:  (d, id) => this.onNetToken(d, id),
      ban:  (d, id) => this.onNetBan(d, id),
      png:  (d, id) => this.onNetPing(d, id),
      id:   (d, id) => this.onNetIdentity(d, id),
      vote: (d, id) => this.onNetVote(d, id),
    }
    this.connectToRelay()
  }

  connectToRelay(){
    try { this.ws = new WebSocket(RELAY_URL) }
    catch(e){ DBG.err('NET', 'ws fail', e); return }

    this.ws.onopen = () => {
      this.reconnectAttempts = 0
      this.ws.send(JSON.stringify({ type: 'join', room: this.roomId, password: this.roomPassword || '' }))
    }

    this.ws.onmessage = ev => {
      let msg
      try { msg = JSON.parse(ev.data) } catch { return }
      const { type } = msg

      if (type === 'banned'){
        try { this.ws.close() } catch {}
        alert('Вас забанил сервер античита: ' + msg.reason)
        return
      }
      if (type === 'error') return

      if (type === 'welcome'){
        this.serverHostId = msg.host
        this.migrateMyId(msg.peerId)
        const iAmHost = (msg.host === msg.peerId)
        if (iAmHost){
          this.isHost = true
          this.hasBecomeClient = false
          this.peerNames[this.myPeerId] = this.myName
          this.sendId({ pubHash:this.identity.pubHash, mode:this.identity.mode, name:this.myName }, this.myPeerId)
          this.becomeHost()
        } else {
          this.isHost = false
          this.hasBecomeClient = true
          for (const peerId of msg.peers){
            if (peerId === this.myPeerId) continue
            this.peers.add(peerId)
            if (!this.views[peerId]) this.createView(peerId)
            this.ac.ensure(peerId)
          }
          this.peerNames[this.myPeerId] = this.myName
          if (msg.host){
            this.sendId({ pubHash:this.identity.pubHash, mode:this.identity.mode, name:this.myName }, msg.host)
            this.sendTok({ request:true }, msg.host)
            this.sendId({ challenge:'hello-from-' + this.myPeerId }, msg.host)
          }
        }
        this.updateStatus()
        return
      }

      if (type === 'peer-join'){
        this.sfx.join(0, 0.7)
        this.peers.add(msg.peerId)
        if (!this.views[msg.peerId]) this.createView(msg.peerId)
        this.ac.ensure(msg.peerId)
        if (this.isHost){
          this.addPlayerToWorld(msg.peerId)
          const p = this.ac.ensure(msg.peerId)
          p.nonce = randomToken(12)
          this.sendId({ challenge: p.nonce }, msg.peerId)
          this.sendTok({ token: this.ac.issueToken(msg.peerId) }, msg.peerId)
        }
        this.updateStatus()
        return
      }

      if (type === 'peer-leave'){
        this.sfx.leave(0, 0.7)
        this.peers.delete(msg.peerId)
        this.onPeerLeft(msg.peerId)
        this.destroyView(msg.peerId)
        delete this.scores[msg.peerId]
        delete this.peerNames[msg.peerId]
        delete this.worldPlayers[msg.peerId]
        this.updateStatus()
        return
      }

      if (type === 'host-change'){
        this.serverHostId = msg.host
        if (msg.host === this.myPeerId){
          this.isHost = true
          this.hasBecomeClient = false
          this.becomeHost()
        } else {
          this.isHost = false
          this.hasBecomeClient = true
        }
        this.updateStatus()
        return
      }

      const h = this.handlers[msg.a]
      if (h) h(msg.d, msg.from)
    }

    this.ws.onerror = err => DBG.err('NET', 'ws err', err)
    this.ws.onclose = ev => {
      if (this.reconnectAttempts < 30){
        this.reconnectAttempts++
        const delay = Math.min(2000 * this.reconnectAttempts, 10000)
        setTimeout(() => this.connectToRelay(), delay)
      }
    }
  }

  migrateMyId(newId){
    const oldId = this.myPeerId
    if (oldId === newId) return
    const v = this.views[oldId]
    if (v){ this.views[newId] = v; delete this.views[oldId] }
    if (this.peerNames[oldId]){ this.peerNames[newId] = this.peerNames[oldId]; delete this.peerNames[oldId] }
    this.peerNames[newId] = this.myName
    this.myPeerId = newId
    this.updateStatus()
  }

  sendTo(action, data, peerId){
    if (!this.ws || this.ws.readyState !== 1) return
    this.ws.send(JSON.stringify({ to: peerId, data: { a: action, d: data } }))
  }
  broadcast(action, data){
    if (!this.ws || this.ws.readyState !== 1) return
    this.ws.send(JSON.stringify({ data: { a: action, d: data } }))
  }

  sendInput  (d, id) { this.sendTo('in', d, id) }
  sendState  (d, id) { this.sendTo('st', d, id) }
  sendBullet (d)     { this.broadcast('bl', d) }
  sendHit    (d)     { this.broadcast('hit', d) }
  sendExplosion(d)   { this.broadcast('gex', d) }
  sendTok    (d, id) { this.sendTo('tok', d, id) }
  sendBan    (d, id) { this.sendTo('ban', d, id) }
  sendPing   (d, id) { this.sendTo('png', d, id) }
  sendId     (d, id) { this.sendTo('id', d, id) }
  sendVote   (d){
    if (this.isHost){ this.broadcast('vote', d) }
    else {
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId) this.sendTo('vote', d, hostId)
    }
  }

  onNetInput(data, fromId){
    if (!this.isHost) return
    if (this.ac.bans.has(fromId)) return
    if (!this.ac.validateInput(fromId, data)) return
    data._t = performance.now()
    this.inputs[fromId] = data
  }
  onNetState(data){
    if (this.isHost) return
    this.applyState(data)
  }
  onNetBullet(data){
    if (this.isHost) return
    if (data.owner === this.myPeerId){
      const prefix = 'local_' + this.myPeerId
      const now = performance.now()
      let fresh = false
      for (const k in this.ghostBullets){
        if (k.startsWith(prefix) && now - this.ghostBullets[k].born < 300){ fresh = true; break }
      }
      if (fresh) return
    }
    const owner = this.views[data.owner]
    if (data.grenade){
      if (owner){
        const sp = this._spatial(owner.sprite.x, owner.sprite.y)
        this.sfx.grenadeThrow(sp.pan, sp.vol)
      } else {
        this.sfx.grenadeThrow(0, 0.4)
      }
    } else {
      let kind = 'normal'
      if (data.sprayer) kind = 'sprayer'
      else if (data.homing && data.ricochet) kind = 'homingRicochet'
      else if (data.homing) kind = 'homing'
      else if (data.ricochet) kind = 'ricochet'
      if (owner){
        const sp = this._spatial(owner.sprite.x, owner.sprite.y)
        this.sfx.shoot(kind, sp.pan, sp.vol)
      } else {
        this.sfx.shoot(kind, 0, 0.4)
      }
    }
    this.spawnGhostBullet(data)
  }
  onNetHit(data){
    if (this.isHost) return
    this.applyHit(data)
  }
  onNetExplosion(data){
    if (this.isHost) return
    this.applyExplosion(data)
  }
  onNetToken(data, fromId){
    if (data.request){
      if (this.isHost){
        const tok = this.ac.issueToken(fromId)
        this.sendTok({ token: tok }, fromId)
      }
    } else if (data.token){
      this.ac.setMyToken(data.token)
    }
  }
  onNetBan(data){
    if (data.full){
      if (Array.isArray(data.bans)) for (const id of data.bans) this.ac.bans.add(id)
      if (Array.isArray(data.pbans)){
        for (const h of data.pbans) this.ac.persistentBans.add(h)
        this.ac.savePersistentBans()
      }
    } else if (data.id){
      this.ac.bans.add(data.id)
      if (data.pubHash) { this.ac.persistentBans.add(data.pubHash); this.ac.savePersistentBans() }
      this.onAntiCheatBan(data.id, data.reason || 'banned', !!data.pubHash)
    }
  }
  onNetPing(data, fromId){
    const p = this.ac.ensure(fromId)
    if (data.pong){
      p.rtt = performance.now() - data.t
      p.lastUpdate = performance.now()
    } else {
      this.sendPing({ t: data.t, pong: 1 }, fromId)
    }
  }
  async onNetIdentity(data, fromId){
    if (data.name){
      const n = cleanName(data.name)
      if (n){
        this.peerNames[fromId] = n
        const v = this.views[fromId]
        if (v && v.label) v.label.setText(n)
        this.renderScores()
      }
    }
    if (data.challenge){
      const sig = await this.identity.sign(data.challenge)
      this.sendId({
        pubJwk: this.identity.pubJwk || null,
        pubHash: this.identity.pubHash,
        sig, mode: this.identity.mode, name: this.myName,
      }, fromId)
    } else if (data.pubHash){
      if (!this.isHost) return
      const p = this.ac.ensure(fromId)
      p.pubHash = data.pubHash
      p.pubJwk = data.pubJwk
      if (data.mode === 'crypto' && data.pubJwk && data.sig){
        p.verified = await this.identity.verify(data.pubJwk, p.nonce || '', data.sig)
      }
      if (this.ac.isPersistentlyBanned(data.pubHash)){ this.ac.ban(fromId, 'persistent ban', false); return }
      acLog(`✓ ${fromId.slice(0,6)} id:${(data.pubHash||'?').slice(0,6)}${p.verified?' v':''}`)
    }
  }
  onNetVote(data, fromId){
    if (this.isHost && fromId !== this.myPeerId){
      for (const peerId of this.peers){
        if (peerId !== fromId) this.sendTo('vote', data, peerId)
      }
    }
    if (data.kind === 'start') this.beginVote(data.target, fromId)
    else if (data.kind === 'cast') this.castVote(fromId, data.agree)
    else if (data.kind === 'blacklist'){
      this.hostBlacklist.add(data.id)
      this.updateStatus()
    }
  }
  onPeerLeft(id){
    delete this.inputs[id]
    delete this.worldPlayers[id]
    delete this.scores[id]
    delete this.peerNames[id]
    this.destroyView(id)
    this.ac.remove(id)
    this.votes.delete(id)
    if (this.voteTarget === id) this.endVote()
  }

  currentHostId(){ return this.isHost ? this.myPeerId : this.serverHostId }

  isInsideWall(x, y, r){
    for (const w of this.wallRects){
      if (x > w.x-r && x < w.x+w.w+r && y > w.y-r && y < w.y+w.h+r) return true
    }
    return false
  }

  spawnPickup(){
    const WEIGHTS = { hp:1.2, rapid:1, homing:1, ricochet:1, shield:1, sprayer:1.5 }
    const currentTypes = new Set(this.pickups.map(p => p.type))
    const candidates = Object.keys(WEIGHTS).filter(t => !currentTypes.has(t))
    if (candidates.length === 0) return

    let total = 0
    for (const t of candidates) total += WEIGHTS[t]
    let r = Math.random() * total
    let type = candidates[0]
    for (const t of candidates){
      r -= WEIGHTS[t]
      if (r <= 0){ type = t; break }
    }

    let x, y, tries = 0
    do {
      x = 100 + Math.random() * (CFG.W - 200)
      y = 100 + Math.random() * (CFG.H - 200)
      tries++
    } while (this.isInsideWall(x, y, 40) && tries < 40)
    if (tries >= 40) return

    const id = 'pk_' + (++this.pickupSeq)
    this.pickups.push({ id, type, x, y })
    const sp = this._spatial(x, y, 0.6)
    this.sfx.pickupSpawn(sp.pan, sp.vol)
  }

  applyPickup(id, type){
    const p = this.worldPlayers[id]
    if (!p) return
    if (!p.bonuses) this.resetBonuses(p)
    const now = performance.now()
    if (type === 'hp'){
      p.hp = Math.min(p.hp + CFG.BONUS_HP_AMOUNT, CFG.MAX_HP)
    } else if (type === 'rapid'){
      p.bonuses.rapidUntil = now + CFG.BONUS_DURATION
    } else if (type === 'homing'){
      p.bonuses.homingUntil = now + CFG.BONUS_DURATION
    } else if (type === 'ricochet'){
      p.bonuses.ricochetUntil = now + CFG.BONUS_DURATION
    } else if (type === 'shield'){
      p.bonuses.shieldHits = (p.bonuses.shieldHits || 0) + 1
    } else if (type === 'sprayer'){
      p.bonuses.sprayerUntil = now + CFG.BONUS_DURATION
    }
    if (id === this.myPeerId){
      this.sfx.pickup(type, 0, 1)
    } else {
      const sp = this._spatial(p.x, p.y, 0.9)
      this.sfx.pickup(type, sp.pan, sp.vol)
    }
  }

  resetBonuses(p){
    p.bonuses = { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, sprayerUntil:0 }
  }

  syncPickups(list){
    if (!list) return
    const seen = new Set()
    for (let i = 0; i < list.length; i++){
      const [id, type, x, y] = list[i]
      seen.add(id)
      if (!this.pickupSprites[id]){
        const emoji = { hp:'❤️', rapid:'⚡', homing:'🎯', ricochet:'🏓', shield:'🛡', sprayer:'💦' }[type] || '❓'
        const t = this.add.text(x, y, emoji, { fontSize: '32px', fontFamily: 'monospace' })
          .setOrigin(0.5).setDepth(6).setAlpha(0.9)
        t.setData('type', type)
        this.tweens.add({
          targets: t, scale: { from: 0.85, to: 1.15 },
          duration: 700, yoyo: true, repeat: -1,
        })
        this.pickupSprites[id] = t
      } else {
        this.pickupSprites[id].setPosition(x, y)
      }
    }
    for (const id in this.pickupSprites){
      if (!seen.has(id)){
        const sprite = this.pickupSprites[id]
        const type = sprite.getData('type') || 'hp'
        const dx = sprite.x - this.local.x
        const dy = sprite.y - this.local.y
        const dist = Math.hypot(dx, dy)
        if (dist < 200){
          const pan = clamp(dx / 500, -1, 1)
          const vol = clamp(1 - dist / 300, 0.4, 1)
          this.sfx.pickup(type, pan, vol)
        }
        sprite.destroy()
        delete this.pickupSprites[id]
      }
    }
  }

  addPlayerToWorld(id){
    if (!id || this.worldPlayers[id]) return
    const v = this.views[id]
    const idx = Object.keys(this.worldPlayers).length
    const spawn = SPAWNS[idx % SPAWNS.length]
    this.worldPlayers[id] = {
      x: (v && v.init && (v.tx||v.ty)) ? v.tx : spawn.x,
      y: (v && v.init && (v.tx||v.ty)) ? v.ty : spawn.y,
      vx:0, vy:0, aimX:1, aimY:0,
      hp: CFG.MAX_HP, dead:false, fireAt:0, respawnAt:0, score:0,
      bonuses: { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, sprayerUntil:0 },
      dashUntil: 0, dashDirX: 1, dashDirY: 0, lastDseq: 0,
      lastTseq: 0, lastThrow: 0,
    }
    if (!this.inputs[id]) this.inputs[id] = { m:[0,0], a:[1,0], f:0 }
  }

  becomeHost(){
    const myCurX = this.predicted.x, myCurY = this.predicted.y
    const meWasInit = Math.abs(myCurX) > 1 || Math.abs(myCurY) > 1
    this.worldPlayers = {}
    this.pickups = []
    this.lastPickupSpawn = 0
    const ids = [this.myPeerId, ...this.peers].filter(id => id && !this.ac.bans.has(id))
    for (const id of ids){
      const v = this.views[id]
      const spawn = SPAWNS[ids.indexOf(id) % SPAWNS.length]
      const use = v && v.init && (Math.abs(v.tx) > 1 || Math.abs(v.ty) > 1)
      this.worldPlayers[id] = {
        x: use ? v.tx : spawn.x, y: use ? v.ty : spawn.y,
        vx:0, vy:0, aimX:1, aimY:0,
        hp: v ? v.hp : CFG.MAX_HP, dead: v ? v.dead : false,
        fireAt:0, respawnAt:0, score:0,
        bonuses: { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, sprayerUntil:0 },
        dashUntil: 0, dashDirX: 1, dashDirY: 0, lastDseq: 0,
        lastTseq: 0, lastThrow: 0,
      }
      if (!this.inputs[id]) this.inputs[id] = { m:[0,0], a:[1,0], f:0 }
    }
    const me = this.worldPlayers[this.myPeerId]
    if (me){
      if (meWasInit){ me.x = myCurX; me.y = myCurY }
      else { const s = SPAWNS[0]; me.x = s.x; me.y = s.y }
      this.local.x = me.x; this.local.y = me.y
      this.predicted.x = me.x; this.predicted.y = me.y
      const v = this.views[this.myPeerId]
      if (v){ v.tx = me.x; v.ty = me.y; v.sprite.x = me.x; v.sprite.y = me.y; v.init = true }
    }
    for (const peerId of this.peers){
      this.sendBan({ full:true, bans:[...this.ac.bans], pbans:[...this.ac.persistentBans] }, peerId)
    }
    acLog(`👑 хост: ${this.myPeerId.slice(0,6)}`)
    this.updateStatus()
  }

  onVoteClick(){
    const hostId = this.currentHostId()
    if (!hostId || hostId === this.myPeerId){ acLog('✖ ты хост'); return }
    if (this.voteActive && this.voteTarget === hostId){
      const already = this.votes.has(this.myPeerId)
      this.castVote(this.myPeerId, !already)
      this.sendVote({ kind:'cast', agree: !already })
      return
    }
    this.beginVote(hostId, this.myPeerId)
    this.sendVote({ kind:'start', target: hostId })
  }
  beginVote(target, initiator){
    if (this.voteActive) return
    this.voteActive = true
    this.voteTarget = target
    this.voteDeadline = performance.now() + VOTE_DURATION_MS
    this.votes.clear()
    if (initiator) this.votes.set(initiator, target)
    this.updateVoteUI()
  }
  castVote(voter, agree){
    if (!this.voteActive) return
    if (agree) this.votes.set(voter, this.voteTarget)
    else this.votes.delete(voter)
    this.checkVoteResult()
    this.updateVoteUI()
  }
  checkVoteResult(){
    if (!this.voteActive) return
    const total = 1 + this.peers.size
    const yes = this.votes.size
    const failed = performance.now() > this.voteDeadline
    if (yes > total / 2){
      this.hostBlacklist.add(this.voteTarget)
      this.sendVote({ kind:'blacklist', id: this.voteTarget })
      this.endVote()
    } else if (failed) this.endVote()
  }
  endVote(){
    this.voteActive = false
    this.voteTarget = null
    this.votes.clear()
    this.voteBtn.classList.remove('armed')
    this.updateVoteUI()
  }
  updateVoteUI(){
    if (!this.voteInfo || !this.voteBtn) return
    if (!this.voteActive){ this.voteInfo.textContent = ''; this.voteBtn.classList.remove('armed'); return }
    const total = 1 + this.peers.size
    const yes = this.votes.size
    this.voteInfo.textContent = `VOTE ${yes}/${total}\nцель: ${(this.voteTarget||'').slice(0,6)}`
    this.voteBtn.classList.toggle('armed', this.votes.has(this.myPeerId))
  }

  updateStatus(){
    if (!this.statusEl) return
    const n = this.peers.size + (this.myPeerId ? 1 : 0)
    const role = this.isHost ? 'HOST' : (this.hasBecomeClient ? 'CLIENT' : 'WAIT')
    const hp = Math.max(0, Math.round(this.local.hp))
    const sc = this.local.score || 0
    const myName = this.peerNames[this.myPeerId] || this.myName || '?'
    let ping = 0
    for (const [, p] of this.ac.peers){
      const v = p.rtt || 0
      if (v > 0 && v < 5000 && v > ping) ping = v
    }
    ping = Math.round(ping)
    this.statusEl.textContent = `${role} · ${myName} · ${this.roomId} · игроков: ${n} · HP: ${hp} · очки: ${sc} · ping: ${ping}ms`
  }

  renderBonuses(){
    if (!this.bonusesEl) return
    const bn = this.localBonuses
    const now = performance.now()
    const parts = []
    if (bn[4] > now){
      parts.push(`💦 ${Math.ceil((bn[4]-now)/1000)}s`)
    } else {
      if (bn[0] > now) parts.push(`⚡ ${Math.ceil((bn[0]-now)/1000)}s`)
      if (bn[1] > now) parts.push(`🎯 ${Math.ceil((bn[1]-now)/1000)}s`)
      if (bn[2] > now) parts.push(`🏓 ${Math.ceil((bn[2]-now)/1000)}s`)
    }
    if (bn[3] > 0) parts.push(`🛡 ×${bn[3]}`)
    if (parts.length){
      this.bonusesEl.textContent = parts.join(' · ')
      this.bonusesEl.style.display = 'block'
    } else {
      this.bonusesEl.style.display = 'none'
    }
  }

  renderScores(){
    if (!this.scoresEl) return
    if (!this.scores || Object.keys(this.scores).length === 0){ this.scoresEl.textContent = ''; return }
    const rows = []
    for (const id in this.scores){
      if (id !== this.myPeerId && !this.peers.has(id)) continue
      const score = this.scores[id]
      const v = this.views[id]
      const isMe = id === this.myPeerId
      const dead = v ? v.dead : false
      rows.push({ id, score, isMe, dead })
    }
    rows.sort((a,b) => b.score - a.score)
    let html = '🏆 СЧЁТ\n'
    for (let i = 0; i < rows.length; i++){
      const r = rows[i]
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '  '
      const tag = r.isMe ? ' (я)' : ''
      const cls = r.isMe ? 'me' : (r.dead ? 'dead' : '')
      const name = this.peerNames[r.id] || r.id.slice(0, 6)
      html += `<span class="${cls}">${medal} ${name}${tag} · ${r.score}</span>\n`
    }
    this.scoresEl.innerHTML = html
  }

  applyState(data){
    if (!data || !data.p) return
    if (data.names){
      for (const id in data.names){
        const n = cleanName(data.names[id])
        if (n) this.peerNames[id] = n
      }
    }
    if (data.scores){
      this.scores = data.scores
      if (this.myPeerId && this.scores[this.myPeerId] !== undefined){
        this.local.score = this.scores[this.myPeerId]
      }
    }
    if (data.pickups) this.syncPickups(data.pickups)

    const now = performance.now()
    for (const id in data.p){
      if (id !== this.myPeerId && !this.peers.has(id)) continue
      const arr = data.p[id]
      const x = arr[0], y = arr[1], ax = arr[2], ay = arr[3], hp = arr[4], dead = arr[5]
      const bn = arr[6]
      if (id === this.myPeerId){
        this.local.hp = hp
        this.local.dead = !!dead
        if (bn && Array.isArray(bn) && bn.length >= 4){
          this.localBonuses = [
            bn[0] > 0 ? now + bn[0] : 0,
            bn[1] > 0 ? now + bn[1] : 0,
            bn[2] > 0 ? now + bn[2] : 0,
            bn[3] || 0,
            bn[4] > 0 ? now + bn[4] : 0,
          ]
        } else {
          this.localBonuses = [0, 0, 0, 0, 0]
        }
        const dx = x - this.predicted.x, dy = y - this.predicted.y
        if (Math.abs(dx) > 120 || Math.abs(dy) > 120){
          this.predicted.x = x; this.predicted.y = y
        } else {
          this.predicted.x += dx * 0.15
          this.predicted.y += dy * 0.15
        }
      } else {
        let v = this.views[id]
        if (!v){ v = this.createView(id); v.tx = x; v.ty = y; v.init = true; v.sprite.x = x; v.sprite.y = y }
        const wasDead = v.dead
        if (!v.buffer) v.buffer = []
        v.buffer.push({ x, y, ax, ay, hp, dead, bn, t: now })
        while (v.buffer.length > 15) v.buffer.shift()
        v.tx = x; v.ty = y
        v.hp = hp; v.dead = !!dead
        const sp = this._spatial(v.sprite.x, v.sprite.y)
        if (wasDead && !v.dead) this.sfx.respawn(sp.pan, sp.vol * 0.8)
        if (!wasDead && v.dead) this.sfx.death(sp.pan, sp.vol)
      }
    }
    for (const id in this.views){
      if (id === this.myPeerId) continue
      if (!(id in data.p) || !this.peers.has(id)){
        this.destroyView(id)
        delete this.scores[id]
        delete this.peerNames[id]
      }
    }
  }

  spawnGhostBullet(d){
    if (this.ghostBullets[d.id]) return
    let color = 0xffe066
    let size = CFG.BULLET_SIZE
    if (d.grenade){
      color = 0x88dd44
      size = CFG.GRENADE_R * 2.4
    } else if (d.sprayer){
      color = 0xffaa33
      size = CFG.BULLET_SIZE * 0.7
    } else if (d.homing && d.ricochet) color = 0xff22ff
    else if (d.homing) color = 0xff66ff
    else if (d.ricochet) color = 0x22ffff

    const s = this.add.image(d.x, d.y, 'bullet')
      .setDisplaySize(size, size)
      .setTint(color).setBlendMode(Phaser.BlendModes.ADD).setDepth(5)

    this.ghostBullets[d.id] = {
      sprite: s, vx: d.vx, vy: d.vy, born: this.time.now,
      bouncesLeft: d.ricochet || 0,
      homing: !!d.homing,
      sprayer: !!d.sprayer,
      grenade: !!d.grenade,
      explodeAt: d.grenade ? this.time.now + CFG.GRENADE_FUSE : 0,
    }
  }

  applyHit(d){
    if (d.bid && this.ghostBullets[d.bid]){
      this.ghostBullets[d.bid].sprite.destroy()
      delete this.ghostBullets[d.bid]
    }
    const isMe = d.target === this.myPeerId
    const byMe = d.by === this.myPeerId

    if (byMe && !isMe){
      this.sfx.hitPlayer(0, 1)
      if (d.dead) this.sfx.kill(0, 1)
    } else if (isMe){
      if (d.blocked) this.sfx.hitShield(0, 1)
      else {
        this.sfx.hitPlayer(0, 1)
        if (d.dead) this.sfx.death(0, 1)
      }
    } else {
      const v = this.views[d.target]
      if (v){
        const sp = this._spatial(v.sprite.x, v.sprite.y, 0.8)
        if (d.blocked) this.sfx.hitShield(sp.pan, sp.vol)
        else this.sfx.hitPlayer(sp.pan, sp.vol)
        if (d.dead) this.sfx.death(sp.pan, sp.vol)
      }
    }

    if (isMe){
      if (d.blocked){
        this.cameras.main.flash(90, 100, 200, 255)
        if (this.localBonuses[3] > 0) this.localBonuses[3]--
      } else {
        this.local.hp = d.hp
        this.local.dead = !!d.dead
        this.cameras.main.flash(90, 255, 30, 100)
        if (d.dead){
          this.localBonuses = [0, 0, 0, 0, 0]
          this.dash.cdUntil = 0
          this.dash.until = 0
        }
      }
    }
    const v = this.views[d.target]
    if (v){
      v.hp = d.hp
      if (d.dead) v.dead = true
      v.sprite.setTintFill(d.blocked ? 0x88ccff : 0xffffff)
      this.time.delayedCall(60, ()=>{
        if (v.sprite && v.sprite.active) v.sprite.setTint(colorFromId(d.target))
      })
    }
    if (byMe) this.cameras.main.shake(50, 0.002)

    if (d.dead && d.killed){
      const killerName = this.peerNames[d.by] || (d.by || '?').slice(0,6)
      const victimName = this.peerNames[d.target] || (d.target || '?').slice(0,6)
      const weapon = d.sprayer ? '💦' : '🔫'
      this.addKillFeed(killerName, victimName, byMe, weapon)
      if (byMe){
        this.flashVignette()
        this.cameras.main.shake(90, 0.004)
      }
    }
  }

  applyExplosion(data){
    const g = this.add.graphics().setDepth(15)
    g.fillStyle(0xffaa33, 0.65)
    g.fillCircle(data.x, data.y, data.r)
    g.lineStyle(4, 0xff4400, 1)
    g.strokeCircle(data.x, data.y, data.r)
    this.tweens.add({
      targets: g, alpha: 0, scale: 1.3, duration: 400,
      onComplete: () => g.destroy(),
    })
    const g2 = this.add.graphics().setDepth(16)
    g2.fillStyle(0xffffff, 0.9)
    g2.fillCircle(data.x, data.y, data.r * 0.4)
    this.tweens.add({
      targets: g2, alpha: 0, scale: 2, duration: 250,
      onComplete: () => g2.destroy(),
    })

    const sp = this._spatial(data.x, data.y, 1)
    this.sfx.explosion(sp.pan, sp.vol)

    const dx = this.local.x - data.x
    const dy = this.local.y - data.y
    const dist = Math.hypot(dx, dy)
    const shakeIntensity = Math.max(0, 1 - dist / 700) * 0.012
    if (shakeIntensity > 0.001){
      this.cameras.main.shake(220, shakeIntensity)
    }

    if (Array.isArray(data.hits)){
      for (const h of data.hits){
        if (h.tid === this.myPeerId){
          if (h.blocked){
            this.sfx.hitShield(0, 1)
            this.cameras.main.flash(120, 100, 200, 255)
            if (this.localBonuses[3] > 0) this.localBonuses[3]--
          } else {
            this.local.hp = h.hp
            this.local.dead = !!h.dead
            this.cameras.main.flash(150, 255, 30, 100)
            this.sfx.hitPlayer(0, 1)
            if (h.dead){
              this.sfx.death(0, 1)
              this.localBonuses = [0, 0, 0, 0, 0]
              this.dash.cdUntil = 0
              this.dash.until = 0
            }
          }
        }
        const v = this.views[h.tid]
        if (v){
          v.hp = h.hp
          if (h.dead) v.dead = true
        }
      }
      for (const h of data.hits){
        if (h.killed){
          const killerName = this.peerNames[data.owner] || (data.owner || '?').slice(0,6)
          const victimName = this.peerNames[h.tid] || (h.tid || '?').slice(0,6)
          const byMe = data.owner === this.myPeerId
          this.addKillFeed(killerName, victimName, byMe, '💣')
          if (byMe) this.flashVignette()
        }
      }
    }
  }

  createView(id){
    if (this.views[id]) return this.views[id]
    const sprite = this.add.image(0, 0, 'player')
      .setDisplaySize(CFG.PLAYER_W, CFG.PLAYER_H).setDepth(10).setTint(colorFromId(id))
    const bar = this.add.graphics().setDepth(11)
    const label = this.add.text(0, 0, this.peerNames[id] || id.slice(0, 6), {
      fontFamily: 'monospace', fontSize: '11px', color: '#e6edf3',
      stroke: '#000000', strokeThickness: 3,
    }).setOrigin(0.5, 1).setDepth(12)
    const shield = this.add.circle(0, 0, CFG.PLAYER_W * 0.6, 0x66ccff, 0.25)
      .setDepth(9).setVisible(false)
    this.views[id] = { sprite, bar, label, shield, hp:CFG.MAX_HP, dead:false,
                       tx:0, ty:0, ta:0, init:false, buffer:[] }
    return this.views[id]
  }
  destroyView(id){
    const v = this.views[id]; if (!v) return
    v.sprite.destroy()
    v.bar.destroy()
    if (v.label) v.label.destroy()
    if (v.shield) v.shield.destroy()
    delete this.views[id]
  }

  update(time, delta){
    const dt = Math.min(delta, 50) / 1000

    if (time - this.lastAcTick > 250){
      const dtAc = (time - this.lastAcTick) / 1000
      this.lastAcTick = time
      this.ac.tick(dtAc)
    }
    if (this.voteActive) this.checkVoteResult()

    if (!this.local.dead){
      const now = performance.now()
      let speed = CFG.SPEED
      let mx = this.moveVec.x, my = this.moveVec.y
      if (now < this.dash.until){
        mx = this.dash.dirX; my = this.dash.dirY
        speed = CFG.DASH_SPEED
      }
      const nx = this.predicted.x + mx * speed * dt
      const ny = this.predicted.y + my * speed * dt
      const p = this.resolveWorld(nx, ny)
      this.predicted.x = p.x; this.predicted.y = p.y
    }
    this.local.x = this.predicted.x
    this.local.y = this.predicted.y
    this.local.aimX = this.aimVec.x
    this.local.aimY = this.aimVec.y

    if (time - this._lastPing > 2000){
      this._lastPing = time
      for (const peerId of this.peers){
        this.sendPing({ t: performance.now(), pong: 0 }, peerId)
      }
    }

    if (!this.isHost && time - this._lastNameSent > 5000){
      this._lastNameSent = time
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId){
        this.sendId({ name: this.myName }, hostId)
      }
    }

    /* 🆕 f=1 только для ружья (гранаты — через tseq) */
    const firingFlag = (this.weapon === 'rifle' && this.firing) ? 1 : 0

    if (!this.isHost && time - this.lastInputSent > CFG.INPUT_MS){
      this.lastInputSent = time
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId){
        this.ac.seq++
        const payload = {
          seq: this.ac.seq,
          m: [this.moveVec.x, this.moveVec.y],
          a: [this.aimVec.x, this.aimVec.y],
          f: firingFlag,
          d: this.local.dead ? 1 : 0,
          dseq: this.dashSeq,
          w: this.weapon === 'grenade' ? 1 : 0,
          af: this.aimForce,
          tseq: this.throwSeq,       /* 🆕 */
        }
        payload.sig = this.ac.sign(payload)
        this.sendInput(payload, hostId)
      }
    }

    if (this.isHost){
      this.inputs[this.myPeerId] = {
        m: [this.moveVec.x, this.moveVec.y],
        a: [this.aimVec.x, this.aimVec.y],
        f: firingFlag,
        d: this.local.dead ? 1 : 0,
        dseq: this.dashSeq,
        w: this.weapon === 'grenade' ? 1 : 0,
        af: this.aimForce,
        tseq: this.throwSeq,       /* 🆕 */
        _t: time,
      }
      this.simulateHost(time, dt)
    }

    /* 🆕 клиент стреляет из ружья (гранаты — только по отпусканию) */
    if (!this.isHost && !this.local.dead && this.weapon === 'rifle'){
      const now = performance.now()
      const behavior = this._computeFireBehavior(this.localBonuses, now)
      if (this.firing && time - this._lastLocalShot > behavior.fireCd){
        this._lastLocalShot = time
        const len = Math.hypot(this.aimVec.x, this.aimVec.y) || 1
        const ax = this.aimVec.x / len
        const ay = this.aimVec.y / len
        this.sfx.shoot(behavior.kind, 0, 1)

        if (behavior.opts.sprayer){
          this.spawnLocalSprayer(ax, ay)
        } else {
          const id = 'local_' + this.myPeerId + '_' + (++this.bulletSeq)
          this.spawnGhostBullet({
            id,
            x: this.local.x + ax * (CFG.PLAYER_R + 6),
            y: this.local.y + ay * (CFG.PLAYER_R + 6),
            vx: ax * CFG.BULLET_SPEED,
            vy: ay * CFG.BULLET_SPEED,
            owner: this.myPeerId,
            homing: behavior.opts.homing,
            ricochet: behavior.opts.ricochet,
            sprayer: false,
          })
        }
      }
    }

    this.updateGhostBullets(time, dt)
    this.renderPlayers(time, dt)
    if (time % 200 < 20){
      this.updateStatus()
      this.updateVoteUI()
      this.renderScores()
      this.renderBonuses()
      this.updateDashButton()
      this.updateWeaponButton()
    }
  }

  spawnLocalGrenade(ax, ay, force){
    const id = 'local_' + this.myPeerId + '_g' + (++this.bulletSeq)
    const speed = CFG.GRENADE_SPEED * (force || 1)
    this.spawnGhostBullet({
      id,
      x: this.local.x + ax * (CFG.PLAYER_R + 6),
      y: this.local.y + ay * (CFG.PLAYER_R + 6),
      vx: ax * speed,
      vy: ay * speed,
      owner: this.myPeerId,
      grenade: true,
    })
  }

  spawnLocalSprayer(ax, ay){
    const baseAngle = Math.atan2(ay, ax)
    const spread = CFG.BONUS_SPRAYER_SPREAD_DEG * Math.PI / 180
    const n = CFG.BONUS_SPRAYER_PELLETS
    for (let i = 0; i < n; i++){
      const t = n === 1 ? 0.5 : i / (n - 1)
      const jitter = (Math.random() - 0.5) * 0.04
      const ang = baseAngle - spread/2 + spread * t + jitter
      const pa = Math.cos(ang), pb = Math.sin(ang)
      const id = 'local_' + this.myPeerId + '_' + (++this.bulletSeq)
      this.spawnGhostBullet({
        id,
        x: this.local.x + pa * (CFG.PLAYER_R + 6),
        y: this.local.y + pb * (CFG.PLAYER_R + 6),
        vx: pa * CFG.BULLET_SPEED,
        vy: pb * CFG.BULLET_SPEED,
        owner: this.myPeerId,
        homing: false,
        ricochet: 0,
        sprayer: true,
      })
    }
  }

  resolveWorld(x, y){
    x = clamp(x, CFG.PLAYER_R, CFG.W - CFG.PLAYER_R)
    y = clamp(y, CFG.PLAYER_R, CFG.H - CFG.PLAYER_R)
    for (const r of this.wallRects){
      const res = resolveCircleRect(x, y, CFG.PLAYER_R, r)
      if (res){ x = res.x; y = res.y }
    }
    return { x, y }
  }

  simulateHost(time, dt){
    const now = performance.now()

    for (const id in this.worldPlayers){
      const p = this.worldPlayers[id]
      let inp = this.inputs[id] || { m:[0,0], a:[1,0], f:0 }
      const lastInputAge = time - (inp._t || 0)
      if (lastInputAge > 500 && id !== this.myPeerId){
        inp = { m:[0,0], a: inp.a || [1,0], f: 0, w: inp.w || 0, af: inp.af, tseq: inp.tseq }
      }
      if (!p.bonuses) this.resetBonuses(p)
      if (typeof p.dashUntil !== 'number') p.dashUntil = 0
      if (typeof p.lastDseq !== 'number') p.lastDseq = 0
      if (typeof p.lastTseq !== 'number') p.lastTseq = 0
      if (typeof p.lastThrow !== 'number') p.lastThrow = 0

      /* DASH */
      if (inp.dseq && inp.dseq > p.lastDseq){
        p.lastDseq = inp.dseq
        if (!p.dead){
          let dx = inp.m[0] || 0, dy = inp.m[1] || 0
          if (Math.hypot(dx, dy) < 0.2){
            dx = inp.a[0] || 1; dy = inp.a[1] || 0
          }
          const len = Math.hypot(dx, dy) || 1
          p.dashDirX = dx/len
          p.dashDirY = dy/len
          p.dashUntil = time + CFG.DASH_DURATION
          if (id !== this.myPeerId){
            const sp = this._spatial(p.x, p.y, 0.9)
            this.sfx.dash(sp.pan, sp.vol)
          }
        }
      }

      /* 🆕 БРОСОК ГРАНАТЫ через tseq */
      if (inp.tseq && inp.tseq > p.lastTseq){
        p.lastTseq = inp.tseq
        if (!p.dead && (time - p.lastThrow) > CFG.GRENADE_CD * AC_CFG.FIRE_TOLERANCE){
          p.lastThrow = time
          const len = Math.hypot(p.aimX, p.aimY) || 1
          const ax = p.aimX / len
          const ay = p.aimY / len
          const force = clamp(typeof inp.af === 'number' ? inp.af : 1, CFG.GRENADE_MIN_FORCE, 1)
          if (id === this.myPeerId) this.sfx.grenadeThrow(0, 1)
          else {
            const sp = this._spatial(p.x, p.y)
            this.sfx.grenadeThrow(sp.pan, sp.vol)
          }
          this.hostSpawnGrenade(id, p.x, p.y, ax, ay, force)
        }
      }

      if (p.dead){
        if (time > p.respawnAt){
          const sp = SPAWNS[Math.floor(Math.random()*SPAWNS.length)]
          p.x = sp.x; p.y = sp.y; p.hp = CFG.MAX_HP; p.dead = false; p.vx = 0; p.vy = 0
          p.dashUntil = 0
          this.resetBonuses(p)
          if (id === this.myPeerId) this.sfx.respawn(0, 1)
        } else continue
      }

      const prev = { x:p.x, y:p.y }
      let speed = CFG.SPEED
      let mvx = inp.m[0] || 0
      let mvy = inp.m[1] || 0
      const dashing = time < p.dashUntil
      if (dashing){
        mvx = p.dashDirX
        mvy = p.dashDirY
        speed = CFG.DASH_SPEED
      }

      p.vx = mvx * speed
      p.vy = mvy * speed
      const nx = p.x + p.vx*dt, ny = p.y + p.vy*dt
      const res = this.resolveWorld(nx, ny)
      const fixed = this.ac.validateMovement(id, prev, res, dt, speed)
      p.x = fixed.x; p.y = fixed.y
      this.ac.recordPosition(id, p.x, p.y)
      p.aimX = inp.a[0] || 1
      p.aimY = inp.a[1] || 0

      const bnArr = [
        p.bonuses.rapidUntil || 0,
        p.bonuses.homingUntil || 0,
        p.bonuses.ricochetUntil || 0,
        p.bonuses.shieldHits || 0,
        p.bonuses.sprayerUntil || 0,
      ]
      const behavior = this._computeFireBehavior(bnArr, now)

      /* 🆕 стрельба только для ружья (гранаты — через tseq выше) */
      if (inp.w !== 1 && inp.f && time - p.fireAt > behavior.fireCd){
        if (!this.ac.validateFire(id, time, behavior.fireCd)) continue
        const len = Math.hypot(p.aimX, p.aimY) || 1
        const ax = p.aimX/len, ay = p.aimY/len
        p.fireAt = time

        if (id === this.myPeerId) this.sfx.shoot(behavior.kind, 0, 1)
        else {
          const sp = this._spatial(p.x, p.y)
          this.sfx.shoot(behavior.kind, sp.pan, sp.vol)
        }
        if (behavior.opts.sprayer){
          this.hostSpawnSprayer(id, p.x, p.y, ax, ay)
        } else {
          this.hostSpawnBullet(id, p.x, p.y, ax, ay, behavior.opts)
        }
      }

      for (let i = this.pickups.length - 1; i >= 0; i--){
        const pk = this.pickups[i]
        const dx = p.x - pk.x, dy = p.y - pk.y
        const rr = CFG.PLAYER_R + CFG.PICKUP_RADIUS
        if (dx*dx + dy*dy < rr*rr){
          this.applyPickup(id, pk.type)
          this.pickups.splice(i, 1)
        }
      }
    }

    if (time - this.lastPickupSpawn > CFG.PICKUP_INTERVAL && this.pickups.length < CFG.PICKUP_MAX){
      this.lastPickupSpawn = time
      this.spawnPickup()
    }

    for (let i = this.bullets.length - 1; i >= 0; i--){
      const b = this.bullets[i]

      if (b.isGrenade){
        const drag = Math.exp(-CFG.GRENADE_DRAG_K * dt)
        b.vx *= drag
        b.vy *= drag

        let nx = b.x + b.vx * dt
        let ny = b.y + b.vy * dt

        let hitWall = false
        for (const r of this.wallRects){
          if (nx > r.x-CFG.GRENADE_R && nx < r.x+r.w+CFG.GRENADE_R &&
              ny > r.y-CFG.GRENADE_R && ny < r.y+r.h+CFG.GRENADE_R){
            hitWall = true
            const rres = resolveCircleRect(nx, ny, CFG.GRENADE_R, r)
            if (rres){ nx = rres.x; ny = rres.y }
            break
          }
        }
        if (hitWall){ b.vx = 0; b.vy = 0 }

        b.x = nx
        b.y = ny

        if (time > b.explodeAt){
          this.hostExplodeGrenade(b, time)
          this.bullets.splice(i, 1)
          continue
        }
        continue
      }

      if (b.homing){
        let nearest = null, nd = Infinity
        for (const tid in this.worldPlayers){
          if (tid === b.owner) continue
          const t = this.worldPlayers[tid]
          if (t.dead) continue
          const dx = t.x - b.x, dy = t.y - b.y
          const d2 = dx*dx + dy*dy
          if (d2 < nd){ nd = d2; nearest = t }
        }
        if (nearest){
          const dx = nearest.x - b.x, dy = nearest.y - b.y
          const targetAngle = Math.atan2(dy, dx)
          const curAngle = Math.atan2(b.vy, b.vx)
          const noise = (Math.random() - 0.5) * CFG.BONUS_HOMING_NOISE
          const wantAngle = targetAngle + noise
          let diff = wantAngle - curAngle
          while (diff > Math.PI) diff -= 2*Math.PI
          while (diff < -Math.PI) diff += 2*Math.PI
          const turn = Math.max(-CFG.BONUS_HOMING_TURN, Math.min(CFG.BONUS_HOMING_TURN, diff))
          const speed = Math.hypot(b.vx, b.vy)
          const newAngle = curAngle + turn
          b.vx = Math.cos(newAngle) * speed
          b.vy = Math.sin(newAngle) * speed
        }
      }

      let nx = b.x + b.vx*dt
      let ny = b.y + b.vy*dt

      let hitWall = null
      for (const r of this.wallRects){
        if (nx > r.x-CFG.BULLET_R && nx < r.x+r.w+CFG.BULLET_R &&
            ny > r.y-CFG.BULLET_R && ny < r.y+r.h+CFG.BULLET_R){ hitWall = r; break }
      }

      if (hitWall){
        if (b.bouncesLeft > 0){
          b.bouncesLeft--
          const sp = this._spatial(b.x, b.y, 0.7)
          this.sfx.ricochetTick(sp.pan, sp.vol)
          const cx = hitWall.x + hitWall.w/2
          const cy = hitWall.y + hitWall.h/2
          const dx = nx - cx, dy = ny - cy
          const halfW = hitWall.w/2 + CFG.BULLET_R
          const halfH = hitWall.h/2 + CFG.BULLET_R
          const overlapX = halfW - Math.abs(dx)
          const overlapY = halfH - Math.abs(dy)
          if (overlapX < overlapY){
            b.vx = -b.vx
            nx = b.x + Math.sign(dx || 1) * overlapX
          } else {
            b.vy = -b.vy
            ny = b.y + Math.sign(dy || 1) * overlapY
          }
        } else {
          this.bullets.splice(i, 1)
          continue
        }
      }

      b.x = nx
      b.y = ny

      if (time - b.born > CFG.BULLET_LIFE*1000){
        this.bullets.splice(i, 1)
        continue
      }

      let hitSomeone = false
      for (const tid in this.worldPlayers){
        if (tid === b.owner) continue
        const t = this.worldPlayers[tid]
        if (t.dead) continue
        const dx = t.x - b.x, dy = t.y - b.y
        const rr = CFG.PLAYER_R + CFG.BULLET_R
        if (dx*dx + dy*dy < rr*rr){
          let blocked = false
          if (t.bonuses && t.bonuses.shieldHits > 0){
            t.bonuses.shieldHits--
            blocked = true
          } else {
            const dmg = (typeof b.damage === 'number') ? b.damage : CFG.DAMAGE
            t.hp -= dmg
          }
          let killed = false
          if (!blocked && t.hp <= 0){
            t.hp = 0; t.dead = true; t.respawnAt = time + CFG.RESPAWN
            t.dashUntil = 0
            killed = true
            this.resetBonuses(t)
            const shooter = this.worldPlayers[b.owner]
            if (shooter) shooter.score = (shooter.score || 0) + 1
          }
          const hd = {
            bid: b.id, target: tid, by: b.owner, hp: t.hp,
            dead: t.dead, killed, blocked, sprayer: !!b.sprayer,
          }
          this.sendHit(hd)
          this.applyHit(hd)
          this.bullets.splice(i, 1)
          hitSomeone = true
          break
        }
      }
      if (hitSomeone) continue
    }

    if (time - this.lastStateSent > CFG.STATE_MS){
      this.lastStateSent = time

      if (time - this._lastVisibleCalc > 150){
        this._lastVisibleCalc = time
        this._visibleCache = {}
        for (const pid of [this.myPeerId, ...this.peers]){
          const viewer = this.worldPlayers[pid]
          if (viewer){
            this._visibleCache[pid] = this.ac.computeVisible(
              pid, this.worldPlayers, this.wallRects, viewer
            )
          }
        }
      }

      const scores = {}
      for (const id in this.worldPlayers){
        scores[id] = Math.round(this.worldPlayers[id].score || 0)
      }

      const names = {}
      for (const id in this.peerNames) names[id] = this.peerNames[id]
      names[this.myPeerId] = this.myName

      const pickups = this.pickups.map(pk => [
        pk.id, pk.type, Math.round(pk.x), Math.round(pk.y)
      ])

      for (const peerId of [this.myPeerId, ...this.peers]){
        if (this.ac.bans.has(peerId)) continue
        const visible = this._visibleCache[peerId]
        if (!visible) continue
        const pack = {}
        for (const id of visible){
          const w = this.worldPlayers[id]
          if (!w) continue
          const bn = w.bonuses || { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, sprayerUntil:0 }
          pack[id] = [
            Math.round(w.x), Math.round(w.y),
            Math.round(w.aimX*100)/100, Math.round(w.aimY*100)/100,
            Math.round(w.hp), w.dead ? 1 : 0,
            [
              Math.max(0, Math.round((bn.rapidUntil||0) - now)),
              Math.max(0, Math.round((bn.homingUntil||0) - now)),
              Math.max(0, Math.round((bn.ricochetUntil||0) - now)),
              bn.shieldHits || 0,
              Math.max(0, Math.round((bn.sprayerUntil||0) - now)),
            ],
          ]
        }
        const payload = { p: pack, scores, names, pickups }
        if (peerId === this.myPeerId) this.applyState(payload)
        else this.sendState(payload, peerId)
      }
    }
  }

  hostSpawnBullet(ownerId, x, y, ax, ay, opts){
    opts = opts || {}
    const len = Math.hypot(ax, ay) || 1
    const id = this.myPeerId + '-' + (++this.bulletSeq)
    const b = {
      id,
      x: x + (ax/len)*(CFG.PLAYER_R+6),
      y: y + (ay/len)*(CFG.PLAYER_R+6),
      vx: (ax/len)*CFG.BULLET_SPEED,
      vy: (ay/len)*CFG.BULLET_SPEED,
      owner: ownerId, born: this.time.now,
      homing: !!opts.homing,
      bouncesLeft: opts.ricochet || 0,
      damage: CFG.DAMAGE,
      sprayer: false,
    }
    this.bullets.push(b)
    const payload = {
      id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, owner: ownerId,
      homing: b.homing, ricochet: b.bouncesLeft, sprayer: false,
    }
    this.sendBullet(payload)
    this.spawnGhostBullet(payload)
  }

  hostSpawnSprayer(ownerId, x, y, ax, ay){
    const baseAngle = Math.atan2(ay, ax)
    const spread = CFG.BONUS_SPRAYER_SPREAD_DEG * Math.PI / 180
    const n = CFG.BONUS_SPRAYER_PELLETS
    const dmg = CFG.DAMAGE * CFG.BONUS_SPRAYER_DAMAGE_MUL

    for (let i = 0; i < n; i++){
      const t = n === 1 ? 0.5 : i / (n - 1)
      const jitter = (Math.random() - 0.5) * 0.04
      const ang = baseAngle - spread/2 + spread * t + jitter
      const pa = Math.cos(ang), pb = Math.sin(ang)

      const id = this.myPeerId + '-' + (++this.bulletSeq)
      const b = {
        id,
        x: x + pa * (CFG.PLAYER_R + 6),
        y: y + pb * (CFG.PLAYER_R + 6),
        vx: pa * CFG.BULLET_SPEED,
        vy: pb * CFG.BULLET_SPEED,
        owner: ownerId, born: this.time.now,
        homing: false,
        bouncesLeft: 0,
        damage: dmg,
        sprayer: true,
      }
      this.bullets.push(b)
      const payload = {
        id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, owner: ownerId,
        homing: false, ricochet: 0, sprayer: true,
      }
      this.sendBullet(payload)
      this.spawnGhostBullet(payload)
    }
  }

  hostSpawnGrenade(ownerId, x, y, ax, ay, force){
    const len = Math.hypot(ax, ay) || 1
    const id = this.myPeerId + '-g-' + (++this.bulletSeq)
    const speed = CFG.GRENADE_SPEED * (force || 1)
    const b = {
      id,
      x: x + (ax/len)*(CFG.PLAYER_R+6),
      y: y + (ay/len)*(CFG.PLAYER_R+6),
      vx: (ax/len)*speed,
      vy: (ay/len)*speed,
      owner: ownerId,
      born: this.time.now,
      explodeAt: this.time.now + CFG.GRENADE_FUSE,
      isGrenade: true,
    }
    this.bullets.push(b)
    const payload = {
      id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, owner: ownerId,
      grenade: true,
    }
    this.sendBullet(payload)
    this.spawnGhostBullet(payload)
  }

  hostExplodeGrenade(b, time){
    const R = CFG.GRENADE_RADIUS
    const R2 = R * R
    const hits = []

    for (const tid in this.worldPlayers){
      const t = this.worldPlayers[tid]
      if (t.dead) continue
      const dx = t.x - b.x
      const dy = t.y - b.y
      const d2 = dx*dx + dy*dy
      if (d2 > R2) continue

      const dist = Math.sqrt(d2)
      const falloff = 1 - dist / R
      let dmg = CFG.GRENADE_DAMAGE * falloff
      if (tid === b.owner) dmg *= CFG.GRENADE_SELF_DAMAGE_MUL
      dmg = Math.round(dmg)
      if (dmg < 1) continue

      let blocked = false
      if (t.bonuses && t.bonuses.shieldHits > 0){
        t.bonuses.shieldHits--
        blocked = true
      } else {
        t.hp -= dmg
      }
      let killed = false
      if (!blocked && t.hp <= 0){
        t.hp = 0
        t.dead = true
        t.respawnAt = time + CFG.RESPAWN
        t.dashUntil = 0
        killed = true
        this.resetBonuses(t)
        const shooter = this.worldPlayers[b.owner]
        if (shooter) shooter.score = (shooter.score || 0) + 1
      }
      hits.push({ tid, hp: t.hp, dead: t.dead ? 1 : 0, blocked, killed, dmg })
    }

    const payload = {
      id: b.id, owner: b.owner,
      x: Math.round(b.x), y: Math.round(b.y),
      r: R, hits,
    }
    this.sendExplosion(payload)
    this.applyExplosion(payload)
  }

  updateGhostBullets(time, dt){
    for (const id in this.ghostBullets){
      const g = this.ghostBullets[id]

      if (g.grenade){
        const drag = Math.exp(-CFG.GRENADE_DRAG_K * dt)
        g.vx *= drag
        g.vy *= drag

        let nx = g.sprite.x + g.vx * dt
        let ny = g.sprite.y + g.vy * dt

        let hitWall = false
        for (const r of this.wallRects){
          if (nx > r.x-CFG.GRENADE_R && nx < r.x+r.w+CFG.GRENADE_R &&
              ny > r.y-CFG.GRENADE_R && ny < r.y+r.h+CFG.GRENADE_R){
            hitWall = true
            const rres = resolveCircleRect(nx, ny, CFG.GRENADE_R, r)
            if (rres){ nx = rres.x; ny = rres.y }
            break
          }
        }
        if (hitWall){ g.vx = 0; g.vy = 0 }

        g.sprite.x = nx
        g.sprite.y = ny

        if (time > g.explodeAt){
          g.sprite.destroy()
          delete this.ghostBullets[id]
        }
        continue
      }

      if (g.homing){
        let nearest = null, nd = Infinity
        for (const vid in this.views){
          if (vid === this.myPeerId) continue
          const v = this.views[vid]
          if (!v || v.dead) continue
          const dx = v.sprite.x - g.sprite.x
          const dy = v.sprite.y - g.sprite.y
          const d2 = dx*dx + dy*dy
          if (d2 < nd){ nd = d2; nearest = v }
        }
        if (nearest){
          const dx = nearest.sprite.x - g.sprite.x
          const dy = nearest.sprite.y - g.sprite.y
          const targetAngle = Math.atan2(dy, dx)
          const curAngle = Math.atan2(g.vy, g.vx)
          const noise = (Math.random() - 0.5) * CFG.BONUS_HOMING_NOISE
          const wantAngle = targetAngle + noise
          let diff = wantAngle - curAngle
          while (diff > Math.PI) diff -= 2*Math.PI
          while (diff < -Math.PI) diff += 2*Math.PI
          const turn = Math.max(-CFG.BONUS_HOMING_TURN, Math.min(CFG.BONUS_HOMING_TURN, diff))
          const speed = Math.hypot(g.vx, g.vy)
          const newAngle = curAngle + turn
          g.vx = Math.cos(newAngle) * speed
          g.vy = Math.sin(newAngle) * speed
        }
      }

      let nx = g.sprite.x + g.vx*dt
      let ny = g.sprite.y + g.vy*dt

      let hitWall = null
      for (const r of this.wallRects){
        if (nx > r.x-CFG.BULLET_R && nx < r.x+r.w+CFG.BULLET_R &&
            ny > r.y-CFG.BULLET_R && ny < r.y+r.h+CFG.BULLET_R){ hitWall = r; break }
      }

      if (hitWall){
        if (g.bouncesLeft > 0){
          g.bouncesLeft--
          const sp = this._spatial(g.sprite.x, g.sprite.y, 0.6)
          this.sfx.ricochetTick(sp.pan, sp.vol)
          const cx = hitWall.x + hitWall.w/2
          const cy = hitWall.y + hitWall.h/2
          const dx = nx - cx, dy = ny - cy
          const halfW = hitWall.w/2 + CFG.BULLET_R
          const halfH = hitWall.h/2 + CFG.BULLET_R
          const overlapX = halfW - Math.abs(dx)
          const overlapY = halfH - Math.abs(dy)
          if (overlapX < overlapY){
            g.vx = -g.vx
            nx = g.sprite.x + Math.sign(dx || 1) * overlapX
          } else {
            g.vy = -g.vy
            ny = g.sprite.y + Math.sign(dy || 1) * overlapY
          }
        } else {
          g.sprite.destroy()
          delete this.ghostBullets[id]
          continue
        }
      }

      g.sprite.x = nx
      g.sprite.y = ny

      if (time - g.born > CFG.BULLET_LIFE*1000){
        g.sprite.destroy()
        delete this.ghostBullets[id]
      }
    }
  }

  renderPlayers(time, dt){
    const k = Math.min(1, dt*14)
    for (const id in this.views){
      if (id !== this.myPeerId && !this.peers.has(id)){
        this.destroyView(id)
        continue
      }
      const v = this.views[id]

      if (id === this.myPeerId){
        v.tx = this.local.x; v.ty = this.local.y
        v.ta = Math.atan2(this.local.aimY, this.local.aimX)
        v.hp = this.local.hp
        v.dead = this.local.dead
        if (!v.init){ v.init = true; v.sprite.x = v.tx; v.sprite.y = v.ty }
        else { v.sprite.x = v.tx; v.sprite.y = v.ty }
      } else if (v.buffer && v.buffer.length >= 2){
        const renderTime = performance.now() - 100
        let a = v.buffer[0], b = v.buffer[v.buffer.length-1]
        for (let i = 0; i < v.buffer.length - 1; i++){
          if (v.buffer[i].t <= renderTime && v.buffer[i+1].t > renderTime){
            a = v.buffer[i]; b = v.buffer[i+1]; break
          }
        }
        const span = Math.max(1, b.t - a.t)
        const alpha = Math.min(1, Math.max(0, (renderTime - a.t) / span))
        v.sprite.x = a.x + (b.x - a.x) * alpha
        v.sprite.y = a.y + (b.y - a.y) * alpha
        v.ta = Math.atan2(b.ay, b.ax)
        v.hp = b.hp
        v.dead = b.dead
        v.init = true
      } else {
        if (!v.init){ v.init = true; v.sprite.x = v.tx; v.sprite.y = v.ty }
        else {
          v.sprite.x += (v.tx - v.sprite.x) * k
          v.sprite.y += (v.ty - v.sprite.y) * k
        }
      }

      v.sprite.rotation = v.ta
      const vis = !v.dead
      v.sprite.setVisible(vis); v.bar.setVisible(vis)

      if (v.shield){
        let shields = 0
        if (id === this.myPeerId){
          shields = this.localBonuses[3] || 0
        } else if (v.buffer && v.buffer.length){
          const last = v.buffer[v.buffer.length - 1]
          shields = (last.bn && last.bn[3]) || 0
        }
        v.shield.setPosition(v.sprite.x, v.sprite.y)
        v.shield.setVisible(vis && shields > 0)
      }

      if (vis){
        const bx = v.sprite.x - 20, by = v.sprite.y - 34
        const w = 40 * (v.hp / CFG.MAX_HP)
        v.bar.clear()
        v.bar.fillStyle(0x000000, 0.6); v.bar.fillRect(bx-1, by-1, 42, 7)
        v.bar.fillStyle(v.hp>50?0x3fb950:v.hp>25?0xd29922:0xf85149, 1)
        v.bar.fillRect(bx, by, w, 5)
        if (v.label){
          const currentName = this.peerNames[id] || id.slice(0, 6)
          if (v.label.text !== currentName) v.label.setText(currentName)
          v.label.setPosition(v.sprite.x, v.sprite.y - 40)
          v.label.setVisible(true)
        }
      } else {
        if (v.label) v.label.setVisible(false)
      }
    }
    const me = this.views[this.myPeerId]
    if (me) this.cameras.main.centerOn(me.sprite.x, me.sprite.y)
  }

  onAntiCheatBan(id, reason, persistent){
    if (reason === 'timeout' || reason === 'idle') return
    if (this.ac.bans.has(id) && !persistent) return
    this.ac.bans.add(id)
    this.destroyView(id)
    delete this.inputs[id]
    delete this.worldPlayers[id]
    delete this.scores[id]
    delete this.peerNames[id]
    this.peers.delete(id)
    if (this.isHost){
      const p = this.ac.peers.get(id)
      for (const peerId of this.peers){
        this.sendBan({ id, reason, pubHash: persistent ? (p?.pubHash || null) : null }, peerId)
      }
    }
    this.updateStatus()
  }
}

;(async ()=>{
  const identity = new Identity()

  try {
    await Promise.race([
      identity.init(),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error('identity outer timeout')), 4000)
      )
    ])
  } catch(e){
    DBG.warn('BOOT', 'identity init outer timeout/fail:', e.message)
    if (!identity.ready){
      let stored = localStorage.getItem('p2p_fallback_id')
      if (!stored){
        stored = randomToken(12)
        localStorage.setItem('p2p_fallback_id', stored)
      }
      identity.pubHash = 'fb_' + stored
      identity.mode = 'fallback'
      identity.ready = true
    }
  }

  try {
    document.getElementById('pid').textContent =
      `identity: ${identity.mode} · id: ${identity.pubHash}`
  } catch(e){}

  DBG.log('BOOT', 'identity ready:', identity.mode)

  const sfx = new SoundEngine()

  /* ============================================================
     ЛОББИ: список открытых/закрытых комнат и создание комнат.
     Список живёт на relay-сервере и показывает только активные комнаты.
     ============================================================ */
  let selectedPrivateLobby = null
  let lobbySocket = null

  function lobbyStatus(msg, error=false){
    const el = document.getElementById('lobbyStatus')
    if (el){ el.textContent = msg || ''; el.style.color = error ? '#f85149' : '#8b949e' }
  }

  function closeLobbySocket(){
    try { if (lobbySocket) lobbySocket.close() } catch {}
    lobbySocket = null
  }

  function lobbyRequest(payload, timeout=5000){
    return new Promise((resolve,reject)=>{
      let done = false
      let ws
      const finish = (err, value)=>{
        if (done) return
        done = true
        try { ws?.close() } catch {}
        err ? reject(err) : resolve(value)
      }
      try { ws = new WebSocket(RELAY_URL) }
      catch(e){ reject(e); return }
      const timer = setTimeout(()=>finish(new Error('timeout')), timeout)
      ws.onopen = ()=>{
        try { ws.send(JSON.stringify(payload)) }
        catch(e){ clearTimeout(timer); finish(e) }
      }
      ws.onmessage = ev=>{
        let msg
        try { msg = JSON.parse(ev.data) } catch { return }
        if (msg.type === 'lobbies' || msg.type === 'created' || msg.type === 'joined'){
          clearTimeout(timer); finish(null, msg)
        } else if (msg.type === 'error'){
          clearTimeout(timer); finish(new Error(msg.msg || 'server error'))
        }
      }
      ws.onerror = ()=>{ clearTimeout(timer); finish(new Error('connection error')) }
      ws.onclose = ()=>{ if (!done){ clearTimeout(timer); finish(new Error('connection closed')) } }
    })
  }

  async function refreshLobbies(){
    lobbyStatus('Обновление списка…')
    try {
      const msg = await lobbyRequest({type:'list'})
      const list = Array.isArray(msg.lobbies) ? msg.lobbies : []
      const box = document.getElementById('lobbyList')
      box.innerHTML = ''
      if (!list.length){
        box.innerHTML = '<div id="lobbyEmpty">Нет активных лобби. Создай первое!</div>'
        lobbyStatus('Активных лобби: 0')
        return
      }
      for (const r of list){
        const row = document.createElement('div')
        row.className = 'lobbyRow'
        const locked = !!r.private
        const full = Number(r.players) >= Number(r.maxPlayers || 12)
        row.innerHTML = `
          <div class="lobbyMain">
            <div class="lobbyName">${escapeHtml(r.name || r.id)}</div>
            <div class="lobbyMeta">#${escapeHtml(r.id)} · ${r.players}/${r.maxPlayers || 12} игроков</div>
          </div>
          <div class="lobbyLock">${locked ? '🔒' : '🌐'}</div>
          <button class="lobbyJoin" ${full ? 'disabled' : ''}>${full ? 'ПОЛНО' : 'ВОЙТИ'}</button>
        `
        row.querySelector('.lobbyJoin').addEventListener('click', ()=>{
          if (locked){
            selectedPrivateLobby = r
            document.getElementById('privatePassword').value = ''
            document.getElementById('privateJoinBox').style.display = 'flex'
            lobbyStatus('Введите пароль для «' + (r.name || r.id) + '»')
            document.getElementById('privatePassword').focus()
          } else {
            startGame(r.id, '', r.name || r.id)
          }
        })
        box.appendChild(row)
      }
      lobbyStatus('Активных лобби: ' + list.length)
    } catch(e){
      lobbyStatus('Не удалось получить список лобби: ' + (e.message || e), true)
      document.getElementById('lobbyList').innerHTML =
        '<div id="lobbyEmpty">Сервер лобби недоступен.</div>'
    }
  }

  async function createLobby(){
    const rawName = document.getElementById('nameInput').value || ''
    const playerName = cleanName(rawName) || ('Player' + Math.floor(Math.random()*999))
    const lobbyName = String(document.getElementById('newLobbyName').value || '').trim().slice(0,24)
    const kind = document.getElementById('newLobbyType').value
    const password = String(document.getElementById('newLobbyPassword').value || '').trim().slice(0,32)

    if (!lobbyName){ lobbyStatus('Укажи название лобби.', true); return }
    if (kind === 'private' && !password){
      lobbyStatus('Для закрытого лобби нужен пароль.', true); return
    }

    lobbyStatus('Создание лобби…')
    try {
      const msg = await lobbyRequest({
        type:'create',
        name:lobbyName,
        private:kind === 'private',
        password
      })
      document.getElementById('newLobbyName').value = ''
      document.getElementById('newLobbyPassword').value = ''
      lobbyStatus('Лобби создано.')
      startGame(msg.room, password, lobbyName)
    } catch(e){
      lobbyStatus('Не удалось создать лобби: ' + (e.message || e), true)
    }
  }

  async function joinPrivateLobby(){
    if (!selectedPrivateLobby) return
    const password = String(document.getElementById('privatePassword').value || '').trim()
    if (!password){ lobbyStatus('Введите пароль.', true); return }
    startGame(selectedPrivateLobby.id, password, selectedPrivateLobby.name || selectedPrivateLobby.id)
  }

  function startGame(roomId, roomPassword='', lobbyName=''){
    const rawName = document.getElementById('nameInput').value || ''
    const name = cleanName(rawName) || ('Player' + Math.floor(Math.random()*999))
    DBG.log('BOOT', 'starting lobby:', roomId, 'name:', name, 'lobby:', lobbyName)
    closeLobbySocket()
    document.getElementById('menu').style.display = 'none'
    document.getElementById('privateJoinBox').style.display = 'none'

    try {
      sfx.init()
      sfx.startAmbient()
    } catch(e){}

    new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      backgroundColor: '#05070d',
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      render: { antialias:false, pixelArt:false, roundPixels:true },
      fps: { target:45, min:25 },
      scene: [BootScene, GameScene],
      callbacks: {
        preBoot: (game)=>{
          game.registry.set('roomId', roomId)
          game.registry.set('roomPassword', roomPassword)
          game.registry.set('identity', identity)
          game.registry.set('playerName', name)
          game.registry.set('sfx', sfx)
          game.registry.set('lobbyName', lobbyName)
        }
      },
    })
  }

  document.getElementById('refreshLobbies').addEventListener('click', refreshLobbies)
  document.getElementById('createLobbyBtn').addEventListener('click', createLobby)
  document.getElementById('privateJoinBtn').addEventListener('click', joinPrivateLobby)
  document.getElementById('newLobbyType').addEventListener('change', ()=>{
    document.getElementById('newLobbyPassword').style.display =
      document.getElementById('newLobbyType').value === 'private' ? 'block' : 'none'
  })
  document.getElementById('privatePassword').addEventListener('keydown', e=>{
    if (e.key === 'Enter') joinPrivateLobby()
  })

  refreshLobbies()
  DBG.log('BOOT', 'lobby browser ready')
})()
</script>
</body>
  </html>
