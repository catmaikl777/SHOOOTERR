<script type="module">
/* ============================================================
   1. КОНФИГ
   ============================================================ */
const CFG = {
  W: 1800, H: 1200, CELL: 40,
  PLAYER_R: 18, SPEED: 240,
  BULLET_SPEED: 780, BULLET_R: 5, BULLET_LIFE: 1.4,
  FIRE_CD: 150, MAX_HP: 100, DAMAGE: 25, RESPAWN: 2500,
  STATE_MS: 100, INPUT_MS: 66,

  PLAYER_W: 56, PLAYER_H: 48,
  BULLET_SIZE: 14,

  WALL_COLOR:  0xff2266,
  FLOOR_COLOR: 0x1133ff,
  FLOOR_TINT_ALPHA: 1.0,

  WALL_GLOW:  true,
  FLOOR_GLOW: true,

  /* 🎁 Бонусы */
  PICKUP_INTERVAL:   5000,
  PICKUP_MAX:        6,
  PICKUP_RADIUS:     24,
  BONUS_DURATION:    20000,
  BONUS_HP_AMOUNT:   40,
  BONUS_FIRE_MUL:    0.5,
  BONUS_HOMING_TURN: 0.12,
  BONUS_HOMING_NOISE: 0.4,
  BONUS_RICOCHET_MAX: 2,
  BONUS_HOMING_FIRE_CD: 2000,
  BONUS_ONESHOT_FIRE_CD: 5000,
  BONUS_ONESHOT_DAMAGE: 999,

  SFX_MAX_DIST:      1400,
  SFX_MASTER:        0.55,
  AMBIENT_ENABLED:   true,

  /* 🎵 Музыка */
  BGM_VOLUME:        0.35,
}

const AC_CFG = {
  MAX_INPUT_HZ: 45, MAX_PACKET_BYTES: 512, MAX_SEQ_GAP: 300, PEER_TIMEOUT_MS: 20000,
  SPEED_TOLERANCE: 1.35, TELEPORT_HARD: 150,
  FIRE_TOLERANCE: 0.85, AIM_MIN_MAG: 0.05,
  AIM_SNAP_DEG: 100, AIM_SNAP_WINDOW_MS: 40, AIM_HISTORY_MS: 2500,
  ACCURACY_SUSPICIOUS: 0.94, ACCURACY_MIN_SHOTS: 25,
  FOG_ENABLED: true, FOG_RADIUS: 2000,
  STRIKE_DECAY_MS: 30000, STRIKE_KICK: 6, STRIKE_SEVERE: 2,
  SUSPICION_KICK: 25, SUSPICION_DECAY: 0.35,
  HISTORY_MS: 1000, MAX_REWIND_MS: 300,
  SIG_GRACE_MS: 3000,
}

const APP_ID = 'p2p-shooter-identity-v1'
const VOTE_DURATION_MS = 20000
const RELAY_URL = 'wss://shoooterr.relaxdev.ru'

/* ============================================================
   2. DEBUG
   ============================================================ */
const DBG = {
  enabled: true,
  t0: performance.now(),
  log(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.log(`%c[T:${tag} +${dt}s]`, 'color:#3fb950;font-weight:bold', ...args)
  },
  warn(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.warn(`[T:${tag} +${dt}s]`, ...args)
  },
  err(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.error(`[T:${tag} +${dt}s]`, ...args)
  },
  banner(text, color = '#2f81f7'){
    console.log(`%c ${text} `, `background:${color};color:#fff;padding:4px 8px;font-weight:bold;border-radius:3px`)
  },
}

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function colorFromId(id){const h=hashStr(id||'x')%360;return Phaser.Display.Color.HSVToRGB(h/360,0.7,1).color}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fnv1a(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function randomToken(len=24){const b=new Uint8Array(len);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
function cleanName(s){ return String(s||'').replace(/[<>&"']/g,'').trim().slice(0,14) }

function resolveCircleRect(px,py,r,rect){
  const cx=clamp(px,rect.x,rect.x+rect.w), cy=clamp(py,rect.y,rect.y+rect.h)
  const dx=px-cx, dy=py-cy
  const d2=dx*dx+dy*dy
  if(d2>=r*r) return null
  if(d2<0.0001){
    const left=px-rect.x,right=rect.x+rect.w-px,top=py-rect.y,bottom=rect.y+rect.h-py
    const m=Math.min(left,right,top,bottom)
    if(m===left)  return {x:rect.x-r, y:py}
    if(m===right) return {x:rect.x+rect.w+r, y:py}
    if(m===top)   return {x:px, y:rect.y-r}
    return {x:px, y:rect.y+rect.h+r}
  }
  const d=Math.sqrt(d2); const k=(r-d)/d
  return {x:px+dx*k, y:py+dy*k}
}

function segIntersectsRect(x1,y1,x2,y2,r){
  const dx=x2-x1, dy=y2-y1
  let t0=0,t1=1
  const p=[-dx,dx,-dy,dy]
  const q=[x1-r.x, r.x+r.w-x1, y1-r.y, r.y+r.h-y1]
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; continue }
    const t=q[i]/p[i]
    if(p[i]<0){ if(t>t1) return false; if(t>t0) t0=t }
    else      { if(t<t0) return false; if(t<t1) t1=t }
  }
  return true
}
function lineOfSight(x1,y1,x2,y2,walls){
  for(const w of walls){ if(segIntersectsRect(x1,y1,x2,y2,w)) return false }
  return true
}

/* ============================================================
   4. SOUND ENGINE
   ============================================================ */
class SoundEngine {
  constructor(){
    this.ctx = null; this.master = null; this.reverb = null
    this.noiseBuf = null; this.ready = false
    this.enabled = localStorage.getItem('sfx_enabled') !== '0'
    this._ambient = null
  }
  init(){
    if (this.ctx) return
    const Ctx = window.AudioContext || window.webkitAudioContext
    if (!Ctx) return
    try { this.ctx = new Ctx() } catch(e){ return }

    this.master = this.ctx.createGain()
    this.master.gain.value = this.enabled ? CFG.SFX_MASTER : 0

    const comp = this.ctx.createDynamicsCompressor()
    comp.threshold.value = -16; comp.knee.value = 22
    comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25

    this.master.connect(comp); comp.connect(this.ctx.destination)

    this.reverb = this.ctx.createConvolver()
    this.reverb.buffer = this._makeIR(1.6, 2.4)
    this.noiseBuf = this._makeNoise(0.6)

    this.ready = true
    if (this.ctx.state === 'suspended') this.ctx.resume()
  }
  _makeNoise(dur){
    const sr = this.ctx.sampleRate
    const len = Math.floor(sr * dur)
    const buf = this.ctx.createBuffer(1, len, sr)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1
    return buf
  }
  _makeIR(dur, decay){
    const sr = this.ctx.sampleRate
    const len = Math.floor(sr * dur)
    const buf = this.ctx.createBuffer(2, len, sr)
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c)
      for (let i = 0; i < len; i++){
        const t = i / len
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay)
      }
    }
    return buf
  }
  _throttle(key, ms){
    if (!this._thr) this._thr = {}
    const now = performance.now()
    if (this._thr[key] && now - this._thr[key] < ms) return false
    this._thr[key] = now
    return true
  }
  setEnabled(v){
    this.enabled = !!v
    localStorage.setItem('sfx_enabled', this.enabled ? '1' : '0')
    if (this.master){
      const t = this.ctx.currentTime
      this.master.gain.cancelScheduledValues(t)
      this.master.gain.linearRampToValueAtTime(this.enabled ? CFG.SFX_MASTER : 0, t + 0.15)
    }
  }
  _tone({freq=440, freqEnd=null, type='sine', dur=0.2, vol=0.3, attack=0.005, pan=0, send=0}){
    if (!this.ready || !this.enabled || vol <= 0.0001) return
    const t0 = this.ctx.currentTime
    const osc = this.ctx.createOscillator()
    osc.type = type
    osc.frequency.setValueAtTime(freq, t0)
    if (freqEnd != null && freqEnd > 0){
      try { osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur) } catch(e){}
    }
    const g = this.ctx.createGain()
    g.gain.setValueAtTime(0.0001, t0)
    g.gain.linearRampToValueAtTime(Math.max(0.0002, vol), t0 + attack)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(attack + 0.02, dur))
    let panner = null
    if (this.ctx.createStereoPanner){
      panner = this.ctx.createStereoPanner()
      panner.pan.value = clamp(pan, -1, 1)
    }
    osc.connect(g)
    if (panner){ g.connect(panner); panner.connect(this.master) }
    else g.connect(this.master)
    if (send > 0){
      const s = this.ctx.createGain()
      s.gain.value = send
      g.connect(s); s.connect(this.reverb)
    }
    osc.start(t0); osc.stop(t0 + dur + 0.08)
  }
  _noise({dur=0.1, vol=0.3, type='lowpass', freq=2000, freqEnd=null, pan=0, send=0}){
    if (!this.ready || !this.enabled || vol <= 0.0001) return
    const t0 = this.ctx.currentTime
    const src = this.ctx.createBufferSource()
    src.buffer = this.noiseBuf
    const filter = this.ctx.createBiquadFilter()
    filter.type = type
    filter.frequency.setValueAtTime(freq, t0)
    if (freqEnd != null && freqEnd > 0){
      try { filter.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur) } catch(e){}
    }
    const g = this.ctx.createGain()
    g.gain.setValueAtTime(0.0001, t0)
    g.gain.linearRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.003)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
    let panner = null
    if (this.ctx.createStereoPanner){
      panner = this.ctx.createStereoPanner()
      panner.pan.value = clamp(pan, -1, 1)
    }
    src.connect(filter); filter.connect(g)
    if (panner){ g.connect(panner); panner.connect(this.master) }
    else g.connect(this.master)
    if (send > 0){
      const s = this.ctx.createGain()
      s.gain.value = send
      g.connect(s); s.connect(this.reverb)
    }
    src.start(t0); src.stop(t0 + dur + 0.08)
  }
  shoot(kind = 'normal', pan = 0, volMul = 1){
    if (!this._throttle('shoot', 15)) return
    const V = 0.22 * volMul
    if (kind === 'oneshot'){
      this._tone({freq: 140, freqEnd: 40, type:'sawtooth', dur:0.35, vol:V*1.2, pan, send:0.4})
      this._noise({dur:0.28, vol:V*1.1, type:'lowpass', freq:2400, freqEnd:180, pan, send:0.4})
      this._tone({freq: 900, freqEnd: 200, type:'square', dur:0.18, vol:V*0.5, pan, send:0.4})
      return
    }
    if (kind === 'homing' || kind === 'homingRicochet'){
      this._tone({freq: 900, freqEnd: 1800, type:'triangle', dur:0.13, vol:V*0.8, pan, send:0.15})
      this._tone({freq: 1400, freqEnd: 2200, type:'sine', dur:0.11, vol:V*0.5, pan, send:0.15})
    } else if (kind === 'ricochet'){
      this._noise({dur:0.08, vol:V*0.9, type:'highpass', freq:1400, pan, send:0.12})
      this._tone({freq: 1200, freqEnd: 800, type:'square', dur:0.08, vol:V*0.35, pan, send:0.1})
    } else {
      this._noise({dur:0.09, vol:V, type:'lowpass', freq:3200, freqEnd:700, pan, send:0.12})
      this._tone({freq: 200, freqEnd: 60, type:'sawtooth', dur:0.12, vol:V*0.5, pan, send:0.08})
    }
  }
  hitPlayer(pan = 0, volMul = 1){
    if (!this._throttle('hitp', 30)) return
    const V = 0.28 * volMul
    this._tone({freq: 260, freqEnd: 130, type:'square', dur:0.08, vol:V, pan, send:0.15})
    this._noise({dur:0.06, vol:V*0.7, type:'lowpass', freq:900, pan})
  }
  hitShield(pan = 0, volMul = 1){
    const V = 0.26 * volMul
    this._tone({freq: 1600, freqEnd: 2400, type:'sine', dur:0.26, vol:V, pan, send:0.4})
    this._tone({freq: 2400, freqEnd: 3200, type:'triangle', dur:0.2, vol:V*0.6, pan, send:0.4})
  }
  death(pan = 0, volMul = 1){
    const V = 0.32 * volMul
    this._tone({freq: 420, freqEnd: 60, type:'sawtooth', dur:0.7, vol:V, pan, send:0.5})
    this._noise({dur:0.5, vol:V*0.6, type:'lowpass', freq:1400, freqEnd:80, pan, send:0.5})
  }
  kill(pan = 0, volMul = 1){
    const V = 0.3 * volMul
    this._tone({freq: 820, freqEnd: 160, type:'square', dur:0.22, vol:V, pan, send:0.2})
    this._noise({dur:0.14, vol:V*0.6, type:'bandpass', freq:1800, pan, send:0.2})
  }
  respawn(pan = 0, volMul = 1){
    const V = 0.2 * volMul
    this._tone({freq: 300, freqEnd: 600, type:'sine', dur:0.3, vol:V, pan, send:0.3})
    this._tone({freq: 450, freqEnd: 900, type:'sine', dur:0.3, vol:V*0.7, pan, send:0.3})
    this._tone({freq: 600, freqEnd: 1200, type:'triangle', dur:0.35, vol:V*0.5, pan, send:0.3})
  }
  pickup(type = 'hp', pan = 0, volMul = 1){
    const V = 0.26 * volMul
    if (type === 'hp'){
      this._tone({freq: 500, freqEnd: 820, type:'sine', dur:0.2, vol:V, pan, send:0.25})
      this._tone({freq: 750, freqEnd: 1230, type:'sine', dur:0.2, vol:V*0.6, pan, send:0.25})
    } else if (type === 'rapid'){
      this._tone({freq: 400, freqEnd: 1600, type:'square', dur:0.2, vol:V*0.8, pan, send:0.15})
      this._tone({freq: 800, freqEnd: 2000, type:'sine', dur:0.15, vol:V*0.5, pan, send:0.15})
    } else if (type === 'homing'){
      this._tone({freq: 800, freqEnd: 1400, type:'triangle', dur:0.25, vol:V, pan, send:0.3})
      this._tone({freq: 1200, freqEnd: 1800, type:'sine', dur:0.25, vol:V*0.6, pan, send:0.3})
    } else if (type === 'ricochet'){
      this._tone({freq: 1200, freqEnd: 500, type:'triangle', dur:0.22, vol:V, pan, send:0.2})
      this._tone({freq: 1600, freqEnd: 700, type:'sine', dur:0.22, vol:V*0.6, pan, send:0.2})
    } else if (type === 'shield'){
      this._tone({freq: 1000, freqEnd: 1800, type:'sine', dur:0.35, vol:V, pan, send:0.5})
      this._tone({freq: 1500, freqEnd: 2400, type:'triangle', dur:0.3, vol:V*0.7, pan, send:0.5})
    } else if (type === 'oneshot'){
      this._tone({freq: 300, freqEnd: 1200, type:'sawtooth', dur:0.35, vol:V*1.1, pan, send:0.35})
      this._tone({freq: 180, freqEnd: 90, type:'square', dur:0.4, vol:V*0.8, pan, send:0.35})
      this._noise({dur:0.25, vol:V*0.5, type:'bandpass', freq:600, pan, send:0.35})
    } else {
      this._tone({freq: 700, freqEnd: 1100, type:'sine', dur:0.2, vol:V, pan, send:0.2})
    }
  }
  pickupSpawn(pan = 0, volMul = 1){
    const V = 0.07 * volMul
    this._tone({freq: 1200, freqEnd: 900, type:'sine', dur:0.14, vol:V, pan, send:0.25})
  }
  ricochetTick(pan = 0, volMul = 1){
    if (!this._throttle('ric', 40)) return
    const V = 0.11 * volMul
    this._tone({freq: 2000, freqEnd: 1400, type:'sine', dur:0.06, vol:V, pan, send:0.15})
  }
  join(pan = 0, volMul = 1){
    const V = 0.16 * volMul
    this._tone({freq: 500, freqEnd: 900, type:'sine', dur:0.2, vol:V, pan, send:0.2})
    this._tone({freq: 750, freqEnd: 1200, type:'sine', dur:0.2, vol:V*0.6, pan, send:0.2})
  }
  leave(pan = 0, volMul = 1){
    const V = 0.15 * volMul
    this._tone({freq: 900, freqEnd: 400, type:'sine', dur:0.25, vol:V, pan, send:0.2})
  }
  startAmbient(){
    if (!this.ready || this._ambient || !CFG.AMBIENT_ENABLED) return
    const ctx = this.ctx
    const now = ctx.currentTime
    const g = ctx.createGain()
    g.gain.value = 0.0001
    g.gain.linearRampToValueAtTime(0.045, now + 3)
    const filter = ctx.createBiquadFilter()
    filter.type = 'lowpass'; filter.frequency.value = 260; filter.Q.value = 0.8
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.5
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 110
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.018
    lfo.connect(lfoGain); lfoGain.connect(g.gain)
    o1.connect(filter); o2.connect(filter); o3.connect(filter)
    filter.connect(g); g.connect(this.master)
    o1.start(); o2.start(); o3.start(); lfo.start()
    this._ambient = { g, o1, o2, o3, lfo, filter }
  }
}

   ============================================================ */
class Identity {
  constructor(){
    this.ready=false; this.mode='none'; this.pubHash=null
    this.keyPair=null; this.pubJwk=null
  }
  async init(){
    if (!(window.isSecureContext && window.crypto && crypto.subtle)) {
      let stored = localStorage.getItem('p2p_fallback_id')
      if (!stored){ stored = randomToken(12); localStorage.setItem('p2p_fallback_id', stored) }
      this.pubHash = 'fb_' + stored; this.mode = 'fallback'; this.ready = true
      return
    }
    const storeKey = 'p2p_ecdsa_key'
    let stored = null
    try { stored = JSON.parse(localStorage.getItem(storeKey)) } catch {}
    try {
      if (stored && stored.priv && stored.pub) {
        this.keyPair = {
          privateKey: await crypto.subtle.importKey('jwk', stored.priv,
            {name:'ECDSA', namedCurve:'P-256'}, true, ['sign']),
          publicKey: await crypto.subtle.importKey('jwk', stored.pub,
            {name:'ECDSA', namedCurve:'P-256'}, true, ['verify']),
        }
        this.pubJwk = stored.pub
      } else {
        this.keyPair = await crypto.subtle.generateKey(
          {name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify'])
        this.pubJwk = await crypto.subtle.exportKey('jwk', this.keyPair.publicKey)
        const privJwk = await crypto.subtle.exportKey('jwk', this.keyPair.privateKey)
        localStorage.setItem(storeKey, JSON.stringify({priv: privJwk, pub: this.pubJwk}))
      }
      const hex = await this._sha256hex(JSON.stringify(this.pubJwk))
      this.pubHash = hex.slice(0,16); this.mode = 'crypto'; this.ready = true
    } catch (e) {
      let stored2 = localStorage.getItem('p2p_fallback_id') || randomToken(12)
      localStorage.setItem('p2p_fallback_id', stored2)
      this.pubHash = 'fb_' + stored2; this.mode = 'fallback'; this.ready = true
    }
  }
  async _sha256hex(str){
    const buf = new TextEncoder().encode(str)
    const h = await crypto.subtle.digest('SHA-256', buf)
    return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2,'0')).join('')
  }
  async sign(str){
    if (this.mode !== 'crypto' || !crypto?.subtle) return 'no-crypto'
    const buf = new TextEncoder().encode(str)
    const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, this.keyPair.privateKey, buf)
    return btoa(String.fromCharCode(...new Uint8Array(sig)))
  }
  async verify(pubJwk, str, sigB64){
    if (this.mode !== 'crypto' || !crypto?.subtle) return false
    if (!pubJwk || !sigB64) return false
    try {
      const pub = await crypto.subtle.importKey('jwk', pubJwk,
        {name:'ECDSA', namedCurve:'P-256'}, true, ['verify'])
      const buf = new TextEncoder().encode(str)
      const sig = Uint8Array.from(atob(sigB64), c => c.charCodeAt(0))
      return await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, sig, buf)
    } catch { return false }
  }
}

const AC_LOG = []
function acLog(msg){
  AC_LOG.unshift(msg)
  if (AC_LOG.length > 6) AC_LOG.pop()
  const el = document.getElementById('ac')
  if (el) el.textContent = AC_LOG.join('\n')
  console.log('[AC]', msg)
}

class AntiCheat {
  constructor(scene){
    this.scene = scene
    this.peers = new Map()
    this.bans = new Set()
    this.persistentBans = new Set()
    this.myToken = null
    this.seq = 0
    this.histories = new Map()
    this.identity = null
    this.loadPersistentBans()
  }
  loadPersistentBans(){
    try {
      const raw = localStorage.getItem('p2p_bans_' + APP_ID)
      if (raw) {
        const arr = JSON.parse(raw)
        if (Array.isArray(arr)) for (const h of arr) this.persistentBans.add(h)
      }
    } catch {}
  }
  savePersistentBans(){
    try { localStorage.setItem('p2p_bans_' + APP_ID, JSON.stringify([...this.persistentBans])) } catch {}
  }
  isPersistentlyBanned(pubHash){ return !!(pubHash && this.persistentBans.has(pubHash)) }
  addPersistentBan(pubHash){ if (!pubHash) return; this.persistentBans.add(pubHash); this.savePersistentBans() }
  ensure(id){
    let p = this.peers.get(id)
    if (!p) {
      p = { strikes:0, lastStrike:0, suspicion:0, lastUpdate:performance.now(),
            inputTimes:[], lastSeq:-1, token:null, sigRequiredAt:0,
            lastFire:0, shotsFired:0, shotsHit:0,
            aimHistory:[], lastPos:null, lastPosT:0, rtt:0,
            pubHash:null, pubJwk:null, verified:false, nonce:null }
      this.peers.set(id, p)
    }
    return p
  }
  remove(id){ this.peers.delete(id); this.histories.delete(id) }
  strike(id, reason, w=1){
    const p = this.ensure(id)
    p.strikes += w; p.lastStrike = performance.now()
    acLog(`⚡ ${id.slice(0,6)} ${reason} (${p.strikes}/${AC_CFG.STRIKE_KICK})`)
    if (p.strikes >= AC_CFG.STRIKE_KICK) { this.ban(id, reason); return false }
    return true
  }
  ban(id, reason, persistent=false){
    if (this.bans.has(id)) return
    this.bans.add(id)
    const p = this.peers.get(id)
    if (persistent && p && p.pubHash) this.addPersistentBan(p.pubHash)
    acLog(`⛔ BAN ${id.slice(0,6)}: ${reason}`)
    this.scene.onAntiCheatBan?.(id, reason, persistent)
  }
  decay(id, dtSec){
    const p = this.peers.get(id); if (!p) return
    const now = performance.now()
    if (p.strikes > 0 && now - p.lastStrike > AC_CFG.STRIKE_DECAY_MS){ p.strikes--; p.lastStrike = now }
    if (p.suspicion > 0) p.suspicion = Math.max(0, p.suspicion - AC_CFG.SUSPICION_DECAY * dtSec)
  }
  issueToken(id){
    const p = this.ensure(id)
    p.token = randomToken(16)
    p.sigRequiredAt = performance.now() + AC_CFG.SIG_GRACE_MS
    return p.token
  }
  setMyToken(tok){ this.myToken = tok }
  sign(fields){
    const s = `${this.myToken}|${this.seq}|${fields.m[0]}|${fields.m[1]}|${fields.a[0]}|${fields.a[1]}|${fields.f}`
    return fnv1a(s)
  }
  verify(id, payload){
    const p = this.peers.get(id); if (!p || !p.token) return false
    const s = `${p.token}|${payload.seq}|${payload.m[0]}|${payload.m[1]}|${payload.a[0]}|${payload.a[1]}|${payload.f}`
    return fnv1a(s) === payload.sig
  }
  validateInput(id, data){
    if (this.bans.has(id)) return false
    const p = this.ensure(id)
    const now = performance.now()
    p.lastUpdate = now
    let size = 0
    try { size = JSON.stringify(data).length } catch { return this.strike(id,'unserializable',AC_CFG.STRIKE_SEVERE) }
    if (size > AC_CFG.MAX_PACKET_BYTES) return this.strike(id, `oversized`, AC_CFG.STRIKE_SEVERE)
    if (!data || typeof data !== 'object') return this.strike(id, 'not object', AC_CFG.STRIKE_SEVERE)
    if (!this.pair(data.m) || !this.pair(data.a)) return this.strike(id, 'bad vectors', AC_CFG.STRIKE_SEVERE)
    if (typeof data.f !== 'number' || (data.f !== 0 && data.f !== 1)) return this.strike(id, 'bad fire', AC_CFG.STRIKE_SEVERE)
    if (typeof data.seq !== 'number' || !Number.isFinite(data.seq)) return this.strike(id, 'no seq', AC_CFG.STRIKE_SEVERE)
    p.inputTimes.push(now)
    while (p.inputTimes.length && now - p.inputTimes[0] > 1000) p.inputTimes.shift()
    if (p.inputTimes.length > AC_CFG.MAX_INPUT_HZ) return this.strike(id, `flood`, AC_CFG.STRIKE_SEVERE)
    if (data.seq <= p.lastSeq) return this.strike(id, `replay`, AC_CFG.STRIKE_SEVERE)
    if (p.lastSeq >= 0 && data.seq > p.lastSeq + AC_CFG.MAX_SEQ_GAP) return this.strike(id, `seq jump`, 1)
    p.lastSeq = data.seq
    if (p.token && now > p.sigRequiredAt && !this.verify(id, data)) return this.strike(id, 'bad signature', AC_CFG.STRIKE_SEVERE)
    const clip = v => {
      const L = Math.hypot(v[0], v[1])
      if (L > 1.05){ v[0] /= L; v[1] /= L }
      if (L < AC_CFG.AIM_MIN_MAG && v === data.a){ v[0] = 1; v[1] = 0 }
      if (L < 0.001){ v[0] = 0; v[1] = 0 }
    }
    clip(data.m); clip(data.a)
    return true
  }
  pair(v){
    return Array.isArray(v) && v.length === 2 &&
      Number.isFinite(v[0]) && Number.isFinite(v[1]) &&
      Math.abs(v[0]) <= 10 && Math.abs(v[1]) <= 10
  }
  validateMovement(id, prev, next, dt){
    if (!prev) return { x: next.x, y: next.y }
    const dx = next.x - prev.x, dy = next.y - prev.y
    const dist = Math.hypot(dx, dy)
    if (dist > AC_CFG.TELEPORT_HARD) {
      this.strike(id, `teleport`, AC_CFG.STRIKE_SEVERE)
      return { x: prev.x, y: prev.y }
    }
    const maxD = CFG.SPEED * dt * AC_CFG.SPEED_TOLERANCE + 8
    if (dist > maxD) {
      this.strike(id, `speed`, 1)
      const k = maxD / dist
      return { x: prev.x + dx*k, y: prev.y + dy*k }
    }
    return { x: next.x, y: next.y }
  }
  validateFire(id, now, fireCd){
    const p = this.ensure(id)
    const min = fireCd * AC_CFG.FIRE_TOLERANCE
    if (now - p.lastFire < min) return this.strike(id, `rapid fire`, 1)
    p.lastFire = now
    return true
  }
  recordAim(id, ax, ay, now){
    const p = this.ensure(id)
    const last = p.aimHistory[p.aimHistory.length-1]
    if (last){
      const dt = now - last.t
      if (dt < AC_CFG.AIM_SNAP_WINDOW_MS){
        const dot = last.ax*ax + last.ay*ay
        const ang = Math.acos(Math.max(-1, Math.min(1, dot))) * 180/Math.PI
        if (ang > AC_CFG.AIM_SNAP_DEG) p.suspicion += 1.5
      }
    }
    p.aimHistory.push({ ax, ay, t: now })
    while (p.aimHistory.length && now - p.aimHistory[0].t > AC_CFG.AIM_HISTORY_MS) p.aimHistory.shift()
  }
  recordShot(id, hit){
    const p = this.ensure(id)
    p.shotsFired++
    if (hit) p.shotsHit++
    if (p.shotsFired >= AC_CFG.ACCURACY_MIN_SHOTS){
      const acc = p.shotsHit / p.shotsFired
      if (acc > AC_CFG.ACCURACY_SUSPICIOUS) p.suspicion += 0.6
    }
  }
  computeVisible(forId, all, walls, localPos){
    if (!AC_CFG.FOG_ENABLED) return Object.keys(all)
    const R2 = AC_CFG.FOG_RADIUS * AC_CFG.FOG_RADIUS
    const out = []
    for (const id in all){
      if (id === forId){ out.push(id); continue }
      const p = all[id]
      const dx = p.x - localPos.x, dy = p.y - localPos.y
      if (dx*dx + dy*dy > R2) continue
      if (lineOfSight(localPos.x, localPos.y, p.x, p.y, walls)) out.push(id)
    }
    return out
  }
  recordPosition(id, x, y){
    let h = this.histories.get(id)
    if (!h){ h = []; this.histories.set(id, h) }
    const now = performance.now()
    h.push({ x, y, t: now })
    const cut = now - AC_CFG.HISTORY_MS
    while (h.length && h[0].t < cut) h.shift()
  }
  rewindPosition(id, backMs){
    const h = this.histories.get(id)
    if (!h || h.length === 0) return null
    const target = performance.now() - Math.min(backMs, AC_CFG.MAX_REWIND_MS)
    let lo = 0, hi = h.length - 1
    while (lo < hi){ const mid = (lo + hi) >> 1; if (h[mid].t < target) lo = mid+1; else hi = mid }
    return h[lo]
  }
  tick(dtSec){
    const now = performance.now()
    for (const [id, p] of this.peers){
      this.decay(id, dtSec)
      const idle = now - p.lastUpdate
      if (idle > AC_CFG.PEER_TIMEOUT_MS){
        if (!p._idleLogged){ p._idleLogged = true; acLog(`⏸ ${id.slice(0,6)} idle`) }
      } else if (p._idleLogged){ p._idleLogged = false; acLog(`▶ ${id.slice(0,6)} resumed`) }
    }
  }
}

/* ============================================================
   7. LAG COMP
   ============================================================ */
function hostSimulateShot(ac, shooterId, shooterPos, aim, targets, walls){
  const { x, y } = shooterPos
  const len = Math.hypot(aim[0], aim[1]) || 1
  const ax = aim[0]/len, ay = aim[1]/len
  ac.recordAim(shooterId, ax, ay, performance.now())
  const p = ac.ensure(shooterId)
  const rewindMs = Math.min(p.rtt, AC_CFG.MAX_REWIND_MS)
  let bestHit = null, bestDist = Infinity
  for (const tid in targets){
    if (tid === shooterId) continue
    const t = targets[tid]
    if (t.dead) continue
    const rw = ac.rewindPosition(tid, rewindMs)
    const tx = rw ? rw.x : t.x
    const ty = rw ? rw.y : t.y
    if (!lineOfSight(x, y, tx, ty, walls)) continue
    const dx = tx - x, dy = ty - y
    const proj = dx*ax + dy*ay
    if (proj < 0 || proj > CFG.BULLET_SPEED * CFG.BULLET_LIFE) continue
    const px = x + ax*proj, py = y + ay*proj
    const miss = Math.hypot(tx-px, ty-py)
    if (miss < CFG.PLAYER_R && proj < bestDist){ bestDist = proj; bestHit = tid }
  }
  ac.recordShot(shooterId, !!bestHit)
  return bestHit
}

/* ============================================================
   8. КАРТА
   ============================================================ */
const SPAWNS = [
  {x:120,y:120},{x:CFG.W-120,y:120},
  {x:120,y:CFG.H-120},{x:CFG.W-120,y:CFG.H-120},
  {x:CFG.W/2,y:120},{x:CFG.W/2,y:CFG.H-120},
]
function generateWalls(seedStr){
  const rng = mulberry32(hashStr(seedStr))
  const cs = CFG.CELL
  const cols = Math.floor(CFG.W/cs), rows = Math.floor(CFG.H/cs)
  const used = new Set(), out = []
  const push = (c,r) => { const k=c+','+r; if (used.has(k)) return; used.add(k); out.push({x:c*cs,y:r*cs,w:cs,h:cs}) }
  for (let c=0;c<cols;c++){ push(c,0); push(c,rows-1) }
  for (let r=0;r<rows;r++){ push(0,r); push(cols-1,r) }
  const nearSpawn = (x,y) => { for (const s of SPAWNS){ if (Math.abs(s.x-x)<140 && Math.abs(s.y-y)<140) return true } return false }
  for (let i=0;i<60;i++){
    const c = 2 + Math.floor(rng()*(cols-4))
    const r = 2 + Math.floor(rng()*(rows-4))
    const len = 1 + Math.floor(rng()*3)
    const horiz = rng() < 0.5
    for (let j=0;j<len;j++){
      const cc = horiz ? c+j : c, rr = horiz ? r : r+j
      if (cc >= cols-1 || rr >= rows-1) break
      if (nearSpawn(cc*cs+cs/2, rr*cs+cs/2)) continue
      push(cc, rr)
    }
  }
  return out
}

    this.peerNames[this.myPeerId] = this.myName
    this.createView(this.myPeerId)

    this.setupNetwork()
  }

  /* =========== 🎵 МУЗЫКА =========== */
  _setupMusic(){
    try {
      if (!this.cache.audio.exists('bgm')){
        DBG.warn('BGM', 'файл music.mp3 не найден — музыки не будет')
        return
      }
      this.bgm = this.sound.add('bgm', {
        loop: true,
        volume: CFG.BGM_VOLUME,
      })

      const tryPlay = () => {
        if (!this.sfx.enabled) return
        if (this.bgm && !this.bgm.isPlaying){
          try { this.bgm.play() } catch(e){}
        }
      }

      /* Разблокировка звука после первого тапа */
      if (this.sound.locked){
        this.sound.once('unlocked', tryPlay)
      } else {
        tryPlay()
      }

      DBG.log('BGM', 'музыка загружена')
    } catch(e){
      DBG.warn('BGM', 'ошибка инициализации:', e)
    }
  }

  toggleSound(){
    this.sfx.setEnabled(!this.sfx.enabled)
    this.soundBtn.textContent = this.sfx.enabled ? '🔊' : '🔇'

    /* 🎵 Синхронизация музыки с mute */
    if (this.bgm){
      try {
        if (this.sfx.enabled){
          if (!this.bgm.isPlaying) this.bgm.play()
          this.bgm.setVolume(CFG.BGM_VOLUME)
        } else {
          this.bgm.pause()
        }
      } catch(e){ DBG.warn('BGM', 'toggle error:', e) }
    }
  }

  updateCameraZoom(){
    const w = this.scale.width, h = this.scale.height
    const shortSide = Math.min(w, h)
    const worldView = shortSide < 600 ? 450 : 700
    const zoom = clamp(shortSide / worldView, 0.9, 2.5)
    this.cameras.main.setZoom(zoom)
  }

  setupJoysticks(){
    this.moveVec = { x:0, y:0 }
    this.aimVec = { x:1, y:0 }
    this.firing = false

    const joyL = nipplejs.create({
      zone: document.getElementById('joyL'), mode:'static',
      position:{left:'50%',top:'50%'}, color:'#1133ff', size:110, threshold:0.1,
    })
    joyL.on('move', (e,d)=>{
      const f = Math.min(d.force,1)
      this.moveVec.x = Math.cos(d.angle.radian)*f
      this.moveVec.y = -Math.sin(d.angle.radian)*f
    })
    joyL.on('end', ()=>{ this.moveVec.x=0; this.moveVec.y=0 })

    const joyR = nipplejs.create({
      zone: document.getElementById('joyR'), mode:'static',
      position:{left:'50%',top:'50%'}, color:'#ff2266', size:110, threshold:0.1,
    })
    joyR.on('start', ()=>{ this.firing = true })
    joyR.on('move', (e,d)=>{
      const f = Math.min(d.force,1)
      const ax = Math.cos(d.angle.radian), ay = -Math.sin(d.angle.radian)
      if (f > 0.15){ this.aimVec.x = ax; this.aimVec.y = ay }
      this.firing = f > 0.25
    })
    joyR.on('end', ()=>{ this.firing = false })
  }

  _spatial(srcX, srcY, mul=1){
    const dx = srcX - this.local.x
    const dy = srcY - this.local.y
    const dist = Math.hypot(dx, dy)
    const pan = clamp(dx / 500, -1, 1)
    const vol = clamp(1 - dist / CFG.SFX_MAX_DIST, 0.1, 1) * mul
    return { pan, vol }
  }

  /* ============================================================
     🎁 ЛОГИКА БОНУСОВ
     ============================================================ */
  _computeFireBehavior(bonuses, now){
    const rapid = bonuses[0] > now
    const homing = bonuses[1] > now
    const ricochet = bonuses[2] > now
    const oneshot = bonuses[4] > now

    if (oneshot){
      return {
        fireCd: CFG.BONUS_ONESHOT_FIRE_CD,
        opts: { homing: false, ricochet: 0, oneshot: true },
        kind: 'oneshot',
      }
    }

    let fireCd = CFG.FIRE_CD
    if (rapid) fireCd = CFG.FIRE_CD * CFG.BONUS_FIRE_MUL
    if (homing) fireCd = Math.max(fireCd, CFG.BONUS_HOMING_FIRE_CD)

    const opts = {
      homing: homing,
      ricochet: ricochet ? CFG.BONUS_RICOCHET_MAX : 0,
      oneshot: false,
    }
    let kind = 'normal'
    if (homing && ricochet) kind = 'homingRicochet'
    else if (homing) kind = 'homing'
    else if (ricochet) kind = 'ricochet'

    return { fireCd, opts, kind }
  }

  /* ============================================================
     NETWORK
     ============================================================ */
  setupNetwork(){
    this.handlers = {
      in:   (d, id) => this.onNetInput(d, id),
      st:   (d, id) => this.onNetState(d, id),
      bl:   (d, id) => this.onNetBullet(d, id),
      hit:  (d, id) => this.onNetHit(d, id),
      tok:  (d, id) => this.onNetToken(d, id),
      ban:  (d, id) => this.onNetBan(d, id),
      png:  (d, id) => this.onNetPing(d, id),
      id:   (d, id) => this.onNetIdentity(d, id),
      vote: (d, id) => this.onNetVote(d, id),
    }
    this.connectToRelay()
  }

  connectToRelay(){
    try { this.ws = new WebSocket(RELAY_URL) }
    catch(e){ DBG.err('NET', 'ws fail', e); return }

    this.ws.onopen = () => {
      this.reconnectAttempts = 0
      this.ws.send(JSON.stringify({ type: 'join', room: this.roomId }))
    }

    this.ws.onmessage = ev => {
      let msg
      try { msg = JSON.parse(ev.data) } catch { return }
      const { type } = msg

      if (type === 'banned'){
        try { this.ws.close() } catch {}
        alert('Вас забанил сервер античита: ' + msg.reason)
        return
      }
      if (type === 'error') return

      if (type === 'welcome'){
        this.serverHostId = msg.host
        this.migrateMyId(msg.peerId)
        const iAmHost = (msg.host === msg.peerId)
        if (iAmHost){
          this.isHost = true
          this.hasBecomeClient = false
          this.peerNames[this.myPeerId] = this.myName
          this.sendId({ pubHash:this.identity.pubHash, mode:this.identity.mode, name:this.myName }, this.myPeerId)
          this.becomeHost()
        } else {
          this.isHost = false
          this.hasBecomeClient = true
          for (const peerId of msg.peers){
            if (peerId === this.myPeerId) continue
            this.peers.add(peerId)
            if (!this.views[peerId]) this.createView(peerId)
            this.ac.ensure(peerId)
          }
          this.peerNames[this.myPeerId] = this.myName
          if (msg.host){
            this.sendId({ pubHash:this.identity.pubHash, mode:this.identity.mode, name:this.myName }, msg.host)
            this.sendTok({ request:true }, msg.host)
            this.sendId({ challenge:'hello-from-' + this.myPeerId }, msg.host)
          }
        }
        this.updateStatus()
        return
      }

      if (type === 'peer-join'){
        this.sfx.join(0, 0.7)
        this.peers.add(msg.peerId)
        if (!this.views[msg.peerId]) this.createView(msg.peerId)
        this.ac.ensure(msg.peerId)
        if (this.isHost){
          this.addPlayerToWorld(msg.peerId)
          const p = this.ac.ensure(msg.peerId)
          p.nonce = randomToken(12)
          this.sendId({ challenge: p.nonce }, msg.peerId)
          this.sendTok({ token: this.ac.issueToken(msg.peerId) }, msg.peerId)
        }
        this.updateStatus()
        return
      }

      if (type === 'peer-leave'){
        this.sfx.leave(0, 0.7)
        this.peers.delete(msg.peerId)
        this.onPeerLeft(msg.peerId)
        this.destroyView(msg.peerId)
        delete this.scores[msg.peerId]
        delete this.peerNames[msg.peerId]
        delete this.worldPlayers[msg.peerId]
        this.updateStatus()
        return
      }

      if (type === 'host-change'){
        this.serverHostId = msg.host
        if (msg.host === this.myPeerId){
          this.isHost = true
          this.hasBecomeClient = false
          this.becomeHost()
        } else {
          this.isHost = false
          this.hasBecomeClient = true
        }
        this.updateStatus()
        return
      }

      const h = this.handlers[msg.a]
      if (h) h(msg.d, msg.from)
    }

    this.ws.onerror = err => DBG.err('NET', 'ws err', err)
    this.ws.onclose = ev => {
      if (this.reconnectAttempts < 30){
        this.reconnectAttempts++
        const delay = Math.min(2000 * this.reconnectAttempts, 10000)
        setTimeout(() => this.connectToRelay(), delay)
      }
    }
  }

  migrateMyId(newId){
    const oldId = this.myPeerId
    if (oldId === newId) return
    const v = this.views[oldId]
    if (v){ this.views[newId] = v; delete this.views[oldId] }
    if (this.peerNames[oldId]){ this.peerNames[newId] = this.peerNames[oldId]; delete this.peerNames[oldId] }
    this.peerNames[newId] = this.myName
    this.myPeerId = newId
    this.updateStatus()
  }

  sendTo(action, data, peerId){
    if (!this.ws || this.ws.readyState !== 1) return
    this.ws.send(JSON.stringify({ to: peerId, data: { a: action, d: data } }))
  }
  broadcast(action, data){
    if (!this.ws || this.ws.readyState !== 1) return
    this.ws.send(JSON.stringify({ data: { a: action, d: data } }))
  }

  sendInput  (d, id) { this.sendTo('in', d, id) }
  sendState  (d, id) { this.sendTo('st', d, id) }
  sendBullet (d)     { this.broadcast('bl', d) }
  sendHit    (d)     { this.broadcast('hit', d) }
  sendTok    (d, id) { this.sendTo('tok', d, id) }
  sendBan    (d, id) { this.sendTo('ban', d, id) }
  sendPing   (d, id) { this.sendTo('png', d, id) }
  sendId     (d, id) { this.sendTo('id', d, id) }
  sendVote   (d){
    if (this.isHost){ this.broadcast('vote', d) }
    else {
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId) this.sendTo('vote', d, hostId)
    }
  }

  /* =========== HANDLERS =========== */
  onNetInput(data, fromId){
    if (!this.isHost) return
    if (this.ac.bans.has(fromId)) return
    if (!this.ac.validateInput(fromId, data)) return
    data._t = performance.now()
    this.inputs[fromId] = data
  }
  onNetState(data){
    if (this.isHost) return
    this.applyState(data)
  }
  onNetBullet(data){
    if (this.isHost) return
    if (data.owner === this.myPeerId){
      const prefix = 'local_' + this.myPeerId + '_'
      const now = performance.now()
      let fresh = false
      for (const k in this.ghostBullets){
        if (k.startsWith(prefix) && now - this.ghostBullets[k].born < 300){ fresh = true; break }
      }
      if (fresh) return
    }
    const owner = this.views[data.owner]
    let kind = 'normal'
    if (data.oneshot) kind = 'oneshot'
    else if (data.homing && data.ricochet) kind = 'homingRicochet'
    else if (data.homing) kind = 'homing'
    else if (data.ricochet) kind = 'ricochet'
    if (owner){
      const sp = this._spatial(owner.sprite.x, owner.sprite.y)
      this.sfx.shoot(kind, sp.pan, sp.vol)
    } else {
      this.sfx.shoot(kind, 0, 0.4)
    }
    this.spawnGhostBullet(data)
  }
  onNetHit(data){
    if (this.isHost) return
    this.applyHit(data)
  }
  onNetToken(data, fromId){
    if (data.request){
      if (this.isHost){
        const tok = this.ac.issueToken(fromId)
        this.sendTok({ token: tok }, fromId)
      }
    } else if (data.token){
      this.ac.setMyToken(data.token)
    }
  }
  onNetBan(data){
    if (data.full){
      if (Array.isArray(data.bans)) for (const id of data.bans) this.ac.bans.add(id)
      if (Array.isArray(data.pbans)){
        for (const h of data.pbans) this.ac.persistentBans.add(h)
        this.ac.savePersistentBans()
      }
    } else if (data.id){
      this.ac.bans.add(data.id)
      if (data.pubHash) { this.ac.persistentBans.add(data.pubHash); this.ac.savePersistentBans() }
      this.onAntiCheatBan(data.id, data.reason || 'banned', !!data.pubHash)
    }
  }
  onNetPing(data, fromId){
    const p = this.ac.ensure(fromId)
    if (data.pong){
      p.rtt = performance.now() - data.t
      p.lastUpdate = performance.now()
    } else {
      this.sendPing({ t: data.t, pong: 1 }, fromId)
    }
  }
  async onNetIdentity(data, fromId){
    if (data.name){
      const n = cleanName(data.name)
      if (n){
        this.peerNames[fromId] = n
        const v = this.views[fromId]
        if (v && v.label) v.label.setText(n)
        this.renderScores()
      }
    }
    if (data.challenge){
      const sig = await this.identity.sign(data.challenge)
      this.sendId({
        pubJwk: this.identity.pubJwk || null,
        pubHash: this.identity.pubHash,
        sig, mode: this.identity.mode, name: this.myName,
      }, fromId)
    } else if (data.pubHash){
      if (!this.isHost) return
      const p = this.ac.ensure(fromId)
      p.pubHash = data.pubHash
      p.pubJwk = data.pubJwk
      if (data.mode === 'crypto' && data.pubJwk && data.sig){
        p.verified = await this.identity.verify(data.pubJwk, p.nonce || '', data.sig)
      }
      if (this.ac.isPersistentlyBanned(data.pubHash)){ this.ac.ban(fromId, 'persistent ban', false); return }
      acLog(`✓ ${fromId.slice(0,6)} id:${(data.pubHash||'?').slice(0,6)}${p.verified?' v':''}`)
    }
  }
  onNetVote(data, fromId){
    if (this.isHost && fromId !== this.myPeerId){
      for (const peerId of this.peers){
        if (peerId !== fromId) this.sendTo('vote', data, peerId)
      }
    }
    if (data.kind === 'start') this.beginVote(data.target, fromId)
    else if (data.kind === 'cast') this.castVote(fromId, data.agree)
    else if (data.kind === 'blacklist'){
      this.hostBlacklist.add(data.id)
      this.updateStatus()
    }
  }
  onPeerLeft(id){
    delete this.inputs[id]
    delete this.worldPlayers[id]
    delete this.scores[id]
    delete this.peerNames[id]
    this.destroyView(id)
    this.ac.remove(id)
    this.votes.delete(id)
    if (this.voteTarget === id) this.endVote()
  }

  /* =========== HOST =========== */
  currentHostId(){ return this.isHost ? this.myPeerId : this.serverHostId }

  isInsideWall(x, y, r){
    for (const w of this.wallRects){
      if (x > w.x-r && x < w.x+w.w+r && y > w.y-r && y < w.y+w.h+r) return true
    }
    return false
  }

  spawnPickup(){
    const types = ['hp','rapid','homing','ricochet','shield','oneshot']
    const type = types[Math.floor(Math.random()*types.length)]
    let x, y, tries = 0
    do {
      x = 100 + Math.random() * (CFG.W - 200)
      y = 100 + Math.random() * (CFG.H - 200)
      tries++
    } while (this.isInsideWall(x, y, 40) && tries < 40)
    if (tries >= 40) return
    const id = 'pk_' + (++this.pickupSeq)
    this.pickups.push({ id, type, x, y })
    const sp = this._spatial(x, y, 0.6)
    this.sfx.pickupSpawn(sp.pan, sp.vol)
  }

  applyPickup(id, type){
    const p = this.worldPlayers[id]
    if (!p) return
    if (!p.bonuses) this.resetBonuses(p)
    const now = performance.now()
    if (type === 'hp'){
      p.hp = Math.min(p.hp + CFG.BONUS_HP_AMOUNT, CFG.MAX_HP)
    } else if (type === 'rapid'){
      p.bonuses.rapidUntil = now + CFG.BONUS_DURATION
    } else if (type === 'homing'){
      p.bonuses.homingUntil = now + CFG.BONUS_DURATION
    } else if (type === 'ricochet'){
      p.bonuses.ricochetUntil = now + CFG.BONUS_DURATION
    } else if (type === 'shield'){
      p.bonuses.shieldHits = (p.bonuses.shieldHits || 0) + 1
    } else if (type === 'oneshot'){
      p.bonuses.oneshotUntil = now + CFG.BONUS_DURATION
    }
    if (id === this.myPeerId){
      this.sfx.pickup(type, 0, 1)
    } else {
      const sp = this._spatial(p.x, p.y, 0.9)
      this.sfx.pickup(type, sp.pan, sp.vol)
    }
  }

  resetBonuses(p){
    p.bonuses = { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, oneshotUntil:0 }
  }

  syncPickups(list){
    if (!list) return
    const seen = new Set()
    for (let i = 0; i < list.length; i++){
      const [id, type, x, y] = list[i]
      seen.add(id)
      if (!this.pickupSprites[id]){
        const emoji = { hp:'❤️', rapid:'⚡', homing:'🎯', ricochet:'🏓', shield:'🛡', oneshot:'💀' }[type] || '❓'
        const t = this.add.text(x, y, emoji, { fontSize: '32px', fontFamily: 'monospace' })
          .setOrigin(0.5).setDepth(6).setAlpha(0.9)
        t.setData('type', type)
        this.tweens.add({
          targets: t, scale: { from: 0.85, to: 1.15 },
          duration: 700, yoyo: true, repeat: -1,
        })
        this.pickupSprites[id] = t
      } else {
        this.pickupSprites[id].setPosition(x, y)
      }
    }
    for (const id in this.pickupSprites){
      if (!seen.has(id)){
        const sprite = this.pickupSprites[id]
        const type = sprite.getData('type') || 'hp'
        const dx = sprite.x - this.local.x
        const dy = sprite.y - this.local.y
        const dist = Math.hypot(dx, dy)
        if (dist < 200){
          const pan = clamp(dx / 500, -1, 1)
          const vol = clamp(1 - dist / 300, 0.4, 1)
          this.sfx.pickup(type, pan, vol)
        }
        sprite.destroy()
        delete this.pickupSprites[id]
      }
    }
  }

  addPlayerToWorld(id){
    if (!id || this.worldPlayers[id]) return
    const v = this.views[id]
    const idx = Object.keys(this.worldPlayers).length
    const spawn = SPAWNS[idx % SPAWNS.length]
    this.worldPlayers[id] = {
      x: (v && v.init && (v.tx||v.ty)) ? v.tx : spawn.x,
      y: (v && v.init && (v.tx||v.ty)) ? v.ty : spawn.y,
      vx:0, vy:0, aimX:1, aimY:0,
      hp: CFG.MAX_HP, dead:false, fireAt:0, respawnAt:0, score:0,
      bonuses: { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, oneshotUntil:0 },
    }
    if (!this.inputs[id]) this.inputs[id] = { m:[0,0], a:[1,0], f:0 }
  }

  becomeHost(){
    const myCurX = this.predicted.x, myCurY = this.predicted.y
    const meWasInit = Math.abs(myCurX) > 1 || Math.abs(myCurY) > 1
    this.worldPlayers = {}
    this.pickups = []
    this.lastPickupSpawn = 0
    const ids = [this.myPeerId, ...this.peers].filter(id => id && !this.ac.bans.has(id))
    for (const id of ids){
      const v = this.views[id]
      const spawn = SPAWNS[ids.indexOf(id) % SPAWNS.length]
      const use = v && v.init && (Math.abs(v.tx) > 1 || Math.abs(v.ty) > 1)
      this.worldPlayers[id] = {
        x: use ? v.tx : spawn.x, y: use ? v.ty : spawn.y,
        vx:0, vy:0, aimX:1, aimY:0,
        hp: v ? v.hp : CFG.MAX_HP, dead: v ? v.dead : false,
        fireAt:0, respawnAt:0, score:0,
        bonuses: { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, oneshotUntil:0 },
      }
      if (!this.inputs[id]) this.inputs[id] = { m:[0,0], a:[1,0], f:0 }
    }
    const me = this.worldPlayers[this.myPeerId]
    if (me){
      if (meWasInit){ me.x = myCurX; me.y = myCurY }
      else { const s = SPAWNS[0]; me.x = s.x; me.y = s.y }
      this.local.x = me.x; this.local.y = me.y
      this.predicted.x = me.x; this.predicted.y = me.y
      const v = this.views[this.myPeerId]
      if (v){ v.tx = me.x; v.ty = me.y; v.sprite.x = me.x; v.sprite.y = me.y; v.init = true }
    }
    for (const peerId of this.peers){
      this.sendBan({ full:true, bans:[...this.ac.bans], pbans:[...this.ac.persistentBans] }, peerId)
    }
    acLog(`👑 хост: ${this.myPeerId.slice(0,6)}`)
    this.updateStatus()
  }

  /* =========== VOTE =========== */
  onVoteClick(){
    const hostId = this.currentHostId()
    if (!hostId || hostId === this.myPeerId){ acLog('✖ ты хост'); return }
    if (this.voteActive && this.voteTarget === hostId){
      const already = this.votes.has(this.myPeerId)
      this.castVote(this.myPeerId, !already)
      this.sendVote({ kind:'cast', agree: !already })
      return
    }
    this.beginVote(hostId, this.myPeerId)
    this.sendVote({ kind:'start', target: hostId })
  }
  beginVote(target, initiator){
    if (this.voteActive) return
    this.voteActive = true
    this.voteTarget = target
    this.voteDeadline = performance.now() + VOTE_DURATION_MS
    this.votes.clear()
    if (initiator) this.votes.set(initiator, target)
    this.updateVoteUI()
  }
  castVote(voter, agree){
    if (!this.voteActive) return
    if (agree) this.votes.set(voter, this.voteTarget)
    else this.votes.delete(voter)
    this.checkVoteResult()
    this.updateVoteUI()
  }
  checkVoteResult(){
    if (!this.voteActive) return
    const total = 1 + this.peers.size
    const yes = this.votes.size
    const failed = performance.now() > this.voteDeadline
    if (yes > total / 2){
      this.hostBlacklist.add(this.voteTarget)
      this.sendVote({ kind:'blacklist', id: this.voteTarget })
      this.endVote()
    } else if (failed) this.endVote()
  }
  endVote(){
    this.voteActive = false
    this.voteTarget = null
    this.votes.clear()
    this.voteBtn.classList.remove('armed')
    this.updateVoteUI()
  }
  updateVoteUI(){
    if (!this.voteInfo || !this.voteBtn) return
    if (!this.voteActive){ this.voteInfo.textContent = ''; this.voteBtn.classList.remove('armed'); return }
    const total = 1 + this.peers.size
    const yes = this.votes.size
    this.voteInfo.textContent = `VOTE ${yes}/${total}\nцель: ${(this.voteTarget||'').slice(0,6)}`
    this.voteBtn.classList.toggle('armed', this.votes.has(this.myPeerId))
  }

  /* =========== STATUS =========== */
  updateStatus(){
    if (!this.statusEl) return
    const n = this.peers.size + (this.myPeerId ? 1 : 0)
    const role = this.isHost ? 'HOST' : (this.hasBecomeClient ? 'CLIENT' : 'WAIT')
    const hp = Math.max(0, Math.round(this.local.hp))
    const sc = this.local.score || 0
    const myName = this.peerNames[this.myPeerId] || this.myName || '?'
    let ping = 0
    for (const [, p] of this.ac.peers){
      const v = p.rtt || 0
      if (v > 0 && v < 5000 && v > ping) ping = v
    }
    ping = Math.round(ping)
    this.statusEl.textContent = `${role} · ${myName} · ${this.roomId} · игроков: ${n} · HP: ${hp} · очки: ${sc} · ping: ${ping}ms`
  }

  renderBonuses(){
    if (!this.bonusesEl) return
    const bn = this.localBonuses
    const now = performance.now()
    const parts = []
    if (bn[4] > now){
      parts.push(`💀 ${Math.ceil((bn[4]-now)/1000)}s`)
    } else {
      if (bn[0] > now) parts.push(`⚡ ${Math.ceil((bn[0]-now)/1000)}s`)
      if (bn[1] > now) parts.push(`🎯 ${Math.ceil((bn[1]-now)/1000)}s`)
      if (bn[2] > now) parts.push(`🏓 ${Math.ceil((bn[2]-now)/1000)}s`)
    }
    if (bn[3] > 0) parts.push(`🛡 ×${bn[3]}`)
    if (parts.length){
      this.bonusesEl.textContent = parts.join(' · ')
      this.bonusesEl.style.display = 'block'
    } else {
      this.bonusesEl.style.display = 'none'
    }
  }

  renderScores(){
    if (!this.scoresEl) return
    if (!this.scores || Object.keys(this.scores).length === 0){ this.scoresEl.textContent = ''; return }
    const rows = []
    for (const id in this.scores){
      if (id !== this.myPeerId && !this.peers.has(id)) continue
      const score = this.scores[id]
      const v = this.views[id]
      const isMe = id === this.myPeerId
      const dead = v ? v.dead : false
      rows.push({ id, score, isMe, dead })
    }
    rows.sort((a,b) => b.score - a.score)
    let html = '🏆 СЧЁТ\n'
    for (let i = 0; i < rows.length; i++){
      const r = rows[i]
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '  '
      const tag = r.isMe ? ' (я)' : ''
      const cls = r.isMe ? 'me' : (r.dead ? 'dead' : '')
      const name = this.peerNames[r.id] || r.id.slice(0, 6)
      html += `<span class="${cls}">${medal} ${name}${tag} · ${r.score}</span>\n`
    }
    this.scoresEl.innerHTML = html
  }

  /* =========== STATE =========== */
  applyState(data){
    if (!data || !data.p) return
    if (data.names){
      for (const id in data.names){
        const n = cleanName(data.names[id])
        if (n) this.peerNames[id] = n
      }
    }
    if (data.scores){
      this.scores = data.scores
      if (this.myPeerId && this.scores[this.myPeerId] !== undefined){
        this.local.score = this.scores[this.myPeerId]
      }
    }
    if (data.pickups) this.syncPickups(data.pickups)

    const now = performance.now()
    for (const id in data.p){
      if (id !== this.myPeerId && !this.peers.has(id)) continue
      const arr = data.p[id]
      const x = arr[0], y = arr[1], ax = arr[2], ay = arr[3], hp = arr[4], dead = arr[5]
      const bn = arr[6]
      if (id === this.myPeerId){
        this.local.hp = hp
        this.local.dead = !!dead
        if (bn && Array.isArray(bn) && bn.length >= 4){
          this.localBonuses = [
            bn[0] > 0 ? now + bn[0] : 0,
            bn[1] > 0 ? now + bn[1] : 0,
            bn[2] > 0 ? now + bn[2] : 0,
            bn[3] || 0,
            bn[4] > 0 ? now + bn[4] : 0,
          ]
        } else {
          this.localBonuses = [0, 0, 0, 0, 0]
        }
        const dx = x - this.predicted.x, dy = y - this.predicted.y
        if (Math.abs(dx) > 120 || Math.abs(dy) > 120){
          this.predicted.x = x; this.predicted.y = y
        } else {
          this.predicted.x += dx * 0.15
          this.predicted.y += dy * 0.15
        }
      } else {
        let v = this.views[id]
        if (!v){ v = this.createView(id); v.tx = x; v.ty = y; v.init = true; v.sprite.x = x; v.sprite.y = y }
        const wasDead = v.dead
        if (!v.buffer) v.buffer = []
        v.buffer.push({ x, y, ax, ay, hp, dead, bn, t: now })
        while (v.buffer.length > 15) v.buffer.shift()
        v.tx = x; v.ty = y
        v.hp = hp; v.dead = !!dead
        const sp = this._spatial(v.sprite.x, v.sprite.y)
        if (wasDead && !v.dead) this.sfx.respawn(sp.pan, sp.vol * 0.8)
        if (!wasDead && v.dead) this.sfx.death(sp.pan, sp.vol)
      }
    }
    for (const id in this.views){
      if (id === this.myPeerId) continue
      if (!(id in data.p) || !this.peers.has(id)){
        this.destroyView(id)
        delete this.scores[id]
        delete this.peerNames[id]
      }
    }
  }

  spawnGhostBullet(d){
    if (this.ghostBullets[d.id]) return
    let color = 0xffe066
    if (d.oneshot) color = 0xff2244
    else if (d.homing && d.ricochet) color = 0xff22ff
    else if (d.homing) color = 0xff66ff
    else if (d.ricochet) color = 0x22ffff
    const s = this.add.image(d.x, d.y, 'bullet')
      .setDisplaySize(CFG.BULLET_SIZE, CFG.BULLET_SIZE)
      .setTint(color).setBlendMode(Phaser.BlendModes.ADD).setDepth(5)
    this.ghostBullets[d.id] = {
      sprite: s, vx: d.vx, vy: d.vy, born: this.time.now,
      bouncesLeft: d.ricochet || 0,
      homing: !!d.homing,
    }
  }

  applyHit(d){
    if (d.bid && this.ghostBullets[d.bid]){
      this.ghostBullets[d.bid].sprite.destroy()
      delete this.ghostBullets[d.bid]
    }
    const isMe = d.target === this.myPeerId
    const byMe = d.by === this.myPeerId

    if (byMe && !isMe){
      this.sfx.hitPlayer(0, 1)
      if (d.dead) this.sfx.kill(0, 1)
    } else if (isMe){
      if (d.blocked) this.sfx.hitShield(0, 1)
      else {
        this.sfx.hitPlayer(0, 1)
        if (d.dead) this.sfx.death(0, 1)
      }
    } else {
      const v = this.views[d.target]
      if (v){
        const sp = this._spatial(v.sprite.x, v.sprite.y, 0.8)
        if (d.blocked) this.sfx.hitShield(sp.pan, sp.vol)
        else this.sfx.hitPlayer(sp.pan, sp.vol)
        if (d.dead) this.sfx.death(sp.pan, sp.vol)
      }
    }

    if (isMe){
      if (d.blocked){
        this.cameras.main.flash(90, 100, 200, 255)
        if (this.localBonuses[3] > 0) this.localBonuses[3]--
      } else {
        this.local.hp = d.hp
        this.local.dead = !!d.dead
        this.cameras.main.flash(90, 255, 30, 100)
        if (d.dead) this.localBonuses = [0, 0, 0, 0, 0]
      }
    }
    const v = this.views[d.target]
    if (v){
      v.hp = d.hp
      if (d.dead) v.dead = true
      v.sprite.setTintFill(d.blocked ? 0x88ccff : 0xffffff)
      this.time.delayedCall(60, ()=>{
        if (v.sprite && v.sprite.active) v.sprite.setTint(colorFromId(d.target))
      })
    }
    if (byMe) this.cameras.main.shake(50, 0.002)
  }

  /*){
      this =========== UPDATE.last =========== */
  update(timePick, delta){
    const dt =up Math.min(delta, 50) / S1000

    if (pawntime - this.lastAcTick > 250){
      const dtAc = (time - this.lastAcTick) / 1000
      this.lastAcTick = time
      this.ac.tick(dtAc)
    }
    if (this.voteActive) this.checkVoteResult()

    if (!this.local.dead){
      const nx = this.predicted.x + this.moveVec.x * CFG.SPEED * dt
      const ny = this.predicted.y + this.moveVec.y * CFG.SPEED * dt
      const p = this.resolveWorld(nx, ny)
      this.predicted.x = p.x; this.predicted.y = p.y
    }
    this.local.x = this.predicted.x
    this.local.y = this.predicted.y
    this.local.aimX = this.aimVec.x
    this.local.aimY = this.aimVec.y

    if (time - this._lastPing > 2000){
      this._lastPing = time
      for (const peerId of this.peers){
        this.sendPing({ t: performance.now(), pong: 0 }, peerId)
      }
    }

    if (!this.isHost && time - this._lastNameSent > 5000){
      this._lastNameSent = time
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId){
        this.sendId({ name: this.myName }, hostId)
      }
    }

    if (!this.isHost && time - this.lastInputSent > CFG.INPUT_MS){
      this.lastInputSent = time
      const hostId = this.currentHostId()
      if (hostId && hostId !== this.myPeerId){
        this.ac.seq++
        const payload = {
          seq: this.ac.seq,
          m: [this.moveVec.x, this.moveVec.y],
          a: [this.aimVec.x, this.aimVec.y],
          f: this.firing ? 1 : 0,
          d: this.local.dead ? 1 : 0,
        }
        payload.sig = this.ac.sign(payload)
        this.sendInput(payload, hostId)
      }
    }

    if (this.isHost){
      this.inputs[this.myPeerId] = {
        m: [this.moveVec.x, this.moveVec.y],
        a: [this.aimVec.x, this.aimVec.y],
        f: this.firing ? 1 : 0,
        d: this.local.dead ? 1 : 0,
        _t: time,
      }
      this.simulateHost(time, dt)
    }

    /* Локальное предсказание пуль */
    if (!this.isHost && !this.local.dead){
      const now = performance.now()
      const behavior = this._computeFireBehavior(this.localBonuses, now)
      if (this.firing && time - this._lastLocalShot > behavior.fireCd){
        this._lastLocalShot = time
        const len = Math.hypot(this.aimVec.x, this.aimVec.y) || 1
        const ax = this.aimVec.x / len
        const ay = this.aimVec.y / len
        const id = 'local_' + this.myPeerId + '_' + (++this.bulletSeq)
        this.sfx.shoot(behavior.kind, 0, 1)
        this.spawnGhostBullet({
          id,
          x: this.local.x + ax * (CFG.PLAYER_R + 6),
          y: this.local.y + ay * (CFG.PLAYER_R + 6),
          vx: ax * CFG.BULLET_SPEED,
          vy: ay * CFG.BULLET_SPEED,
          owner: this.myPeerId,
          homing: behavior.opts.homing,
          ricochet: behavior.opts.ricochet,
          oneshot: behavior.opts.oneshot,
        })
      }
    }

    this.updateGhostBullets(time, dt)
    this.renderPlayers(time, dt)
    if (time % 200 < 20){
      this.updateStatus()
      this.updateVoteUI()
      this.renderScores()
      this.renderBonuses()
    }
  }

  resolveWorld(x, y){
    x = clamp(x, CFG.PLAYER_R, CFG.W - CFG.PLAYER_R)
    y = clamp(y, CFG.PLAYER_R, CFG.H - CFG.PLAYER_R)
    for (const r of this.wallRects){
      const res = resolveCircleRect(x, y, CFG.PLAYER_R, r)
      if (res){ x = res.x; y = res.y }
    }
    return { x, y }
  }

  /* =========== HOST SIM =========== */
  simulateHost(time, dt){
    const now = performance.now()

    for (const id in this.worldPlayers){
      const p = this.worldPlayers[id]
      let inp = this.inputs[id] || { m:[0,0], a:[1,0], f:0 }
      const lastInputAge = time - (inp._t || 0)
      if (lastInputAge > 500 && id !== this.myPeerId){
        inp = { m:[0,0], a: inp.a || [1,0], f: 0 }
      }
      if (!p.bonuses) this.resetBonuses(p)

      if (p.dead){
        if (time > p.respawnAt){
          const sp = SPAWNS[Math.floor(Math.random()*SPAWNS.length)]
          p.x = sp.x; p.y = sp.y; p.hp = CFG.MAX_HP; p.dead = false; p.vx = 0; p.vy = 0
          this.resetBonuses(p)
          if (id === this.myPeerId) this.sfx.respawn(0, 1)
        } else continue
      }

      const prev = { x:p.x, y:p.y }
      p.vx = (inp.m[0]||0) * CFG.SPEED
      p.vy = (inp.m[1]||0) * CFG.SPEED
      const nx = p.x + p.vx*dt, ny = p.y + p.vy*dt
      const res = this.resolveWorld(nx, ny)
      const fixed = this.ac.validateMovement(id, prev, res, dt)
      p.x = fixed.x; p.y = fixed.y
      this.ac.recordPosition(id, p.x, p.y)
      p.aimX = inp.a[0] || 1
      p.aimY = inp.a[1] || 0

      const bnArr = [
        p.bonuses.rapidUntil || 0,
        p.bonuses.homingUntil || 0,
        p.bonuses.ricochetUntil || 0,
        p.bonuses.shieldHits || 0,
        p.bonuses.oneshotUntil || 0,
      ]
      const behavior = this._computeFireBehavior(bnArr, now)

      if (inp.f && time - p.fireAt > behavior.fireCd){
        if (!this.ac.validateFire(id, time, behavior.fireCd)) continue
        const len = Math.hypot(p.aimX, p.aimY) || 1
        const ax = p.aimX/len, ay = p.aimY/len
        p.fireAt = time

        if (id === this.myPeerId){
          this.sfx.shoot(behavior.kind, 0, 1)
        } else {
          const sp = this._spatial(p.x, p.y)
          this.sfx.shoot(behavior.kind, sp.pan, sp.vol)
        }

        this.hostSpawnBullet(id, p.x, p.y, ax, ay, behavior.opts)
      }

      for (let i = this.pickups.length - 1; i >= 0; i--){
        const pk = this.pickups[i]
        const dx = p.x - pk.x, dy = p.y - pk.y
        const rr = CFG.PLAYER_R + CFG.PICKUP_RADIUS
        if (dx*dx + dy*dy < rr*rr){
          this.applyPickup(id, pk.type)
          this.pickups.splice(i, 1)
        }
      }
    }

    if (time - this.lastPickupSpawn > CFG.PICKUP_INTERVAL && this = time
      this.spawnPickup()
    }

    for (let i = this.bullets.length - 1; i >= 0; i--){
      const b = this.bullets[i]

      if (b.homing){
        let nearest = null, nd = Infinity
        for (const tid in this.worldPlayers){
          if (tid === b.owner) continue
          const t = this.worldPlayers[tid]
          if (t.dead) continue
          const dx = t.x - b.x, dy = t.y - b.y
          const d2 = dx*dx + dy*dy
          if (d2 < nd){ nd = d2; nearest = t }
        }
        if (nearest){
          const dx = nearest.x - b.x, dy = nearest.y - b.y
          const targetAngle = Math.atan2(dy, dx)
          const curAngle = Math.atan2(b.vy, b.vx)
          const noise = (Math.random() - 0.5) * CFG.BONUS_HOMING_NOISE
          const wantAngle = targetAngle + noise
          let diff = wantAngle - curAngle
          while (diff > Math.PI) diff -= 2*Math.PI
          while (diff < -Math.PI) diff += 2*Math.PI
          const turn = Math.max(-CFG.BONUS_HOMING_TURN, Math.min(CFG.BONUS_HOMING_TURN, diff))
          const speed = Math.hypot(b.vx, b.vy)
          const newAngle = curAngle + turn
          b.vx = Math.cos(newAngle) * speed
          b.vy = Math.sin(newAngle) * speed
        }
      }

      let nx = b.x + b.vx*dt
      let ny = b.y + b.vy*dt

      let hitWall = null
      for (const r of this.wallRects){
        if (nx > r.x-CFG.BULLET_R && nx < r.x+r.w+CFG.BULLET_R &&
            ny > r.y-CFG.BULLET_R && ny < r.y+r.h+CFG.BULLET_R){ hitWall = r; break }
      }

      if (hitWall){
        if (b.bouncesLeft > 0){
          b.bouncesLeft--
          const sp = this._spatial(b.x, b.y, 0.7)
          this.sfx.ricochetTick(sp.pan, sp.vol)
          const cx = hitWall.x + hitWall.w/2
          const cy = hitWall.y + hitWall.h/2
          const dx = nx - cx, dy = ny - cy
          const halfW = hitWall.w/2 + CFG.BULLET_R
          const halfH = hitWall.h/2 + CFG.BULLET_R
          const overlapX = halfW - Math.abs(dx)
          const overlapY = halfH - Math.abs(dy)
          if (overlapX < overlapY){
            b.vx = -b.vx
            nx = b.x + Math.sign(dx || 1) * overlapX
          } else {
            b.vy = -b.vy
            ny = b.y + Math.sign(dy || 1) * overlapY
          }
        } else {
          this.bullets.splice(i, 1)
          continue
        }
      }

      b.x = nx
      b.y = ny

      if (time - b.born > CFG.BULLET_LIFE*1000){
        this.bullets.splice(i, 1)
        continue
      }

      let hitSomeone = false
      for (const tid in this.worldPlayers){
        if (tid === b.owner) continue
        const t = this.worldPlayers[tid]
        if (t.dead) continue
        const dx = t.x - b.x, dy = t.y - b.y
        const rr = CFG.PLAYER_R + CFG.BULLET_R
        if (dx*dx + dy*dy < rr*rr){
          let blocked = false
          if (t.bonuses && t.bonuses.shieldHits > 0){
            t.bonuses.shieldHits--
            blocked = true
          } else {
            const dmg = b.oneshot ? CFG.BONUS_ONESHOT_DAMAGE : CFG.DAMAGE
            t.hp -= dmg
          }
          let killed = false
          if (!blocked && t.hp <= 0){
            t.hp = 0; t.dead = true; t.respawnAt = time + CFG.RESPAWN
            killed = true
            this.resetBonuses(t)
            const shooter = this.worldPlayers[b.owner]
            if (shooter) shooter.score = (shooter.score || 0) + 1
          }
          const hd = { bid: b.id, target: tid, by: b.owner, hp: t.hp, dead: t.dead, killed, blocked }
          this.sendHit(hd)
          this.applyHit(hd)
          this.bullets.splice(i, 1)
          hitSomeone = true
          break
        }
      }
      if (hitSomeone) continue
    }

    if (time - this.lastStateSent > CFG.STATE_MS){
      this.lastStateSent = time

      if (time - this._lastVisibleCalc > 150){
        this._lastVisibleCalc = time
        this._visibleCache = {}
        for (const pid of [this.myPeerId, ...this.peers]){
          const viewer = this.worldPlayers[pid]
          if (viewer){
            this._visibleCache[pid] = this.ac.computeVisible(
              pid, this.worldPlayers, this.wallRects, viewer
            )
          }
        }
      }

      const scores = {}
      for (const id in this.worldPlayers){
        scores[id] = Math.round(this.worldPlayers[id].score || 0)
      }

      const names = {}
      for (const id in this.peerNames) names[id] = this.peerNames[id]
      names[this.myPeerId] = this.myName

      const pickups = this.pickups.map(pk => [
        pk.id, pk.type, Math.round(pk.x), Math.round(pk.y)
      ])

      for (const peerId of [this.myPeerId, ...this.peers]){
        if (this.ac.bans.has(peerId)) continue
        const visible = this._visibleCache[peerId]
        if (!visible) continue
        const pack = {}
        for (const id of visible){
          const w = this.worldPlayers[id]
          if (!w) continue
          const bn = w.bonuses || { rapidUntil:0, homingUntil:0, ricochetUntil:0, shieldHits:0, oneshotUntil:0 }
          pack[id] = [
            Math.round(w.x), Math.round(w.y),
            Math.round(w.aimX*100)/100, Math.round(w.aimY*100)/100,
            Math.round(w.hp), w.dead ? 1 : 0,
            [
              Math.max(0, Math.round((bn.rapidUntil||0) - now)),
              Math.max(0, Math.round((bn.homingUntil||0) - now)),
              Math b.max(0, Math.round((bn.ricoc.hetUntil||0) - now)),
              bn.shvyieldHits ||, 0,
              Math.max(0, owner Math.round((bn.oneshotUntil||0:) - now)),
            ],
          owner ]
        }
        const payload = { p:Id pack, scores, names, pickups }

        if (peerId === this.my     PeerId) this.applyState(payload hom)
        else this.sendState(payloading, peerId)
      }

  }

      oneshotlet: !!opts.oneshot,
    }
(p    this.bullets.push(b)
    const payload = {
      id: b.id, x: b.x, y: b.y, vx: b.vx, vy:ayload)
    this.spawnGhostBullet(payload)
  }

  updateGhostBullets(time, dt){
    for (const id in this.ghostBullets){
      const g = this.ghostBullets[id]

      if (g.homing){
        let nearest = null, nd = Infinity
        for (const vid in this.views){
          if (vid === this.myPeerId) continue
          const v = this.views[vid]
          if (!v || v.dead) continue
          const dx = v.sprite.x - g.sprite.x
          const dy = v.sprite.y - g.sprite.y
          const d2 = dx*dx + dy*dy
          if (d2 < nd){ nd = d2; nearest = v }
        }
        if (nearest){
          const dx = nearest.sprite.x - g.sprite.x
          const dy = nearest.sprite.y - g.sprite.y
          const targetAngle = Math.atan2(dy, dx)
          const curAngle = Math.atan2(g.vy, g.vx)
          const noise = (Math.random() - 0.5) * CFG.BONUS_HOMING_NOISE
          const wantAngle = targetAngle + noise
          let diff = wantAngle - curAngle
          while (diff > Math.PI) diff -= 2*Math.PI
          while (diff < -Math.PI) diff += 2*Math.PI
          const turn = Math.max(-CFG.BONUS_HOMING_TURN, Math.min(CFG.BONUS_HOMING_TURN, diff))
          const speed = Math.hypot(g.vx, g.vy)
          const newAngle = curAngle + turn
          g.vx = Math.cos(newAngle) * speed
          g.vy = Math.sin(newAngle) * speed
        }
      }

      let nx = g.sprite.x + g.vx*dt
      let ny = g.sprite.y + g.vy*dt

      let hitWall = null
      for (const r of this.wallRects){
        if (nx > r.x-CFG.BULLET_R && nx < r.x+r.w+CFG.BULLET_R &&
            ny > r.y-CFG.BULLET_R && ny < r.y+r.h+CFG.BULLET_R){ hitWall = r; break }
      }

      if (hitWall){
        if (g.bouncesLeft > 0){
          g.bouncesLeft--
          const sp = this._spatial(g.sprite.x, g.sprite.y, 0.6)
          this.sfx.ricochetTick(sp.pan, sp.vol)
          const cx = hitWall.x + hitWall.w/2
          const cy = hitWall.y + hitWall.h/2
          const dx = nx - cx, dy = ny - cy
          const halfW = hitWall.w/2 + CFG.BULLET_R
          const halfH = hitWall.h/2 + CFG.BULLET_R
          const overlapX = halfW - Math.abs(dx)
          const overlapY = halfH - Math.abs(dy)
          if (overlapX < overlapY){
            g.vx = -g.vx
            nx = g.sprite.x + Math.sign(dx || 1) * overlapX
          } else {
            g.vy = -g.vy
            ny = g.sprite.y + Math.sign(dy || 1) * overlapY
          }
        } else {
          g.sprite.destroy()
          delete this.ghostBullets[id]
          continue
        }
      }

      g.sprite.x = nx
      g.sprite.y = ny

      if (time - g.born > CFG.BULLET_LIFE*1000){
        g.sprite.destroy()
        delete this.ghostBullets[id]
      }
    }
  }

  renderPlayers(time, dt){
    const k = Math.min(1, dt*14)
    for (const id in this.views){
      if (id !== this.myPeerId && !this.peers.has(id)){
        this.destroyView(id)
        continue
      }
      const v = this.views[id]

      if (id === this.myPeerId){
        v.tx = this.local.x; v.ty = this.local.y
        v.ta = Math.atan2(this.local.aimY, this.local.aimX)
        v.hp = this.local.hp
        v.dead = this.local.dead
        if (!v.init){ v.init = true; v.sprite.x = v.tx; v.sprite.y = v.ty }
        else { v.sprite.x = v.tx; v.sprite.y = v.ty }
      } else if (v.buffer && v.buffer.length >= 2){
        const renderTime = performance.now() - 100
        let a = v.buffer[0], b = v.buffer[v.buffer.length-1]
        for (let i = 0; i < v.buffer.length - 1; i++){
          if (v.buffer[i].t <= renderTime && v.buffer[i+1].t > renderTime){
            a = v.buffer[i]; b = v.buffer[i+1]; break
          }
        }
        const span = Math.max(1, b.t - a.t)
        const alpha = Math.min(1, Math.max(0, (renderTime - a.t) / span))
        v.sprite.x = a.x + (b.x - a.x) * alpha
        v.sprite.y = a.y + (b.y - a.y) * alpha
        v.ta = Math.atan2(b.ay, b.ax)
        v.hp = b.hp
        v.dead = b.dead
        v.init = true
      } else {
        if (!v.init){ v.init = true; v.sprite.x = v.tx; v.sprite.y = v.ty }
        else {
          v.sprite.x += (v.tx - v.sprite.x) * k
          v.sprite.y += (v.ty - v.sprite.y) * k
        }
      }

      v.sprite.rotation = v.ta
      const vis = !v.dead
      v.sprite.setVisible(vis); v.bar.setVisible(vis)

      if (v.shield){
        let shields = 0
        if (id === this.myPeerId){
          shields = this.localBonuses[3] || 0
        } else if (v.buffer && v.buffer.length){
          const last = v.buffer[v.buffer.length - 1]
          shields = (last.bn && last.bn[3]) || 0
        }
        v.shield.setPosition(v.sprite.x, v.sprite.y)
        v.shield.setVisible(vis && shields > 0)
      }

      if (vis){
        const bx = v.sprite.x - 20, by = v.sprite.y - 34
        const w = 40 * (v.hp / CFG.MAX_HP)
        v.bar.clear()
        v.bar.fillStyle(0x000000, 0.6); v.bar.fillRect(bx-1, by-1, 42, 7)
        v.bar.fillStyle(v.hp>50?0x3fb950:v.hp>25?0xd29922:0xf85149, 1)
        v.bar.fillRect(bx, by, w, 5)
        if (v.label){
          const currentName = this.peerNames[id] || id.slice(0, 6)
          if (v.label.text !== currentName) v.label.setText(currentName)
          v.label.setPosition(v.sprite.x, v.sprite.y - 40)
          v.label.setVisible(true)
        }
      } else {
        if (v.label) v.label.setVisible(false)
      }
    }
    const me = this.views[this.myPeerId]
    if (me) this.cameras.main.centerOn(me.sprite.x, me.sprite.y)
  }

  /* =========== BAN =========== */
  onAntiCheatBan(id, reason, persistent){
    if (reason === 'timeout' || reason === 'idle') return
    if (this.ac.bans.has(id) && !persistent) return
    this.ac.bans.add(id)
    this.destroyView(id)
    delete this.inputs[id]
    delete this.worldPlayers[id]
    delete this.scores[id]
    delete this.peerNames[id]
    this.peers.delete(id)
    if (this.isHost){
      const p = this.ac.peers.get(id)
      for (const peerId of this.peers){
        this.sendBan({ id, reason, pubHash: persistent ? (p?.pubHash || null) : null }, peerId)
      }
    }
    this.updateStatus()
  }
}
