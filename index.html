<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shoot'n'cats</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
  :root{
    --joy-size: clamp(120px, 32vmin, 280px);
  }

  html,body{margin:0;padding:0;height:100%;background:#05070d;overflow:hidden;
            touch-action:none;-webkit-user-select:none;user-select:none;
            -webkit-tap-highlight-color:transparent;}
  #game{width:100vw;height:100vh;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5;}

  /* ====== JOYSTICKS ====== */
  #joyL,#joyR{position:absolute;bottom:5vh;
              width:var(--joy-size);height:var(--joy-size);
              pointer-events:auto;}
  #joyL{left:4vw;} #joyR{right:4vw;}

  /* ====== STATUS / BONUSES / SCORES / AC ====== */
  #status{position:fixed;top:8px;left:50%;transform:translateX(-50%);
          color:#8b949e;font:clamp(11px,1.8vmin,16px) monospace;z-index:6;
          text-align:center;pointer-events:none;white-space:pre;padding:4px 10px;
          background:rgba(5,7,13,.6);border-radius:6px;}
  #bonuses{position:fixed;top:52px;left:50%;transform:translateX(-50%);
           color:#ffe066;font:clamp(11px,1.8vmin,15px) monospace;z-index:6;
           text-align:center;pointer-events:none;white-space:pre;
           background:rgba(5,7,13,.6);padding:4px 10px;border-radius:6px;
           display:none;}
  #scores{position:fixed;top:52px;left:12px;color:#e6edf3;
          font:clamp(11px,1.8vmin,16px) monospace;
          z-index:6;pointer-events:none;white-space:pre;line-height:1.6;
          background:rgba(5,7,13,.6);padding:8px 12px;border-radius:6px;
          min-width:140px;max-height:130px;overflow:hidden;}
  #scores .me{color:#3fb950;font-weight:bold;}
  #scores .dead{opacity:.5;text-decoration:line-through;}
  #ac{position:fixed;top:96px;right:8px;color:#ff2266;
      font:clamp(9px,1.5vmin,13px) monospace;
      z-index:6;text-align:right;pointer-events:none;white-space:pre;opacity:.85;line-height:1.4;}

  /* ====== TOP BUTTONS ====== */
  #voteBtn{position:fixed;top:8px;right:60px;
           padding:clamp(8px,1.5vmin,14px) clamp(12px,2.2vmin,22px);
           font:clamp(11px,1.8vmin,15px) monospace;
           background:#30363d;color:#e6edf3;border:0;border-radius:6px;
           z-index:7;pointer-events:auto;}
  #voteBtn:active{background:#484f58;}
  #voteBtn.armed{background:#ff2266;color:#fff;font-weight:bold;
                 box-shadow:0 0 12px #ff2266;}
  #soundBtn{position:fixed;top:8px;right:8px;width:44px;height:44px;
            padding:0;font-size:20px;line-height:44px;text-align:center;
            background:#30363d;color:#e6edf3;border:0;border-radius:6px;
            z-index:7;pointer-events:auto;cursor:pointer;}
  #soundBtn:active{background:#484f58;}
  #voteInfo{position:fixed;top:44px;right:8px;color:#ff2266;
            font:clamp(10px,1.6vmin,14px) monospace;
            z-index:7;text-align:right;pointer-events:none;white-space:pre;line-height:1.4;}

  /* ====== ACTION BUTTONS ====== */
  #actionBtns{
    position:fixed;
    right:4vw;
    bottom: calc(5vh + var(--joy-size) + 12px);
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:flex-end;
    z-index:7;
    pointer-events:none;
  }
  #actionBtns > button{ pointer-events:auto; }

  #dashBtn{
    width: clamp(56px, 12vmin, 106px);
    height: clamp(56px, 12vmin, 106px);
    border-radius:50%;
    border:2px solid #ff2266aa;
    background:#ff226622;
    color:#ff2266;
    font:bold clamp(18px, 4vmin, 32px) monospace;
    cursor:pointer;
    text-shadow:0 0 8px #ff2266;
    transition:transform .08s,background .15s,opacity .15s;
    box-shadow:0 0 18px #ff226644, inset 0 0 12px #ff226633;
    display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  #dashBtn:active{background:#ff226666;transform:scale(.92);}
  #dashBtn.cooling{opacity:.35;color:#8b949e;border-color:#30363d;
                   background:#30363d55;text-shadow:none;box-shadow:none;
                   font-size:clamp(12px, 2.6vmin, 20px);}

  #weaponBtn{
    width: clamp(48px, 10vmin, 90px);
    height: clamp(48px, 10vmin, 90px);
    border-radius:50%;
    border:2px solid #ffaa33aa;
    background:#ffaa3322;
    color:#ffaa33;
    font:bold clamp(20px, 4.6vmin, 38px) monospace;
    cursor:pointer;
    transition:transform .08s,background .15s,color .15s,border-color .15s;
    display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  #weaponBtn:active{transform:scale(.92);}
  #weaponBtn.grenade{border-color:#22ccffaa;background:#22ccff22;color:#22ccff;}

  /* ====== KILLFEED ====== */
  #killfeed{position:fixed;top:200px;left:12px;
            z-index:6;pointer-events:none;
            font:clamp(11px,1.7vmin,15px) monospace;
            line-height:1.5;max-width:min(320px,42vw);}
  #killfeed .kf{background:rgba(5,7,13,.75);
                padding:5px 10px;border-radius:6px;margin-bottom:4px;
                border-left:3px solid #ff2266;color:#e6edf3;
                animation:kfIn .28s cubic-bezier(.2,.9,.3,1.2);
                box-shadow:0 0 10px #ff226633;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #killfeed .kf.mine{border-left-color:#3fb950;box-shadow:0 0 14px #3fb95066;}
  #killfeed .kf .who{color:#3fb950;}
  #killfeed .kf .vic{color:#f85149;}
  #killfeed .kf .wp{opacity:.85;margin:0 6px;}
  @keyframes kfIn{
    from{opacity:0;transform:translateX(-24px) scale(.92);}
    to{opacity:1;transform:translateX(0) scale(1);}
  }

  /* ====== VIGNETTE ====== */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
            background:radial-gradient(ellipse at center,
              rgba(0,0,0,0) 42%, rgba(255,34,102,.42) 100%);
            opacity:0;transition:opacity .35s;}

  /* ====== MEDIA: короткие экраны ====== */
  @media (max-height: 620px){
    :root{ --joy-size: clamp(100px, 28vmin, 200px); }

    #dashBtn{
      width: clamp(48px, 10vmin, 68px);
      height: clamp(48px, 10vmin, 68px);
      font-size: clamp(14px, 3vmin, 22px);
    }
    #weaponBtn{
      width: clamp(42px, 8.5vmin, 58px);
      height: clamp(42px, 8.5vmin, 58px);
      font-size: clamp(16px, 3.6vmin, 26px);
    }
    #actionBtns{ gap:8px; }

    #scores{
      max-height:96px;
      font-size:clamp(10px,1.5vmin,13px);
      padding:6px 10px;
    }
    #ac{
      top:auto;
      bottom:8px;
      font-size:clamp(8px,1.3vmin,11px);
    }
    #killfeed{ top:170px; }
  }

  @media (max-height: 450px){
    #ac{ display:none; }
    #killfeed{ top:150px; max-width:38vw; }
  }

  /* ====== MENU ====== */
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;background:#05070d;color:#e6edf3;
        font-family:monospace;gap:16px;z-index:20;padding:24px;text-align:center;}
  #menu h1{margin:0;font-size:clamp(22px,4vmin,32px);letter-spacing:2px;
           color:#fff;text-shadow:0 0 10px #ff2266, 0 0 20px #1133ff;}
  #menu input{padding:12px 16px;font-size:clamp(14px,2.2vmin,18px);border-radius:8px;
              border:1px solid #30363d;background:#161b22;color:#e6edf3;
              width:220px;text-align:center;font-family:monospace;}
  #menu input:focus{outline:none;border-color:#1133ff;box-shadow:0 0 10px #1133ff55;}
  #menu button{padding:12px 22px;font-size:clamp(13px,2.1vmin,17px);border-radius:8px;border:0;
               background:#1133ff;color:#fff;font-family:monospace;font-weight:bold;
               box-shadow:0 0 14px #1133ff;cursor:pointer;}
  #menu button:active{background:#0020cc;}
  #pid{font-size:clamp(10px,1.6vmin,13px);color:#8b949e;line-height:1.7;max-width:340px;word-break:break-all;}
  #hint{font-size:clamp(11px,1.8vmin,14px);color:#8b949e;line-height:1.7;max-width:320px;}
  #lobbyPanel{width:min(620px,92vw);display:flex;flex-direction:column;gap:10px;}
  #lobbyHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  #lobbyHeader strong{font-size:clamp(14px,2.2vmin,19px);}
  #refreshLobbies{padding:9px 14px;font-size:13px;background:#30363d;box-shadow:none;}
  #lobbyList{width:100%;max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:7px;
             padding-right:3px;}
  .lobbyRow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;
            padding:10px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;
            text-align:left;}
  .lobbyMain{min-width:0;}
  .lobbyName{font-weight:bold;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lobbyMeta{font-size:11px;color:#8b949e;margin-top:3px;}
  .lobbyLock{font-size:18px;width:24px;text-align:center;}
  .lobbyJoin{padding:8px 12px!important;font-size:12px!important;box-shadow:none!important;}
  .lobbyJoin:disabled{opacity:.4;cursor:not-allowed;}
  #lobbyEmpty{color:#8b949e;font-size:13px;padding:12px;}
  #lobbyStatus{min-height:18px;color:#8b949e;font-size:12px;}
  #createLobbyBox{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;}
  #createLobbyBox input{width:145px;}
  #createLobbyBox select{padding:12px 10px;border-radius:8px;border:1px solid #30363d;
                         background:#161b22;color:#e6edf3;font-family:monospace;}
  #privateJoinBox{display:none;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;}
  #privateJoinBox input{width:145px;}
  #privateJoinBox button{background:#22aa66;box-shadow:0 0 12px #22aa66;}
  @media (max-height: 700px){
    #lobbyList{max-height:27vh;}
  }
</style>

<style>
/* Компактное главное меню для телефонов */
@media (max-width: 600px), (max-height: 760px){
  #menu{padding:10px 8px!important;gap:7px!important;justify-content:flex-start!important;overflow-y:auto}
  #menu h1{font-size:clamp(22px,7vw,32px)!important;margin:2px 0 4px!important}

  #lobbyPanel{width:min(94vw,520px)!important;gap:5px!important}
  #lobbyHeader{gap:4px!important}

  #refreshLobbies{padding:6px 9px!important;font-size:11px!important}
  #lobbyList{max-height:24vh!important;gap:4px!important}
  .lobbyRow{gap:5px!important;padding:6px 8px!important}
  .lobbyName{font-size:12px!important}
  .lobbyMeta{font-size:9px!important;margin-top:1px!important}
  .lobbyLock{font-size:14px!important;width:18px!important}
  .lobbyJoin{padding:5px 8px!important;font-size:10px!important}
  #createLobbyBox{gap:4px!important}
  #createLobbyBox input{width:105px!important}
  #createLobbyBox select{padding:8px 6px!important;font-size:11px!important;max-width:125px}
  #createLobbyBtn{padding:8px 12px!important;font-size:11px!important}
  #privateJoinBox{gap:4px!important}
  #privateJoinBox input{width:120px!important}
  #privateJoinBox button{padding:8px 12px!important;font-size:11px!important}
  #lobbyStatus{min-height:14px!important;font-size:10px!important}
  #hint{font-size:9px!important;line-height:1.35!important;max-width:94vw!important;margin-top:1px!important}
  #pid{font-size:8px!important;line-height:1.25!important;max-width:94vw!important}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"><div id="joyL"></div><div id="joyR"></div></div>
<div id="status"></div>
<div id="bonuses"></div>
<div id="scores"></div>
<div id="voteInfo"></div>
<div id="ac"></div>
<div id="killfeed"></div>
<div id="vignette"></div>
<button id="voteBtn" style="display:none">VOTE HOST</button>
<button id="soundBtn" style="display:none">🔊</button>
<div id="actionBtns" style="display:none">
  <button id="weaponBtn">🔫</button>
  <button id="dashBtn">⚡</button>
</div>

<div id="menu">
  <h1>Shoot'n'cats</h1>
  <input id="nameInput" placeholder="твоё имя" value="" maxlength="14" />

  <div id="lobbyPanel">
    <div id="lobbyHeader">
      <strong>🎮 Доступные лобби</strong>
      <button id="refreshLobbies">↻ ОБНОВИТЬ</button>
    </div>
    <div id="lobbyList"><div id="lobbyEmpty">Загрузка лобби…</div></div>
    <div id="lobbyStatus"></div>

    <div id="createLobbyBox">
      <input id="newLobbyName" placeholder="название лобби" maxlength="24" />
      <select id="newLobbyType">
        <option value="open">🌐 Открытое</option>
        <option value="private">🔒 Закрытое</option>
      </select>
      <input id="newLobbyPassword" placeholder="пароль (для закрытого)" maxlength="32" style="display:none" />
      <button id="createLobbyBtn">СОЗДАТЬ</button>
    </div>

    <div id="privateJoinBox">
      <input id="privatePassword" type="password" placeholder="пароль лобби" maxlength="32" />
      <button id="privateJoinBtn">ВОЙТИ</button>
    </div>
  </div>

  <div id="hint">
    Левый стик — движение · Правый стик — прицел и огонь<br>
    💣 Гранаты: удерживай и отпусти (сила = дальность)<br>
    ⚡ Рывок · бонусы: ❤️ HP · ⚡ скорострел · 🎯 самонаведение · 🏓 рикошет · 🛡 щит · 💦 распылитель
  </div>
  <div id="pid">…generating identity…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>

<script type="module">
/* ============================================================
   1. КОНФИГ
   ============================================================ */
const CFG = {
  W: 1800, H: 1200, CELL: 40,
  PLAYER_R: 18, SPEED: 240,
  BULLET_SPEED: 780, BULLET_R: 5, BULLET_LIFE: 1.4,
  FIRE_CD: 150, MAX_HP: 100, DAMAGE: 25, RESPAWN: 2500,
  STATE_MS: 100, INPUT_MS: 66,

  PLAYER_W: 56, PLAYER_H: 48,
  BULLET_SIZE: 14,

  WALL_COLOR:  0xff2266,
  FLOOR_COLOR: 0x1133ff,
  FLOOR_TINT_ALPHA: 1.0,

  WALL_GLOW:  true,
  FLOOR_GLOW: true,

  PICKUP_INTERVAL:   3500,
  PICKUP_MAX:        6,
  PICKUP_RADIUS:     24,
  BONUS_DURATION:    20000,
  BONUS_HP_AMOUNT:   40,
  BONUS_FIRE_MUL:    0.5,
  BONUS_HOMING_TURN: 0.12,
  BONUS_HOMING_NOISE: 0.4,
  BONUS_RICOCHET_MAX: 2,
  BONUS_HOMING_FIRE_CD: 2000,

  BONUS_SPRAYER_FIRE_CD:  700,
  BONUS_SPRAYER_PELLETS:  7,
  BONUS_SPRAYER_SPREAD_DEG: 30,
  BONUS_SPRAYER_DAMAGE_MUL: 0.5,

  DASH_SPEED: 720,
  DASH_DURATION: 160,
  DASH_CD: 1400,

  GRENADE_SPEED: 750,
  GRENADE_R: 10,
  GRENADE_FUSE: 1500,
  GRENADE_CD: 1800,
  GRENADE_RADIUS: 140,
  GRENADE_DAMAGE: 60,
  GRENADE_SELF_DAMAGE_MUL: 0.5,
  GRENADE_DRAG_K: 1.2,
  GRENADE_MIN_FORCE: 0.3,

  SFX_MAX_DIST:      1400,
  SFX_MASTER:        0.55,
  AMBIENT_ENABLED:   true,
  BGM_VOLUME:        0.35,
}

const AC_CFG = {
  MAX_INPUT_HZ: 45, MAX_PACKET_BYTES: 512, MAX_SEQ_GAP: 300, PEER_TIMEOUT_MS: 20000,
  SPEED_TOLERANCE: 1.35, TELEPORT_HARD: 200,
  FIRE_TOLERANCE: 0.85, AIM_MIN_MAG: 0.05,
  AIM_SNAP_DEG: 100, AIM_SNAP_WINDOW_MS: 40, AIM_HISTORY_MS: 2500,
  ACCURACY_SUSPICIOUS: 0.94, ACCURACY_MIN_SHOTS: 25,
  FOG_ENABLED: true, FOG_RADIUS: 2000,
  STRIKE_DECAY_MS: 30000, STRIKE_KICK: 6, STRIKE_SEVERE: 2,
  SUSPICION_KICK: 25, SUSPICION_DECAY: 0.35,
  HISTORY_MS: 1000, MAX_REWIND_MS: 300,
  SIG_GRACE_MS: 3000,
}

const APP_ID = 'p2p-shooter-identity-v1'
const VOTE_DURATION_MS = 20000
const RELAY_URL = 'wss://shoooterr.relaxdev.ru'

/* ============================================================
   2. DEBUG
   ============================================================ */
const DBG = {
  enabled: true,
  t0: performance.now(),
  log(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.log(`%c[T:${tag} +${dt}s]`, 'color:#3fb950;font-weight:bold', ...args)
  },
  warn(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.warn(`[T:${tag} +${dt}s]`, ...args)
  },
  err(tag, ...args){
    if (!this.enabled) return
    const dt = ((performance.now() - this.t0) / 1000).toFixed(2)
    console.error(`[T:${tag} +${dt}s]`, ...args)
  },
}

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function colorFromId(id){const h=hashStr(id||'x')%360;return Phaser.Display.Color.HSVToRGB(h/360,0.7,1).color}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fnv1a(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function randomToken(len=24){const b=new Uint8Array(len);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
function cleanName(s){ return String(s||'').replace(/[<>&"']/g,'').trim().slice(0,14) }
function escapeHtml(s){
  return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))
}

function resolveCircleRect(px,py,r,rect){
  const cx=clamp(px,rect.x,rect.x+rect.w), cy=clamp(py,rect.y,rect.y+rect.h)
  const dx=px-cx, dy=py-cy
  const d2=dx*dx+dy*dy
  if(d2>=r*r) return null
  if(d2<0.0001){
    const left=px-rect.x,right=rect.x+rect.w-px,top=py-rect.y,bottom=rect.y+rect.h-py
    const m=Math.min(left,right,top,bottom)
    if(m===left)  return {x:rect.x-r, y:py}
    if(m===right) return {x:rect.x+rect.w+r, y:py}
    if(m===top)   return {x:px, y:rect.y-r}
    return {x:px, y:rect.y+rect.h+r}
  }
  const d=Math.sqrt(d2); const k=(r-d)/d
  return {x:px+dx*k, y:py+dy*k}
}

function segIntersectsRect(x1,y1,x2,y2,r){
  const dx=x2-x1, dy=y2-y1
  let t0=0,t1=1
  const p=[-dx,dx,-dy,dy]
  const q=[x1-r.x, r.x+r.w-x1, y1-r.y, r.y+r.h-y1]
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; continue }
    const t=q[i]/p[i]
    if(p[i]<0){ if(t>t1) return false; if(t>t0) t0=t }
    else      { if(t<t0) return false; if(t<t1) t1=t }
  }
  return true
}
function lineOfSight(x1,y1,x2,y2,walls){
  for(const w of walls){ if(segIntersectsRect(x1,y1,x2,y2,w)) return false }
  return true
}

/* ============================================================
   4. SOUND ENGINE
   ============================================================ */
class SoundEngine {
  constructor(){
    this.ctx = null; this.master = null; this.reverb = null
    this.noiseBuf = null; this.ready = false
    this.enabled = localStorage.getItem('sfx_enabled') !== '0'
    this._ambient = null
  }
  init(){
    if (this.ctx) return
    const Ctx = window.AudioContext || window.webkitAudioContext
    if (!Ctx) return
    try { this.ctx = new Ctx() } catch(e){ return }

    this.master = this.ctx.createGain()
    this.master.gain.value = this.enabled ? CFG.SFX_MASTER : 0

    const comp = this.ctx.createDynamicsCompressor()
    comp.threshold.value = -16; comp.knee.value = 22
    comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25

    this.master.connect(comp); comp.connect(this.ctx.destination)

    this.reverb = this.ctx.createConvolver()
    this.reverb.buffer = this._makeIR(1.6, 2.4)
    const reverbGain = this.ctx.createGain()
    reverbGain.gain.value = 0.8
    this.reverb.connect(reverbGain)
    reverbGain.connect(this.master)

    this.noiseBuf = this._makeNoise(0.6)

    this.ready = true
    if (this.ctx.state === 'suspended') this.ctx.resume()
  }
  _makeNoise(dur){
    const sr = this.ctx.sampleRate
    const len = Math.floor(sr * dur)
    const buf = this.ctx.createBuffer(1, len, sr)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1
    return buf
  }
  _makeIR(dur, decay){
    const sr = this.ctx.sampleRate
    const len = Math.floor(sr * dur)
    const buf = this.ctx.createBuffer(2, len, sr)
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c)
      for (let i = 0; i < len; i++){
        const t = i / len
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay)
      }
    }
    return buf
  }
  _throttle(key, ms){
    if (!this._thr) this._thr = {}
    const now = performance.now()
    if (this._thr[key] && now - this._thr[key] < ms) return false
    this._thr[key] = now
    return true
  }
  setEnabled(v){
    this.enabled = !!v
    localStorage.setItem('sfx_enabled', this.enabled ? '1' : '0')
    if (this.master && this.ctx){
      const t = this.ctx.currentTime
      this.master.gain.cancelScheduledValues(t)
      this.master.gain.linearRampToValueAtTime(this.enabled ? CFG.SFX_MASTER : 0, t + 0.15)
    }
  }
  _tone({freq=440, freqEnd=null, type='sine', dur=0.2, vol=0.3, attack=0.005, pan=0, send=0}){
    if (!this.ready || !this.enabled || vol <= 0.0001) return
    const t0 = this.ctx.currentTime
    const osc = this.ctx.createOscillator()
    osc.type = type
    osc.frequency.setValueAtTime(freq, t0)
    if (freqEnd != null && freqEnd > 0){
      try { osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur) } catch(e){}
    }
    const g = this.ctx.createGain()
    g.gain.setValueAtTime(0.0001, t0)
    g.gain.linearRampToValueAtTime(Math.max(0.0002, vol), t0 + attack)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(attack + 0.02, dur))
    let panner = null
    if (this.ctx.createStereoPanner){
      panner = this.ctx.createStereoPanner()
      panner.pan.value = clamp(pan, -1, 1)
    }
    osc.connect(g)
    if (panner){ g.connect(panner); panner.connect(this.master) }
    else g.connect(this.master)
    if (send > 0){
      const s = this.ctx.createGain()
      s.gain.value = send
      g.connect(s); s.connect(this.reverb)
    }
    osc.start(t0); osc.stop(t0 + dur + 0.08)
  }
  _noise({dur=0.1, vol=0.3, type='lowpass', freq=2000, freqEnd=null, pan=0, send=0}){
    if (!this.ready || !this.enabled || vol <= 0.0001) return
    const t0 = this.ctx.currentTime
    const src = this.ctx.createBufferSource()
    src.buffer = this.noiseBuf
    const filter = this.ctx.createBiquadFilter()
    filter.type = type
    filter.frequency.setValueAtTime(freq, t0)
    if (freqEnd != null && freqEnd > 0){
      try { filter.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur) } catch(e){}
    }
    const g = this.ctx.createGain()
    g.gain.setValueAtTime(0.0001, t0)
    g.gain.linearRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.003)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
    let panner = null
    if (this.ctx.createStereoPanner){
      panner = this.ctx.createStereoPanner()
      panner.pan.value = clamp(pan, -1, 1)
    }
    src.connect(filter); filter.connect(g)
    if (panner){ g.connect(panner); panner.connect(this.master) }
    else g.connect(this.master)
    if (send > 0){
      const s = this.ctx.createGain()
      s.gain.value = send
      g.connect(s); s.connect(this.reverb)
    }
    src.start(t0); src.stop(t0 + dur + 0.08)
  }
  shoot(kind = 'normal', pan = 0, volMul = 1){
    if (!this._throttle('shoot', 15)) return
    const V = 0.22 * volMul
    if (kind === 'sprayer'){
      this._noise({dur:0.16, vol:V*1.3, type:'lowpass', freq:2200, freqEnd:250, pan, send:0.35})
      this._tone({freq: 150, freqEnd: 45, type:'sawtooth', dur:0.2, vol:V*1.0, pan, send:0.3})
      this._tone({freq: 700, freqEnd: 250, type:'square', dur:0.1, vol:V*0.4, pan, send:0.2})
      return
    }
    if (kind === 'homing' || kind === 'homingRicochet'){
      this._tone({freq: 900, freqEnd: 1800, type:'triangle', dur:0.13, vol:V*0.8, pan, send:0.15})
      this._tone({freq: 1400, freqEnd: 2200, type:'sine', dur:0.11, vol:V*0.5, pan, send:0.15})
    } else if (kind === 'ricochet'){
      this._noise({dur:0.08, vol:V*0.9, type:'highpass', freq:1400, pan, send:0.12})
      this._tone({freq: 1200, freqEnd: 800, type:'square', dur:0.08, vol:V*0.35, pan, send:0.1})
    } else {
      this._noise({dur:0.09, vol:V, type:'lowpass', freq:3200, freqEnd:700, pan, send:0.12})
      this._tone({freq: 200, freqEnd: 60, type:'sawtooth', dur:0.12, vol:V*0.5, pan, send:0.08})
    }
  }
  grenadeThrow(pan = 0, volMul = 1){
    if (!this._throttle('gthrow', 40)) return
    const V = 0.22 * volMul
    this._tone({freq: 380, freqEnd: 850, type:'sine', dur:0.16, vol:V, pan, send:0.2})
    this._noise({dur:0.1, vol:V*0.55, type:'highpass', freq:2000, pan, send:0.15})
  }
  explosion(pan = 0, volMul = 1){
    if (!this._throttle('expl', 40)) return
    const V = 0.42 * volMul
    this._noise({dur:0.55, vol:V, type:'lowpass', freq:1800, freqEnd:60, pan, send:0.6})
    this._tone({freq: 130, freqEnd: 32, type:'sawtooth', dur:0.5, vol:V*0.85, pan, send:0.5})
    this._tone({freq: 62, freqEnd: 25, type:'sine', dur:0.7, vol:V*0.7, pan, send:0.5})
    this._noise({dur:0.32, vol:V*0.5, type:'bandpass', freq:400, pan, send:0.4})
  }
  weaponSwap(pan = 0, volMul = 1){
    if (!this._throttle('wswap', 60)) return
    const V = 0.2 * volMul
    this._tone({freq: 700, freqEnd: 1200, type:'square', dur:0.07, vol:V, pan, send:0.15})
    this._tone({freq: 1100, freqEnd: 500, type:'triangle', dur:0.1, vol:V*0.75, pan, send:0.15})
  }
  dash(pan = 0, volMul = 1){
    if (!this._throttle('dash', 60)) return
    const V = 0.28 * volMul
    this._noise({dur:0.18, vol:V, type:'highpass', freq:600, freqEnd:2600, pan, send:0.25})
    this._tone({freq: 240, freqEnd: 900, type:'sawtooth', dur:0.16, vol:V*0.7, pan, send:0.2})
    this._tone({freq: 900, freqEnd: 1700, type:'triangle', dur:0.14, vol:V*0.45, pan, send:0.25})
  }
  hitPlayer(pan = 0, volMul = 1){
    if (!this._throttle('hitp', 30)) return
    const V = 0.28 * volMul
    this._tone({freq: 260, freqEnd: 130, type:'square', dur:0.08, vol:V, pan, send:0.15})
    this._noise({dur:0.06, vol:V*0.7, type:'lowpass', freq:900, pan})
  }
  hitShield(pan = 0, volMul = 1){
    const V = 0.26 * volMul
    this._tone({freq: 1600, freqEnd: 2400, type:'sine', dur:0.26, vol:V, pan, send:0.4})
    this._tone({freq: 2400, freqEnd: 3200, type:'triangle', dur:0.2, vol:V*0.6, pan, send:0.4})
  }
  death(pan = 0, volMul = 1){
    const V = 0.32 * volMul
    this._tone({freq: 420, freqEnd: 60, type:'sawtooth', dur:0.7, vol:V, pan, send:0.5})
    this._noise({dur:0.5, vol:V*0.6, type:'lowpass', freq:1400, freqEnd:80, pan, send:0.5})
  }
  kill(pan = 0, volMul = 1){
    const V = 0.3 * volMul
    this._tone({freq: 820, freqEnd: 160, type:'square', dur:0.22, vol:V, pan, send:0.2})
    this._noise({dur:0.14, vol:V*0.6, type:'bandpass', freq:1800, pan, send:0.2})
  }
  respawn(pan = 0, volMul = 1){
    const V = 0.2 * volMul
    this._tone({freq: 300, freqEnd: 600, type:'sine', dur:0.3, vol:V, pan, send:0.3})
    this._tone({freq: 450, freqEnd: 900, type:'sine', dur:0.3, vol:V*0.7, pan, send:0.3})
    this._tone({freq: 600, freqEnd: 1200, type:'triangle', dur:0.35, vol:V*0.5, pan, send:0.3})
  }
  pickup(type = 'hp', pan = 0, volMul = 1){
    const V = 0.26 * volMul
    if (type === 'hp'){
      this._tone({freq: 500, freqEnd: 820, type:'sine', dur:0.2, vol:V, pan, send:0.25})
      this._tone({freq: 750, freqEnd: 1230, type:'sine', dur:0.2, vol:V*0.6, pan, send:0.25})
    } else if (type === 'rapid'){
      this._tone({freq: 400, freqEnd: 1600, type:'square', dur:0.2, vol:V*0.8, pan, send:0.15})
      this._tone({freq: 800, freqEnd: 2000, type:'sine', dur:0.15, vol:V*0.5, pan, send:0.15})
    } else if (type === 'homing'){
      this._tone({freq: 800, freqEnd: 1400, type:'triangle', dur:0.25, vol:V, pan, send:0.3})
      this._tone({freq: 1200, freqEnd: 1800, type:'sine', dur:0.25, vol:V*0.6, pan, send:0.3})
    } else if (type === 'ricochet'){
      this._tone({freq: 1200, freqEnd: 500, type:'triangle', dur:0.22, vol:V, pan, send:0.2})
      this._tone({freq: 1600, freqEnd: 700, type:'sine', dur:0.22, vol:V*0.6, pan, send:0.2})
    } else if (type === 'shield'){
      this._tone({freq: 1000, freqEnd: 1800, type:'sine', dur:0.35, vol:V, pan, send:0.5})
      this._tone({freq: 1500, freqEnd: 2400, type:'triangle', dur:0.3, vol:V*0.7, pan, send:0.5})
    } else if (type === 'sprayer'){
      this._tone({freq: 250, freqEnd: 900, type:'sawtooth', dur:0.3, vol:V*1.0, pan, send:0.3})
      this._noise({dur:0.2, vol:V*0.6, type:'bandpass', freq:900, pan, send:0.3})
      this._tone({freq: 500, freqEnd: 1200, type:'triangle', dur:0.25, vol:V*0.5, pan, send:0.3})
    } else {
      this._tone({freq: 700, freqEnd: 1100, type:'sine', dur:0.2, vol:V, pan, send:0.2})
    }
  }
  pickupSpawn(pan = 0, volMul = 1){
    const V = 0.07 * volMul
    this._tone({freq: 1200, freqEnd: 900, type:'sine', dur:0.14, vol:V, pan, send:0.25})
  }
  ricochetTick(pan = 0, volMul = 1){
    if (!this._throttle('ric', 40)) return
    const V = 0.11 * volMul
    this._tone({freq: 2000, freqEnd: 1400, type:'sine', dur:0.06, vol:V, pan, send:0.15})
  }
  join(pan = 0, volMul = 1){
    const V = 0.16 * volMul
    this._tone({freq: 500, freqEnd: 900, type:'sine', dur:0.2, vol:V, pan, send:0.2})
    this._tone({freq: 750, freqEnd: 1200, type:'sine', dur:0.2, vol:V*0.6, pan, send:0.2})
  }
  leave(pan = 0, volMul = 1){
    const V = 0.15 * volMul
    this._tone({freq: 900, freqEnd: 400, type:'sine', dur:0.25, vol:V, pan, send:0.2})
  }
  startAmbient(){
    if (!this.ready || this._ambient || !CFG.AMBIENT_ENABLED) return
    const ctx = this.ctx
    const now = ctx.currentTime
    const g = ctx.createGain()
    g.gain.value = 0.0001
    g.gain.linearRampToValueAtTime(0.045, now + 3)
    const filter = ctx.createBiquadFilter()
    filter.type = 'lowpass'; filter.frequency.value = 260; filter.Q.value = 0.8
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.5
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 110
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.018
    lfo.connect(lfoGain); lfoGain.connect(g.gain)
    o1.connect(filter); o2.connect(filter); o3.connect(filter)
    filter.connect(g); g.connect(this.master)
    o1.start(); o2.start(); o3.start(); lfo.start()
    this._ambient = { g, o1, o2, o3, lfo, filter }
  }
}

/* ============================================================
   5. IDENTITY
   ============================================================ */
class Identity {
  constructor(){
    this.ready=false; this.mode='none'; this.pubHash=null
    this.keyPair=null; this.pubJwk=null
  }
  _timeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error('timeout:' + (label || 'op'))), ms)
      )
    ])
  }
  _fallback(reason){
    let stored = localStorage.getItem('p2p_fallback_id')
    if (!stored){
      stored = randomToken(12)
      localStorage.setItem('p2p_fallback_id', stored)
    }
    this.pubHash = 'fb_' + stored
    this.mode = 'fallback'
    this.ready = true
    DBG.warn('ID', 'fallback mode:', reason)
  }
  async init(){
    if (!(window.isSecureContext && window.crypto && crypto.subtle)) {
      this._fallback('no secure context / no crypto.subtle')
      return
    }
    const storeKey = 'p2p_ecdsa_key'
    let stored = null
    try { stored = JSON.parse(localStorage.getItem(storeKey)) } catch {}
    if (stored && (!stored.priv || !stored.pub)){
      try { localStorage.removeItem(storeKey) } catch {}
      stored = null
    }
    try {
      if (stored){
        this.keyPair = {
          privateKey: await this._timeout(
            crypto.subtle.importKey('jwk', stored.priv,
              {name:'ECDSA', namedCurve:'P-256'}, true, ['sign']),
            2000, 'importPriv'
          ),
          publicKey: await this._timeout(
            crypto.subtle.importKey('jwk', stored.pub,
              {name:'ECDSA', namedCurve:'P-256'}, true, ['verify']),
            2000, 'importPub'
          ),
        }
        this.pubJwk = stored.pub
      } else {
        this.keyPair = await this._timeout(
          crypto.subtle.generateKey(
            {name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']),
          3000, 'generateKey'
        )
        this.pubJwk = await this._timeout(
          crypto.subtle.exportKey('jwk', this.keyPair.publicKey),
          2000, 'exportPub'
        )
        const privJwk = await this._timeout(
          crypto.subtle.exportKey('jwk', this.keyPair.privateKey),
          2000, 'exportPriv'
        )
        try {
          localStorage.setItem(storeKey, JSON.stringify({priv: privJwk, pub: this.pubJwk}))
        } catch(e){}
      }
      const hex = await this._timeout(this._sha256hex(JSON.stringify(this.pubJwk)), 2000, 'sha256')
      this.pubHash = hex.slice(0,16)
      this.mode = 'crypto'
      this.ready = true
    } catch (e) {
      try { localStorage.removeItem(storeKey) } catch {}
      this._fallback(e.message || String(e))
    }
  }
  async _sha256hex(str){
    const buf = new TextEncoder().encode(str)
    const h = await crypto.subtle.digest('SHA-256', buf)
    return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2,'0')).join('')
  }
  async sign(str){
    if (this.mode !== 'crypto' || !crypto?.subtle) return 'no-crypto'
    try {
      const buf = new TextEncoder().encode(str)
      const sig = await this._timeout(
        crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, this.keyPair.privateKey, buf),
        2000, 'sign'
      )
      return btoa(String.fromCharCode(...new Uint8Array(sig)))
    } catch(e){ return 'no-crypto' }
  }
  async verify(pubJwk, str, sigB64){
    if (this.mode !== 'crypto' || !crypto?.subtle) return false
    if (!pubJwk || !sigB64) return false
    try {
      const pub = await this._timeout(
        crypto.subtle.importKey('jwk', pubJwk,
          {name:'ECDSA', namedCurve:'P-256'}, true, ['verify']),
        2000, 'importVerify'
      )
      const buf = new TextEncoder().encode(str)
      const sig = Uint8Array.from(atob(sigB64), c => c.charCodeAt(0))
      return await this._timeout(
        crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, sig, buf),
        2000, 'verify'
      )
    } catch { return false }
  }
}

   ============================================================ */
const AC_LOG = []
function acLog(msg){
  AC_LOG.unshift(msg)
  if (AC_LOG.length > 6) AC_LOG.pop()
  const el = document.getElementById('ac')
  if (el) el.textContent = AC_LOG.join('\n')
  console.log('[AC]', msg)
}

class AntiCheat {
  constructor(scene){
    this.scene = scene
    this.peers = new Map()
    this.bans = new Set()
    this.persistentBans = new Set()
    this.myToken = null
    this.seq = 0
    this.histories = new Map()
    this.identity = null
    this.loadPersistentBans()
  }
  loadPersistentBans(){
    try {
      const raw = localStorage.getItem('p2p_bans_' + APP_ID)
      if (raw) {
        const arr = JSON.parse(raw)
        if (Array.isArray(arr)) for (const h of arr) this.persistentBans.add(h)
      }
    } catch {}
  }
  savePersistentBans(){
    try { localStorage.setItem('p2p_bans_' + APP_ID, JSON.stringify([...this.persistentBans])) } catch {}
  }
  isPersistentlyBanned(pubHash){ return !!(pubHash && this.persistentBans.has(pubHash)) }
  addPersistentBan(pubHash){ if (!pubHash) return; this.persistentBans.add(pubHash); this.savePersistentBans() }
  ensure(id){
    let p = this.peers.get(id)
    if (!p) {
      p = { strikes:0, lastStrike:0, suspicion:0, lastUpdate:performance.now(),
            inputTimes:[], lastSeq:-1, token:null, sigRequiredAt:0,
            lastFire:0, shotsFired:0, shotsHit:0,
            aimHistory:[], lastPos:null, lastPosT:0, rtt:0,
            pubHash:null, pubJwk:null, verified:false, nonce:null }
      this.peers.set(id, p)
    }
    return p
  }
  remove(id){ this.peers.delete(id); this.histories.delete(id) }
  strike(id, reason, w=1){
    const p = this.ensure(id)
    p.strikes += w; p.lastStrike = performance.now()
    acLog(`⚡ ${id.slice(0,6)} ${reason} (${p.strikes}/${AC_CFG.STRIKE_KICK})`)
    if (p.strikes >= AC_CFG.STRIKE_KICK) { this.ban(id, reason); return false }
    return true
  }
  ban(id, reason, persistent=false){
    if (this.bans.has(id)) return
    this.bans.add(id)
    const p = this.peers.get(id)
    if (persistent && p && p.pubHash) this.addPersistentBan(p.pubHash)
    acLog(`⛔ BAN ${id.slice(0,6)}: ${reason}`)
    this.scene.onAntiCheatBan?.(id, reason, persistent)
  }
  decay(id, dtSec){
    const p = this.peers.get(id); if (!p) return
    const now = performance.now()
    if (p.strikes > 0 && now - p.lastStrike > AC_CFG.STRIKE_DECAY_MS){ p.strikes--; p.lastStrike = now }
    if (p.suspicion > 0) p.suspicion = Math.max(0, p.suspicion - AC_CFG.SUSPICION_DECAY * dtSec)
  }
  issueToken(id){
    const p = this.ensure(id)
    p.token = randomToken(16)
    p.sigRequiredAt = performance.now() + AC_CFG.SIG_GRACE_MS
    return p.token
  }
  setMyToken(tok){ this.myToken = tok }
  sign(fields){
    const s = `${this.myToken}|${this.seq}|${fields.m[0]}|${fields.m[1]}|${fields.a[0]}|${fields.a[1]}|${fields.f}`
    return fnv1a(s)
  }
  verify(id, payload){
    const p = this.peers.get(id); if (!p || !p.token) return false
    const s = `${p.token}|${payload.seq}|${payload.m[0]}|${payload.m[1]}|${payload.a[0]}|${payload.a[1]}|${payload.f}`
    return fnv1a(s) === payload.sig
  }
  validateInput(id, data){
    if (this.bans.has(id)) return false
    const p = this.ensure(id)
    const now = performance.now()
    p.lastUpdate = now
    let size = 0
    try { size = JSON.stringify(data).length } catch { return this.strike(id,'unserializable',AC_CFG.STRIKE_SEVERE) }
    if (size > AC_CFG.MAX_PACKET_BYTES) return this.strike(id, `oversized`, AC_CFG.STRIKE_SEVERE)
    if (!data || typeof data !== 'object') return this.strike(id, 'not object', AC_CFG.STRIKE_SEVERE)
    if (!this.pair(data.m) || !this.pair(data.a)) return this.strike(id, 'bad vectors', AC_CFG.STRIKE_SEVERE)
    if (typeof data.f !== 'number' || (data.f !== 0 && data.f !== 1)) return this.strike(id, 'bad fire', AC_CFG.STRIKE_SEVERE)
    if (typeof data.seq !== 'number' || !Number.isFinite(data.seq)) return this.strike(id, 'no seq', AC_CFG.STRIKE_SEVERE)
    if (data.w !== undefined && data.w !== 0 && data.w !== 1) return this.strike(id, 'bad weapon', AC_CFG.STRIKE_SEVERE)
    if (data.af !== undefined){
      if (typeof data.af !== 'number' || !Number.isFinite(data.af))
        return this.strike(id, 'bad aimforce', AC_CFG.STRIKE_SEVERE)
      if (data.af < 0 || data.af > 1.5)
        return this.strike(id, 'aimforce range', AC_CFG.STRIKE_SEVERE)
    }
    if (data.tseq !== undefined){
      if (typeof data.tseq !== 'number' || !Number.isFinite(data.tseq) || data.tseq < 0 || data.tseq > 1e9)
        return this.strike(id, 'bad tseq', AC_CFG.STRIKE_SEVERE)
    }
    p.inputTimes.push(now)
    while (p.inputTimes.length && now - p.inputTimes[0] > 1000) p.inputTimes.shift()
    if (p.inputTimes.length > AC_CFG.MAX_INPUT_HZ) return this.strike(id, `flood`, AC_CFG.STRIKE_SEVERE)
    if (data.seq <= p.lastSeq) return this.strike(id, `replay`, AC_CFG.STRIKE_SEVERE)
    if (p.lastSeq >= 0 && data.seq > p.lastSeq + AC_CFG.MAX_SEQ_GAP) return this.strike(id, `seq jump`, 1)
    p.lastSeq = data.seq
    if (p.token && now > p.sigRequiredAt && !this.verify(id, data)) return this.strike(id, 'bad signature', AC_CFG.STRIKE_SEVERE)
    const clip = v => {
      const L = Math.hypot(v[0], v[1])
      if (L > 1.05){ v[0] /= L; v[1] /= L }
      if (L < AC_CFG.AIM_MIN_MAG && v === data.a){ v[0] = 1; v[1] = 0 }
      if (L < 0.001){ v[0] = 0; v[1] = 0 }
    }
    clip(data.m); clip(data.a)
    return true
  }
  pair(v){
    return Array.isArray(v) && v.length === 2 &&
      Number.isFinite(v[0]) && Number.isFinite(v[1]) &&
      Math.abs(v[0]) <= 10 && Math.abs(v[1]) <= 10
  }
  validateMovement(id, prev, next, dt, speedLimit){
    if (!prev) return { x: next.x, y: next.y }
    const dx = next.x - prev.x, dy = next.y - prev.y
    const dist = Math.hypot(dx, dy)
    if (dist > AC_CFG.TELEPORT_HARD) {
      this.strike(id, `teleport`, AC_CFG.STRIKE_SEVERE)
      return { x: prev.x, y: prev.y }
    }
    const maxD = (speedLimit || CFG.SPEED) * dt * AC_CFG.SPEED_TOLERANCE + 12
    if (dist > maxD) {
      this.strike(id, `speed`, 1)
      const k = maxD / dist
      return { x: prev.x + dx*k, y: prev.y + dy*k }
    }
    return { x: next.x, y: next.y }
  }
  validateFire(id, now, fireCd){
    const p = this.ensure(id)
    const min = fireCd * AC_CFG.FIRE_TOLERANCE
    if (now - p.lastFire < min) return this.strike(id, `rapid fire`, 1)
    p.lastFire = now
    return true
  }
  recordAim(id, ax, ay, now){
    const p = this.ensure(id)
    const last = p.aimHistory[p.aimHistory.length-1]
    if (last){
      const dt = now - last.t
      if (dt < AC_CFG.AIM_SNAP_WINDOW_MS){
        const dot = last.ax*ax + last.ay*ay
        const ang = Math.acos(Math.max(-1, Math.min(1, dot))) * 180/Math.PI
        if (ang > AC_CFG.AIM_SNAP_DEG) p.suspicion += 1.5
      }
    }
    p.aimHistory.push({ ax, ay, t: now })
    while (p.aimHistory.length && now - p.aimHistory[0].t > AC_CFG.AIM_HISTORY_MS) p.aimHistory.shift()
  }
  recordShot(id, hit){
    const p = this.ensure(id)
    p.shotsFired++
    if (hit) p.shotsHit++
    if (p.shotsFired >= AC_CFG.ACCURACY_MIN_SHOTS){
      const acc = p.shotsHit / p.shotsFired
      if (acc > AC_CFG.ACCURACY_SUSPICIOUS) p.suspicion += 0.6
    }
  }
  computeVisible(forId, all, walls, localPos){
    if (!AC_CFG.FOG_ENABLED) return Object.keys(all)
    const R2 = AC_CFG.FOG_RADIUS * AC_CFG.FOG_RADIUS
    const out = []
    for (const id in all){
      if (id === forId){ out.push(id); continue }
      const p = all[id]
      const dx = p.x - localPos.x, dy = p.y - localPos.y
      if (dx*dx + dy*dy > R2) continue
      if (lineOfSight(localPos.x, localPos.y, p.x, p.y, walls)) out.push(id)
    }
    return out
  }
  recordPosition(id, x, y){
    let h = this.histories.get(id)
    if (!h){ h = []; this.histories.set(id, h) }
    const now = performance.now()
    h.push({ x, y, t: now })
    const cut = now - AC_CFG.HISTORY_MS
    while (h.length && h[0].t < cut) h.shift()
  }
  rewindPosition(id, backMs){
    const h = this.histories.get(id)
    if (!h || h.length === 0) return null
    const target = performance.now() - Math.min(backMs, AC_CFG.MAX_REWIND_MS)
    let lo = 0, hi = h.length - 1
    while (lo < hi){ const mid = (lo + hi) >> 1; if (h[mid].t < target) lo = mid+1; else hi = mid }
    return h[lo]
  }
  tick(dtSec){
    const now = performance.now()
    for (const [id, p] of this.peers){
      this.decay(id, dtSec)
      const idle = now - p.lastUpdate
      if (idle > AC_CFG.PEER_TIMEOUT_MS){
        if (!p._idleLogged){ p._idleLogged = true; acLog(`⏸ ${id.slice(0,6)} idle`) }
      } else if (p._idleLogged){ p._idleLogged = false; acLog(`▶ ${id.slice(0,6)} resumed`) }
    }
  }
}

/* ============================================================
   7. MAP
   ============================================================ */
const SPAWNS = [
  {x:120,y:120},{x:CFG.W-120,y:120},
  {x:120,y:CFG.H-120},{x:CFG.W-120,y:CFG.H-120},
  {x:CFG.W/2,y:120},{x:CFG.W/2,y:CFG.H-120},
]
function generateWalls(seedStr){
  const rng = mulberry32(hashStr(seedStr))
  const cs = CFG.CELL
  const cols = Math.floor(CFG.W/cs), rows = Math.floor(CFG.H/cs)
  const used = new Set(), out = []
  const push = (c,r) => { const k=c+','+r; if (used.has(k)) return; used.add(k); out.push({x:c*cs,y:r*cs,w:cs,h:cs}) }
  for (let c=0;c<cols;c++){ push(c,0); push(c,rows-1) }
  for (let r=0;r<rows;r++){ push(0,r); push(cols-1,r) }
  const nearSpawn = (x,y) => { for (const s of SPAWNS){ if (Math.abs(s.x-x)<140 && Math.abs(s.y-y)<140) return true } return false }
  for (let i=0;i<60;i++){
    const c = 2 + Math.floor(rng()*(cols-4))
    const r = 2 + Math.floor(rng()*(rows-4))
    const len = 1 + Math.floor(rng()*3)
    const horiz = rng() < 0.5
    for (let j=0;j<len;j++){
      const cc = horiz ? c+j : c, rr = horiz ? r : r+j
      if (cc >= cols-1 || rr >= rows-1) break
      if (nearSpawn(cc*cs+cs/2, rr*cs+cs/2)) continue
      push(cc, rr)
    }
  }
  return out
}

class BootScene extends Phaser.Scene {
  constructor(){ super('Boot') }
  preload(){
    this.load.image('player', 'player.png')
    this.load.image('bullet', 'bullet.png')
    this.load.image('wall',   'wall.png')
    this.load.image('floor',  'floor.png')
    this.load.audio('bgm', ['music.mp3', 'music.ogg'])

    this.load.on('loaderror', file => {
      DBG.warn('BOOT', 'not found:', file.key)
      if (file.key !== 'bgm') this.generateStub(file.key)
    })
  }
  generateStub(key){
    if (this.textures.exists(key)) return
    const g = this.make.graphics({x:0,y:0,add:false})
    if (key === 'player'){ g.fillStyle(0xffffff,1); g.fillCircle(24,24,18); g.fillRect(38,18,18,12); g.generateTexture('player',56,48) }
    else if (key === 'bullet'){ g.fillStyle(0xffe066,1); g.fillCircle(6,6,5); g.generateTexture('bullet',12,12) }
    else if (key === 'wall'){ g.fillStyle(0xffffff,1); g.fillRect(0,0,40,40); g.generateTexture('wall',40,40) }
    else if (key === 'floor'){ g.fillStyle(0xffffff,1); g.fillRect(0,0,80,80); g.generateTexture('floor',80,80) }
    g.destroy()
  }
  create(){ this.scene.start('Game') }
}

    this.updateCameraZoom()

    this.views = {}
    this.ghostBullets = {}
    this.inputs = {}
    this.worldPlayers = {}
    this.bullets = []
    this.bulletSeq = 0
    this.lastStateSent = 0
    this.lastInputSent = 0
    this.lastAcTick = 0
    this._lastPing = 0
    this._lastVisibleCalc = 0
    this._visibleCache = {}
    this.scores = {}
    this.peerNames = {}
    this._lastLocalShot = 0
    this._lastNameSent = 0

    this.pickups = []
    this.pickupSprites = {}
    this.pickupSeq = 0
    this.lastPickupSpawn = 0

    this.localBonuses = [0, 0, 0, 0, 0]

    this.voteActive = false
    this.voteTarget = null
    this.voteDeadline = 0

    this.peers = new Set()
    this.isHost = false
    this.myPeerId = null

    this.serverHostId = null

    this.ac.identity = this.identity

    this.bonusesEl = document.getElementById('bonuses')
