name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Синтаксис всех скриптов
        run: |
          for f in pixel-orca/js/*.js pixel-orca/server/*.js pixel-orca/tools/*.mjs pixel-orca/sw.js; do
            node --check "$f" || exit 1
          done
          echo "синтаксис ок"

      - name: Тесты клиента, сервера и сквозной прогон
        working-directory: pixel-orca
        run: npm test

      - name: Тест собранной для Pages статики
        working-directory: pixel-orca
        env:
          PO_SERVER_URL: wss://example.invalid/ws
        run: |
          node tools/prepare-pages.mjs
          PO_DIR=dist node tools/smoke-online.mjs
